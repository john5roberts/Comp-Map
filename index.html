function isPlainFingeringCode(code){
  return /^[xX0-9]{6}$/.test(code || "");
}

function isDelimitedFingeringCode(code){
  return /^(?:x|X|\d+)(?:-(?:x|X|\d+)){5}$/.test(code || "");
}

function isFingeringCode(code){
  return isPlainFingeringCode(code) || isDelimitedFingeringCode(code);
}

function fingeringCodeFromFrets(frets){
  if(!Array.isArray(frets) || frets.length !== 6) return "";
  const vals = frets.map(f => f === null || f === undefined ? "x" : String(Number(f)));
  // Use the compact familiar form for ordinary cowboy/low-position grips,
  // e.g. A7 = x02020. If any string uses fret 10 or 11, use delimiters so
  // the saved pattern remains unambiguous.
  if(vals.every(v => v === "x" || /^[0-9]$/.test(v))) return vals.join("");
  return vals.join("-");
}

function fretsFromFingeringCode(code){
  if(!isFingeringCode(code)) return null;
  const parts = isDelimitedFingeringCode(code) ? code.split("-") : code.split("");
  if(parts.length !== 6) return null;
  return parts.map(v => /^x$/i.test(v) ? null : Number(v));
}

function fingeringCodeForBox(box){
  if(!box) return "";
  if(isFingeringCode(box.dataset.fingeringCode || "")) return box.dataset.fingeringCode;
  const tpl = selectedTemplateForArrange(box);
  if(!tpl) return "";
  const rootPc = rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C");
  const code = fingeringCodeFromFrets(absoluteDiagramFrets(tpl, rootPc));
  return code || "";
}

function fingeringTemplateFromCode(box, code){
  const abs = fretsFromFingeringCode(code);
  if(!abs) return null;
  const rootPc = rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C");
  const rootIdx = abs.findIndex((f,i) => f !== null && (STRING_OPEN_PC[i] + f) % 12 === rootPc);
  const idx = rootIdx >= 0 ? rootIdx : abs.findIndex(f => f !== null);
  return {
    id:`saved-${code}`,
    rootString:String(idx >= 0 ? 6 - idx : (box.dataset.rootString || "")),
    name:`${displayName(box.dataset.chord || "Chord")} saved`,
    abs,
    rootIdx:idx >= 0 ? idx : 0,
    saved:true
  };
}

// 1.2.69: Copy/paste text is the source of truth: key header plus any saved six-string fingering codes.
function progressionText(){
  const boxes = Array.from(progressionArea.querySelectorAll(".prog-chord"));
  const body = boxes.map(box => {
    const name = box.dataset.chord || "";
    const type = box.dataset.type || "diatonic";
    const beats = Number(box.dataset.beats || 4);
    const shown = displayName(name);
    const symbol = type === "diatonic" ? shown : `[${shown}]`;
    const code = fingeringCodeForBox(box);
    const fingering = code ? `[${code}]` : "";
    const slashes = Array(Math.max(0, beats - 1)).fill("/").join(" ");
    const chordText = `${symbol}${fingering}`;
    return slashes ? `${chordText} ${slashes}` : chordText;
  }).join("  ");
  const keyLine = `[${currentKeySaveLabel()}]`;
  return body ? `${keyLine}\n\n${body}` : keyLine;
}

// 1.2.39: Selecting a diagram immediately copies the updated progression.
// 1.2.38: Paste appends clipboard contents to the end of the existing progression.
// 1.2.37: Auto-copy the current progression after any edit that changes it.
// This gives a temporary clipboard backup if the page is closed accidentally.
let autoCopyTimer = null;
async function autoCopyProgression(){
  const text = progressionText();
  if(!text) return;
  clearTimeout(autoCopyTimer);
  autoCopyTimer = setTimeout(async ()=>{
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        return;
      }
    } catch(err) {
      // Fall through to execCommand fallback below.
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      ta.remove();
    } catch(err) {}
  }, 40);
}

// 1.2.39: Immediate copy for direct user actions such as selecting a diagram.
// This avoids losing the browser's user-gesture clipboard permission window.
async function copyProgressionNow(){
  const text = progressionText();
  if(!text) return;
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return;
    }
  } catch(err) {
    // Fall through to execCommand fallback below.
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy");
    ta.remove();
  } catch(err) {}
}

let audioCtx=null;
let isPlaying=false;
let playIndex=0;
let playTimeout=null;
let currentPlayingBox=null;
let activeAudioNodes=[];
const BPM=100;
const BEAT_SEC=60/BPM;

const NOTE_MIDI = {
  "C":60,"C#":61,"D♭":61,"Db":61,"D":62,"D#":63,"E♭":63,"Eb":63,"E":64,"F":65,"F#":66,"G♭":66,"Gb":66,
  "G":67,"G#":68,"A♭":68,"Ab":68,"A":69,"A#":70,"B♭":70,"Bb":70,"B":71,"Cb":71
};

function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }

function chordPcsFromName(name){
  name = (name || "C").replace(/^\[/,"").replace(/\]$/,"").trim();

  const rootMatch = name.match(/^[A-G](?:#|♭|b)?/);
  if(!rootMatch) return [60,64,67];

  const rootText = rootMatch[0].replace("b","♭");
  let rootMidi = NOTE_MIDI[rootText] ?? 60;

  // Keep chords in a comfortable register and avoid an octave-dropped bass.
  if(rootMidi < 60) rootMidi += 12;

  const quality = name.slice(rootMatch[0].length);

  let intervals;
  if(/m7♭5|m7b5|ø/.test(quality)){
    intervals = [0,3,6,10];
  } else if(/maj7|M7|Δ/.test(quality)){
    intervals = [0,4,7,11];
  } else if(/^m7/.test(quality)){
    intervals = [0,3,7,10];
  } else if(/7/.test(quality)){
    intervals = [0,4,7,10];
  } else if(/°|dim/.test(quality)){
    intervals = [0,3,6];
  } else if(/^m/.test(quality)){
    intervals = [0,3,7];
  } else {
    intervals = [0,4,7];
  }

  return intervals.map(i => rootMidi + i);
}

function playTone(freq, start, dur, gain=0.08, type="triangle"){
  if(!Number.isFinite(freq)) return;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(gain,start+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  osc.connect(g).connect(audioCtx.destination);
  activeAudioNodes.push(osc, g);
  osc.onended = () => {
    activeAudioNodes = activeAudioNodes.filter(n => n !== osc && n !== g);
  };
  osc.start(start);
  osc.stop(start+dur+0.03);
}

let arpTimeouts=[];
let arpLooping=false;
let arpLoopToken=0;
let arpAudioNodes=[];
let arpLoopNotes=[];
let arpLoopIndex=0;

function stopArpeggioPlayback(){
  arpLooping=false;
  arpLoopToken++;
  arpTimeouts.forEach(id=>clearTimeout(id));
  arpTimeouts=[];
  arpLoopNotes=[];
  arpLoopIndex=0;
  arpAudioNodes.forEach(n=>{
    try{
      if(n && typeof n.stop === "function") n.stop(0);
      if(n && typeof n.disconnect === "function") n.disconnect();
    }catch(err){}
  });
  arpAudioNodes=[];
  if(arrangeFretboardBody){
    arrangeFretboardBody.querySelectorAll(".fb-arp-active").forEach(el=>el.classList.remove("fb-arp-active"));
  }
  if(arrangeFretboardArpBtn){
    arrangeFretboardArpBtn.classList.remove("playing");
    arrangeFretboardArpBtn.textContent="▶";
    arrangeFretboardArpBtn.disabled=false;
  }
}

function clearArpeggioButtonState(){
  stopArpeggioPlayback();
}

function arpeggioNotesFromTemplate(tpl, rootPc, box=null){
  if(!tpl) return [];
  const frets=absoluteDiagramFrets(tpl, rootPc).map(f=>{
    if(f===null || f===undefined) return null;
    const n=Number(f);
    return Number.isFinite(n) ? n : null;
  }).concat([null,null,null,null,null,null]).slice(0,6);
  const notes=[];
  frets.forEach((f,s)=>{
    if(f===null || f<0) return;
    notes.push({m:STRING_OPEN_MIDI[s]+f, string:s, fret:f});
  });
  // Play from low string to high string, matching the displayed voicing.
  return notes.sort((a,b)=>a.string-b.string);
}

function arpeggioMidisFromTemplate(tpl, rootPc, box=null){
  return arpeggioNotesFromTemplate(tpl, rootPc, box).map(x=>x.m);
}

function fretboardMarkerForArpNote(note){
  if(!arrangeFretboardBody) return null;
  const circles=Array.from(arrangeFretboardBody.querySelectorAll(".arrange-fretboard-svg .fb-dot, .arrange-fretboard-svg .fb-open"));
  if(!circles.length) return null;
  // In renderArrangeFretboardHtml the markers are emitted string-order, ignoring muted/out-of-range strings.
  const playable=arpeggioNotesFromTemplate(selectedTemplateForArrange(arrangeFretboardCurrentBox), rootPcFromChordName(arrangeFretboardCurrentBox?.dataset?.chord || arrangeFretboardCurrentBox?.dataset?.baseChord || "C"), arrangeFretboardCurrentBox);
  const idx=playable.findIndex(n=>n.string===note.string && n.fret===note.fret);
  return idx>=0 ? circles[idx] : null;
}

function playArpTone(freq, start, dur, gain=0.085, type="sine"){
  if(!audioCtx || !Number.isFinite(freq)) return;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(gain,start+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  osc.connect(g).connect(audioCtx.destination);
  arpAudioNodes.push(osc,g);
  osc.onended=()=>{
    arpAudioNodes=arpAudioNodes.filter(n=>n!==osc && n!==g);
  };
  osc.start(start);
  osc.stop(start+dur+0.03);
}

function runNextArpStep(token){
  if(!arpLooping || token!==arpLoopToken || !arrangeFretboardCurrentBox) return;
  if(!arpLoopNotes.length){ stopArpeggioPlayback(); return; }

  const ctx=getAudioContext();
  if(!ctx) return;
  audioCtx=ctx;

  if(ctx.state === "suspended"){
    ctx.resume().then(()=>runNextArpStep(token)).catch(()=>{});
    return;
  }

  const note=arpLoopNotes[arpLoopIndex % arpLoopNotes.length];
  const marker=fretboardMarkerForArpNote(note);
  const start=ctx.currentTime + 0.01;
  const noteDur=BEAT_SEC*0.88;

  playArpTone(midiToFreq(note.m), start, noteDur, 0.095, (arpLoopIndex % arpLoopNotes.length)===0 ? "triangle" : "sine");

  if(marker){
    marker.classList.add("fb-arp-active");
    arpTimeouts.push(setTimeout(()=>{
      if(marker) marker.classList.remove("fb-arp-active");
    }, Math.round(noteDur*1000)));
  }

  arpLoopIndex++;
  arpTimeouts.push(setTimeout(()=>runNextArpStep(token), Math.round(BEAT_SEC*1000)));
}

function startCurrentFretboardArpeggioLoop(){
  if(!arrangeFretboardCurrentBox) return;
  const box=arrangeFretboardCurrentBox;
  const rootPc=rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C");
  const tpl=selectedTemplateForArrange(box);
  const notes=arpeggioNotesFromTemplate(tpl, rootPc, box);
  if(!notes.length) return;

  const ctx=getAudioContext();
  if(!ctx) return;
  audioCtx=ctx;

  const actuallyStart=()=>{
    // Reset any prior arpeggio without allowing the duplicate click/touch events to
    // turn the new loop off.
    stopArpeggioPlayback();
    arpLooping=true;
    arpLoopNotes=notes;
    arpLoopIndex=0;
    const token=++arpLoopToken;
    audioCtx=ctx;
    if(arrangeFretboardArpBtn){
      arrangeFretboardArpBtn.classList.add("playing");
      arrangeFretboardArpBtn.textContent="■";
      arrangeFretboardArpBtn.disabled=false;
    }
    runNextArpStep(token);
  };

  // iPhone/Safari requires resume() directly from the tap/click gesture.
  if(ctx.state==="suspended"){
    ctx.resume().then(actuallyStart).catch(()=>{
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(()=>{ actuallyStart(); }).catch(()=>{});
      }catch(err){}
    });
  } else {
    actuallyStart();
  }
}

function playCurrentFretboardArpeggio(){
  startCurrentFretboardArpeggioLoop();
}

function toggleCurrentFretboardArpeggio(){
  if(arpLooping){
    stopArpeggioPlayback();
  } else {
    startCurrentFretboardArpeggioLoop();
  }
}

function playChordHit(midis, start, dur){
  // Slightly stronger voicing for extended chords so 7ths are audible.
  midis.forEach((m,i)=>{
    const gain = i === midis.length - 1 ? 0.062 : 0.052;
    playTone(midiToFreq(m), start, dur, gain, i===0 ? "triangle" : "sine");
  });
}

function playRolledChord(midis, start, dur){
  const spread = Math.min(0.18, BEAT_SEC * 0.30);
  const step = midis.length > 1 ? spread / (midis.length - 1) : 0;
  midis.forEach((m,i)=>{
    const t = start + i * step;
    const remain = Math.max(0.08, dur - i * step);
    const gain = i === midis.length - 1 ? 0.066 : 0.054;
    playTone(midiToFreq(m), t, remain, gain, i===0 ? "triangle" : "sine");
  });
}

function playChordBox(box){
  if(!audioCtx) audioCtx=new (window.AudioContext || window.webkitAudioContext)();

  const name=displayName(box.dataset.chord || "C");
  const beats=Number(box.dataset.beats || 4);
  const dur=beats*BEAT_SEC;
  const now=audioCtx.currentTime+0.02;
  const selectedCode=box.dataset.fingeringCode || "";
  const selectedFrets=isFingeringCode(selectedCode)
    ? fretsFromFingeringCode(selectedCode)
    : null;
  const selectedMidis=Array.isArray(selectedFrets)
    ? selectedFrets
        .map((fret,stringIndex)=>
          fret===null || fret===undefined
            ? null
            : STRING_OPEN_MIDI[stringIndex]+Number(fret)
        )
        .filter(Number.isFinite)
        .sort((a,b)=>a-b)
    : [];
  const midis=selectedMidis.length
    ? selectedMidis
    : chordPcsFromName(name);

  /* Articulate the selected voicing at two notes per beat. Notes cycle from
     low to high and repeat for as many beats as the progression event lasts. */
  const playable=midis.length ? midis : [60];
  const noteStep=BEAT_SEC/2;
  const noteDuration=Math.max(0.08,noteStep*0.82);
  const noteCount=Math.max(1,beats*2);

  for(let index=0;index<noteCount;index++){
    const midi=playable[index%playable.length];
    const t=now+(index*noteStep);
    const gain=index%playable.length===0 ? 0.062 : 0.052;
    playTone(
      midiToFreq(midi),
      t,
      noteDuration,
      gain,
      index%playable.length===0 ? "triangle" : "sine"
    );
  }

  return dur;
}

function clearPlayingHighlight(){
  document.querySelectorAll(".playing-chord").forEach(el=>el.classList.remove("playing-chord"));
  document.querySelectorAll(".playing-arrange").forEach(el=>el.classList.remove("playing-arrange"));

function syncPlaybackPanels(box){
  currentPlayingBox=box || null;

  document.querySelectorAll(".playing-arrange").forEach(el=>el.classList.remove("playing-arrange"));
  const boxes=Array.from(progressionArea.querySelectorAll(".prog-chord"));
  const idx=box ? boxes.indexOf(box) : -1;
  if(arrangeGrid && idx>=0){
    const activeCard=arrangeGrid.querySelector(`.arrange-card[data-prog-index="${idx}"]`);
    if(activeCard){
      activeCard.classList.add("playing-arrange");
      try { activeCard.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"}); } catch(e) {}
    }

  if(box && arrangeFretboardPopup && arrangeFretboardPopup.classList.contains("show")){

    arrangeFretboardPopup.classList.add("playing-fretboard");

}

function stopPlayback(){
  clearArpeggioButtonState();
  isPlaying=false;
  playBtn.classList.remove("active");
  playBtn.textContent="▶";
  currentPlayingBox=null;
  clearPlayingHighlight();
  if(playTimeout) clearTimeout(playTimeout);
  playTimeout=null;
  if(playOverlay) playOverlay.classList.remove("show");

  // Immediately silence all currently sounding or scheduled oscillators.
  activeAudioNodes.forEach(node=>{
    try {
      if(node.stop) node.stop(0);
      if(node.disconnect) node.disconnect();
    } catch(e) {}
  });
  activeAudioNodes=[];

  // Closing the context is the most reliable way to cancel scheduled notes on iOS.
  if(audioCtx && audioCtx.state !== "closed"){
    try { audioCtx.close(); } catch(e) {}
  }
  audioCtx=null;
}

function playNextChord(){
  if(!isPlaying) return;
  const boxes=Array.from(progressionArea.querySelectorAll(".prog-chord"));
  if(boxes.length===0){ stopPlayback(); return; }

  clearPlayingHighlight();
  if(playIndex>=boxes.length) playIndex=0;
  const box=boxes[playIndex];
  box.classList.add("playing-chord");
  syncPlaybackPanels(box);

  const dur=playChordBox(box);
  playIndex++;

  playTimeout=setTimeout(playNextChord, dur*1000);
}

function getAudioContext(){
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if(!audioCtx || audioCtx.state === "closed"){
    audioCtx = new AudioContextClass();
  }
  return audioCtx;
}

function startPlayback(){
  const boxes = Array.from(progressionArea.querySelectorAll(".prog-chord"));
  if(boxes.length === 0) return;

  const ctx = getAudioContext();

  const actuallyStart = () => {
    if(isPlaying) return;
    isPlaying = true;
    playIndex = 0;
    playBtn.classList.add("active");
    playBtn.textContent = "■";
    if(playOverlay) playOverlay.classList.add("show");
    playNextChord();
  };

  if(ctx.state === "suspended"){
    ctx.resume().then(actuallyStart).catch(()=>{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume().then(actuallyStart).catch(()=>{});
    });
  } else {
    actuallyStart();
  }
}

let lastPlayButtonTime = 0;

function handlePlayButton(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
  }

  const now = Date.now();
  if(now - lastPlayButtonTime < 250) return;
  lastPlayButtonTime = now;

  if(isPlaying){
    stopPlayback();
    return;
  }

  startPlayback();
}

<script>
modeSelect?.addEventListener("click",e=>e.stopPropagation());

// 1.2.94: Mode changes preserve the sounding/top tonic and change the parent key.
// Example: C Ionian -> C Phrygian sets the key dropdown to A♭ and shows Cm as i.
function modalBaseRootPc(modeName){
  const off = modeOffsets[modeName] || 0;
  const baseKey = order[off] || "C";
  const baseChord = harmonyData[baseKey] && harmonyData[baseKey].chord ? harmonyData[baseKey].chord : baseKey;
  const m = String(baseChord).match(/^[A-G](?:#|♭|b)?/);
  return m ? (TRANSPOSE_PC[m[0].replaceAll("b","♭")] || 0) : 0;
}
function keyRootForPcValue(pcValue){
  const names = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  return names[((pcValue % 12) + 12) % 12] || "C";
}
function currentModalTonicPc(){
  return (keyOffset() + modalBaseRootPc(currentMode)) % 12;
}
modeSelect?.addEventListener("change",e=>{
  const preservedTonicPc = currentModalTonicPc();
  currentMode=e.target.value || "Ionian";

  // Choose the parent major key that makes the selected mode start on the same tonic.
  selectedKeyRoot = keyRootForPcValue(preservedTonicPc - modalBaseRootPc(currentMode));
  if(keySelect) keySelect.value = selectedKeyRoot;

  currentKey=modalOrder()[0];
  exploreSelectedKey=null;
  buildSelectedKey=null;
  if(active) active.classList.remove("active");
  active=null;
  popup?.classList.remove("show");
  render(currentKey);
  updateProgressionKeyLine?.();
  if(addMode){
    selectedDiatonic=null;
    setBuilderStatus();
  }
});

<script>
// 1.3.6: position the fixed manual-builder frame so its bottom is one static-button height above the static controls.
(function(){
  function manualFrameMetrics(){
    const wrap=document.getElementById('wrap');
    const box=document.querySelector('.manual-box');
    const title=document.getElementById('manualStageTitle');
    const controls=document.querySelector('.builder-controls');
    if(!wrap || !box || !title) return;
    const wr=wrap.getBoundingClientRect();
    const cr=controls ? controls.getBoundingClientRect() : null;
    const controlTop=cr ? (cr.top - wr.top) : (wr.height * 0.72);
    const controlH=cr ? Math.max(38, cr.height) : 52;
    const desiredBottom=Math.max(controlH*2.1, controlTop - controlH);
    const desiredTop=Math.max(46, wr.height * 0.18);
    let h=desiredBottom - desiredTop;
    const minH=Math.min(340, wr.height * 0.42);
    const maxH=Math.max(minH, wr.height * 0.62);
    if(h < minH) h=minH;
    if(h > maxH) h=maxH;
    let top=desiredBottom - h;
    if(top < 42) top=42;
    box.style.top=top+'px';
    box.style.height=h+'px';
    box.style.bottom='auto';
    const titleH=title.getBoundingClientRect().height || 26;
    title.style.top=Math.max(10, top - titleH - 14)+'px';
  }
  window.positionManualBuilderFrame=manualFrameMetrics;
  const wrapFunction=function(name){
    const old=window[name];
    if(typeof old === 'function'){
      window[name]=function(){
        const result=old.apply(this, arguments);
        requestAnimationFrame(manualFrameMetrics);
        setTimeout(manualFrameMetrics, 60);
        return result;
      };
    }
  };
  ['openManualBuilder','showManualIdentityLevel','showManualExtensionLevel','resetManualBuilder'].forEach(wrapFunction);
  window.addEventListener('resize',()=>requestAnimationFrame(manualFrameMetrics));
  document.addEventListener('click',()=>{
    const overlay=document.getElementById('manualOverlay');
    if(overlay && overlay.classList.contains('show')) requestAnimationFrame(manualFrameMetrics);
  }, true);
})();

<script>
/* 1.3.12: Replace the fixed extension menu with a tone selector.
   Root and harmonic identity still establish the core chord; Level 2 now lets
   the user add or alter tones while the strip shows the generated chord. */
(function(){
  const TONE_PC = {"1":0,"♭2":1,"♭9":1,"2":2,"9":2,"#9":3,"♭3":3,"3":4,"4":5,"11":5,"#11":6,"♭5":6,"5":7,"#5":8,"♭13":8,"6":9,"13":9,"♭7":10,"7":11,"𝄫7":9};
  const TONE_ORDER = ["1","♭2","2","♭3","3","4","♭5","5","#5","6","♭7","7","♭9","9","#9","11","#11","♭13","13"];
  const EXTENSION_TONES = ["6","♭7","7","♭9","9","#9","11","#11","♭13","13","♭5","5","#5"];
  const IDENTITY_TONES = {
    "Major":["3"],
    "Minor":["♭3"],
    "Dominant":["3","♭7"],
    "Major 7":["3","7"],
    "Minor 7":["♭3","♭7"],
    "Half diminished":["♭3","♭5","♭7"],
    "Diminished":["♭3","♭5"],
    "Augmented":["3","#5"],
    "Sus2":["2"],
    "Sus4":["4"]
  };
  let manualSelectedTones = [];
  let manualLockedTones = [];

  function uniqueOrdered(labels){
    const seen=new Set();
    return labels.filter(x=>{
      if(!x || seen.has(x)) return false;
      seen.add(x);
      return true;
    }).sort((a,b)=>{
      const ia=TONE_ORDER.indexOf(a), ib=TONE_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
  }
  function baseTonesForIdentity(ident){
    if(!ident || !ident.tones) return [];
    return uniqueOrdered(String(ident.tones).split(/\s+/).filter(Boolean));
  }
  function rootPcForManual(){
    if(!manualSelectedRoot) return 0;
    const normalized=String(manualSelectedRoot).replace(/b/g,"♭");
    return TRANSPOSE_PC[normalized] ?? NOTE_TO_PC[normalized] ?? 0;
  }
  function isToneDiatonic(label){
    const rootPc=rootPcForManual();
    const pc=(rootPc + (TONE_PC[label] ?? 0) + 120)%12;
    return diatonicPcsForCurrentKey().includes(pc);
  }
  function labelHtml(label, omitted=false){
    const classes=[isToneDiatonic(label)?"manual-tone-diatonic":"manual-tone-chromatic"];
    if((IDENTITY_TONES[manualSelectedIdentity?.label] || []).includes(label)) classes.push("manual-tone-identity");
    if(omitted) classes.push("manual-tone-omitted");
    return `<span class="${classes.join(' ')}">${label}</span>`;
  }
  function renderManualToneStrip(){
    if(!manualChordTones) return;
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : (manualSelectedIdentity ? baseTonesForIdentity(manualSelectedIdentity) : (manualSelectedRoot ? ["1"] : [])));
    if(!tones.length){
      manualChordTones.textContent="—";
      return;
    }
    manualChordTones.innerHTML=tones.map(t=>labelHtml(t)).join(" ");
  }
  function chooseSeventh(tones){
    if(tones.includes("7")) return "7";
    if(tones.includes("♭7")) return "♭7";
    if(tones.includes("6")) return "6";
    return "";
  }
  function accidentalSuffix(tones, exclude=new Set()){
    const parts=[];
    ["♭5","#5","♭9","#9","#11","♭13"].forEach(t=>{ if(tones.includes(t) && !exclude.has(t)) parts.push(t); });
    return parts.join("");
  }
  function suffixFromManualTones(){
    if(!manualSelectedIdentity) return "";
    const label=manualSelectedIdentity.label;
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity));
    const has=t=>tones.includes(t);
    const no5=!has("5") && !has("♭5") && !has("#5");
    const omit5=no5 ? "(no5)" : "";

    // 1.3.14: derive the displayed chord name from the selected tone set,
    // not just from the original harmonic identity. This keeps altered/added
    // tones like #9 visible in the chord title, e.g. F#maj7#9 rather than F#maj7.
    const alteredOrder=["♭5","#5","♭9","#9","#11","♭13"];
    const alteredSuffix=(exclude=new Set())=>alteredOrder
      .filter(t=>has(t) && !exclude.has(t))
      .join("");
    const addIf=(tone, text, exclude)=>has(tone) && !exclude.has(tone) ? text : "";

    let suffix=manualSelectedIdentity.suffix || "";

    if(label==="Major"){
      const used=new Set();
      // Selecting ♭7 changes a major triad into a dominant-family chord.
      // This prevents C + Major + ♭7 + ♭9 from being displayed as C♭9,
      // which rootAndSuffix understandably parsed as C-flat 9 (B9).
      if(has("♭7")){
        used.add("♭7");
        if(has("13")){ suffix="13"; used.add("13"); if(has("9")) used.add("9"); if(has("11")) used.add("11"); }
        else if(has("11")){ suffix="11"; used.add("11"); if(has("9")) used.add("9"); }
        else if(has("9")){ suffix="9"; used.add("9"); }
        else suffix="7";
      }
      else if(has("6") && has("9")){ suffix="6/9"; used.add("6"); used.add("9"); }
      else if(has("6")){ suffix="6"; used.add("6"); }
      else if(has("13")){ suffix="maj13"; used.add("7"); used.add("9"); used.add("13"); }
      else if(has("7") && has("9") && has("#11")){ suffix="maj9#11"; used.add("7"); used.add("9"); used.add("#11"); }
      else if(has("7") && has("9")){ suffix="maj9"; used.add("7"); used.add("9"); }
      else if(has("7")){ suffix="maj7"; used.add("7"); }
      else if(has("9")){ suffix="add9"; used.add("9"); }
      else if(has("#11")){ suffix="add#11"; used.add("#11"); }
      else suffix="";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Major 7"){
      const used=new Set(["7"]);
      if(has("13") && has("#11")){ suffix="maj13#11"; used.add("13"); used.add("#11"); used.add("9"); }
      else if(has("13")){ suffix="maj13"; used.add("13"); used.add("9"); }
      else if(has("9") && has("#11")){ suffix="maj9#11"; used.add("9"); used.add("#11"); }
      else if(has("9")){ suffix="maj9"; used.add("9"); }
      else if(has("#11")){ suffix="maj7#11"; used.add("#11"); }
      else suffix="maj7";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + omit5;
    }

    if(label==="Minor"){
      const used=new Set();
      if(has("7")){ suffix="m(maj7)"; used.add("7"); }
      else if(has("13")){ suffix="m13"; used.add("♭7"); used.add("9"); used.add("11"); used.add("13"); }
      else if(has("11")){ suffix="m11"; used.add("♭7"); used.add("9"); used.add("11"); }
      else if(has("9")){ suffix=has("♭7")?"m9":"madd9"; used.add("9"); if(has("♭7")) used.add("♭7"); }
      else if(has("♭7")){ suffix="m7"; used.add("♭7"); }
      else if(has("6")){ suffix=has("9")?"m6/9":"m6"; used.add("6"); if(has("9")) used.add("9"); }
      else suffix="m";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Minor 7"){
      const used=new Set(["♭7"]);
      if(has("13")){ suffix="m13"; used.add("13"); used.add("9"); used.add("11"); }
      else if(has("11")){ suffix="m11"; used.add("11"); used.add("9"); }
      else if(has("9")){ suffix="m9"; used.add("9"); }
      else suffix="m7";
      return suffix + alteredSuffix(used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Dominant"){
      const used=new Set(["♭7"]);
      if(has("13")){ suffix="13"; used.add("13"); if(has("9")) used.add("9"); if(has("11")) used.add("11"); }
      else if(has("11")){ suffix="11"; used.add("11"); if(has("9")) used.add("9"); }
      else if(has("9")){ suffix="9"; used.add("9"); }
      else suffix="7";
      return suffix + alteredSuffix(used) + omit5;
    }

    if(label==="Half diminished"){
      if(has("11")) suffix="m11♭5";
      else if(has("9")) suffix="m9♭5";
      else suffix="m7♭5";
      return suffix + alteredSuffix(new Set(["♭5"]));
    }
    if(label==="Diminished"){
      if(has("𝄫7")) suffix="°7";
      else suffix="°";
      return suffix;
    }
    if(label==="Augmented"){
      const used=new Set(["#5"]);
      if(has("♭7") && has("9")){ suffix="9#5"; used.add("♭7"); used.add("9"); }
      else if(has("♭7")){ suffix="7#5"; used.add("♭7"); }
      else if(has("7") && has("9")){ suffix="+maj9"; used.add("7"); used.add("9"); }
      else if(has("7")){ suffix="+maj7"; used.add("7"); }
      else suffix="+";
      return suffix + alteredSuffix(used);
    }
    if(label==="Sus2"){
      if(has("♭7") && has("9")) return "9sus2" + alteredSuffix(new Set(["♭7","9"]));
      if(has("♭7")) return "7sus2" + alteredSuffix(new Set(["♭7"]));
      return "sus2" + alteredSuffix();
    }
    if(label==="Sus4"){
      if(has("13")) return "13sus4" + alteredSuffix(new Set(["13"]));
      if(has("9")) return "9sus4" + alteredSuffix(new Set(["9"]));
      if(has("♭7")) return "7sus4" + alteredSuffix(new Set(["♭7"]));
      return "sus4" + alteredSuffix();
    }
    return suffix + alteredSuffix();
  }
  function updateManualToneDefinition(){
    const suffix=suffixFromManualTones();
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity));
    manualSelectedExtension={label:"Custom", suffix, tones:tones.join(" "), toneSelector:true};
    if(manualChordName) manualChordName.textContent=manualCurrentChordName();
    if(manualChordFamily) manualChordFamily.textContent=manualSelectedIdentity ? manualSelectedIdentity.family : "";
    renderManualToneStrip();
    if(manualSaveBtn) manualSaveBtn.disabled=!(manualSelectedRoot && manualSelectedIdentity);
  }
  function toneButton(label, locked){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="manual-tone-btn " + (isToneDiatonic(label)?"manual-tone-diatonic":"manual-tone-chromatic");
    if(locked) btn.classList.add("locked-manual-tone");
    btn.textContent=label;
    btn.dataset.tone=label;
    if(manualSelectedTones.includes(label)) btn.classList.add("selected-manual-tone");
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      if(locked) return;
      if(manualSelectedTones.includes(label)){
        manualSelectedTones=manualSelectedTones.filter(t=>t!==label);
      } else {
        // Mutually exclusive groups: pick one spelling/alteration in each slot.
        const groups=[["♭3","3"],["♭5","5","#5"],["6","♭7","7"],["♭9","9","#9"],["11","#11"],["♭13","13"],["2","♭2","4"]];
        for(const g of groups){
          if(g.includes(label)) manualSelectedTones=manualSelectedTones.filter(t=>!g.includes(t) || manualLockedTones.includes(t));
        }
        manualSelectedTones.push(label);
      }
      manualSelectedTones=uniqueOrdered([...manualLockedTones, ...manualSelectedTones]);
      buildManualExtensionGrid();
      updateManualToneDefinition();
      if(window.positionManualBuilderFrame) requestAnimationFrame(window.positionManualBuilderFrame);
    });
    return btn;
  }

  const oldReset=window.resetManualBuilder || resetManualBuilder;
  window.resetManualBuilder=resetManualBuilder=function(){
    manualSelectedTones=[];
    manualLockedTones=[];
    const result=oldReset.apply(this, arguments);
    return result;
  };

  window.manualCurrentTones=manualCurrentTones=function(){
    if(manualSelectedExtension && manualSelectedExtension.tones) return manualSelectedExtension.tones;
    if(manualSelectedIdentity) return uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity)).join(" ");
    return manualSelectedRoot ? "1" : "—";
  };

  window.manualCurrentChordName=manualCurrentChordName=function(){
    return manualChordNameFrom(manualSelectedRoot, manualSelectedIdentity, manualSelectedExtension);
  };

  window.buildManualExtensionGrid=buildManualExtensionGrid=function(){
    if(!manualExtensionGrid || !manualSelectedIdentity) return;
    if(!manualSelectedTones.length){
      // 1.4.13: Lock only the root and the tones that define the selected
      // harmonic identity. The natural fifth remains editable so choosing
      // ♭5 or #5 replaces 5 instead of briefly adding an alteration that is
      // discarded when the locked 5 is restored.
      const identityTones=IDENTITY_TONES[manualSelectedIdentity?.label] || [];
      manualLockedTones=uniqueOrdered(["1", ...identityTones]);
      manualSelectedTones=baseTonesForIdentity(manualSelectedIdentity);
    }
    manualExtensionGrid.innerHTML="";
    manualExtensionGrid.classList.add("manual-tone-selector");
    const all=uniqueOrdered([...manualLockedTones, ...EXTENSION_TONES]);
    all.forEach(label=>manualExtensionGrid.appendChild(toneButton(label, manualLockedTones.includes(label))));
  };

  window.showManualExtensionLevel=showManualExtensionLevel=function(){
    if(manualStageTitle) manualStageTitle.textContent="Extensions";
    if(manualLevelLabel) manualLevelLabel.textContent="";
    if(manualIdentityGrid) manualIdentityGrid.classList.remove("show");
    if(manualExtensionGrid){
      manualExtensionGrid.classList.add("show");
      buildManualExtensionGrid();
    }
    updateManualToneDefinition();
    if(window.positionManualBuilderFrame) requestAnimationFrame(window.positionManualBuilderFrame);
  };
})();
</script>
<script>
/* 1.3.24: robust fretboard close + independent arpeggio playback.
   Fixes two issues from 1.3.23:
   1) openArrangeFretboard() left inline display/visibility/z-index styles on the popup,
      so removing the .show class did not actually hide it.
   2) the Arp button could be visually present without reliably triggering audible WebAudio,
      especially on iOS. This uses a direct pointer/click handler and reads the currently
      displayed fretboard markers as the source of truth. */
(function(){
  const popup = document.getElementById('arrangeFretboardPopup');
  const body = document.getElementById('arrangeFretboardBody');
  const closeBtn = document.getElementById('closeArrangeFretboardBtn');
  const arpBtn = document.getElementById('arrangeFretboardArpBtn');
  if(!popup) return;

  // Match the fixed geometry used by renderArrangeFretboardHtml().
  const OPEN_MIDI = [40,45,50,55,59,64];
  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;
  const BOARD_W=W-LEFT-RIGHT;
  const BOARD_H=H-TOP-BOTTOM;
  const BPM=100;
  const BEAT_SEC=60/BPM;
  let arpCtx=null;
  let arpTimers=[];
  let arpPlaying=false;

  function clearArpVisuals(){
    arpTimers.forEach(t=>clearTimeout(t));
    arpTimers=[];
    if(body) body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));
    if(arpBtn){
      arpBtn.classList.remove('playing');
      arpBtn.disabled=false;
      arpBtn.textContent='▶ Arp';
    }
    arpPlaying=false;
  }

  function forceCloseFretboard(){
    clearArpVisuals();
    popup.classList.remove('show','playing-fretboard');
    document.body.classList.remove('fretboard-modal-open');
    // Remove inline styles that were set with priority when opening the popup.
    popup.style.removeProperty('display');
    popup.style.removeProperty('visibility');
    popup.style.removeProperty('z-index');
    popup.style.removeProperty('pointer-events');
    if(body) body.innerHTML='';
    // Keep older app state from retaining a stale current box when possible.
    try{ if(typeof window.clearArpeggioButtonState==='function') window.clearArpeggioButtonState(); }catch(e){}
  }

  // Publish the fixed closer for any later code that calls the global function.
  window.closeArrangeFretboardPopup = forceCloseFretboard;

  function nearestStringIndex(cx){
    let best=0, bestD=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<bestD){ bestD=d; best=s; }
    }
    return best;
  }

  function displayedArpNotes(){
    if(!body) return [];
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));
      const cy=Number(node.getAttribute('cy'));
      if(!Number.isFinite(cx) || !Number.isFinite(cy)) return;
      const string=nearestStringIndex(cx);
      let fret=0;
      if(node.classList.contains('fb-dot')){
        // Dots are drawn at the midpoint of the fret space: top + boardH*((f-.5)/fretCount).
        // Infer fretCount from visible fret-number labels when possible; default is 12.
        let fretCount=12;
        const fretNums=Array.from(svg.querySelectorAll('.fb-fret-number')).map(n=>Number((n.textContent||'').trim())).filter(Number.isFinite);
        if(fretNums.includes(15)) fretCount=15;
        const approx=((cy-TOP)/BOARD_H)*fretCount + 0.5;
        fret=Math.max(1, Math.round(approx));
      }
      notes.push({midi:OPEN_MIDI[string]+fret, string, fret, node});
    });
    // Low E to high E, matching the displayed voicing from bass to treble.

/* 1.3.25: hard reset the fretboard Close and Arp controls.

(function(){

  let arpBtn = byId('arrangeFretboardArpBtn');

  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;
  const BOARD_W=W-LEFT-RIGHT;
  const BOARD_H=H-TOP-BOTTOM;
  const BPM=100;
  const BEAT_SEC=60/BPM;
  let arpCtx=null;
  let arpTimers=[];
  let arpPlaying=false;

  function clearArp(){
    arpTimers.forEach(t=>clearTimeout(t));
    arpTimers=[];
    body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));
    if(arpBtn){
      arpBtn.classList.remove('playing');
      arpBtn.disabled=false;
      arpBtn.textContent='▶ Arp';
    }
    arpPlaying=false;
  }

  function forceClose(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    clearArp();
    popup.classList.remove('show','playing-fretboard');
    document.body.classList.remove('fretboard-modal-open');
    popup.style.setProperty('display','none','important');
    popup.style.setProperty('visibility','hidden','important');
    popup.style.setProperty('pointer-events','none','important');
    body.innerHTML='';
    try{ window.arrangeFretboardCurrentBox = null; }catch(err){}
    return false;
  }
  window.compMapCloseFretboardNow = forceClose;

  function stringIndexFromCx(cx){
    let best=0, dist=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<dist){ dist=d; best=s; }
    }
    return best;
  }

  function fretCountFromSvg(svg){
    const nums=Array.from(svg.querySelectorAll('.fb-fret-number'))
      .map(n=>Number((n.textContent||'').trim()))
      .filter(Number.isFinite);
    return nums.includes(15) ? 15 : 12;
  }

  function displayedNotes(){
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const fretCount=fretCountFromSvg(svg);
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));
      const cy=Number(node.getAttribute('cy'));
      if(!Number.isFinite(cx) || !Number.isFinite(cy)) return;
      const string=stringIndexFromCx(cx);
      let fret=0;
      if(node.classList.contains('fb-dot')){
        fret=Math.max(1, Math.round(((cy-TOP)/BOARD_H)*fretCount + 0.5));
      }

    });

  }

  function ctx(){
    const Ctx=window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!arpCtx || arpCtx.state==='closed') arpCtx=new Ctx();
    return arpCtx;
  }

  function freq(midi){ return 440*Math.pow(2,(midi-69)/12); }

  function tone(ac, midi, start, dur, gain, type){
    const osc=ac.createOscillator();
    const g=ac.createGain();
    osc.type=type || 'triangle';
    osc.frequency.setValueAtTime(freq(midi), start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(gain, start+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(ac.destination);
    osc.start(start);
    osc.stop(start+dur+0.04);
  }

  function playArp(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(arpPlaying) return false;
    const notes=displayedNotes();
    if(!notes.length) return false;
    const ac=ctx();
    if(!ac) return false;
    try{ if(ac.state==='suspended') ac.resume(); }catch(err){}

    clearArp();
    arpPlaying=true;
    if(arpBtn){
      arpBtn.classList.add('playing');
      arpBtn.disabled=true;
      arpBtn.textContent='■';
    }
    const start=ac.currentTime+0.03;
    const dur=BEAT_SEC*0.88;
    notes.forEach((note,i)=>{
      tone(ac, note.midi, start+i*BEAT_SEC, dur, 0.10, i===0?'triangle':'sine');
      const on=Math.max(0, Math.round((start-ac.currentTime+i*BEAT_SEC)*1000));
      const off=on+Math.round(dur*1000);
      arpTimers.push(setTimeout(()=>note.node.classList.add('fb-arp-active'), on));
      arpTimers.push(setTimeout(()=>note.node.classList.remove('fb-arp-active'), off));
    });
    arpTimers.push(setTimeout(clearArp, Math.ceil((notes.length*BEAT_SEC+0.35)*1000)));
    return false;
  }
  window.compMapPlayFretboardArpNow = playArp;

  function replaceButton(btn, text, handler){
    if(!btn || !btn.parentNode) return btn;
    const fresh=btn.cloneNode(true);
    fresh.textContent=text;
    fresh.disabled=false;
    fresh.removeAttribute('onclick');
    btn.parentNode.replaceChild(fresh, btn);
    fresh.onclick=handler;
    fresh.addEventListener('pointerdown', handler, {capture:true});
    fresh.addEventListener('click', handler, {capture:true});
    fresh.addEventListener('touchend', handler, {capture:true, passive:false});
    return fresh;
  }

  closeBtn = replaceButton(closeBtn, 'Close', forceClose);
  arpBtn = replaceButton(arpBtn, '▶ Arp', playArp);

  // but make sure the replacement buttons remain active after each open.
  const mo=new MutationObserver(()=>{
    if(popup.classList.contains('show')){
      popup.style.setProperty('visibility','visible','important');
      popup.style.setProperty('pointer-events','auto','important');

<script>

  if(!manual || !center || !wrap || !selector || !controls) return;

  function num(v){ return Number.parseFloat(v) || 0; }

  function ensureCue(){
    manual.textContent = 'Manual';
    if(document.body.classList.contains('build-await-target')){
      center.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';
    }
  }

  function layoutManualCue(){
    if(!document.body.classList.contains('build-await-target')) return;
    ensureCue();

    const wr = wrap.getBoundingClientRect();
    const sr = selector.getBoundingClientRect();
    const br = controls.getBoundingClientRect();
    const cs = getComputedStyle(manual);
    const type = num(cs.getPropertyValue('--manual-cue-type')) || num(cs.fontSize) || 20;
    const arrowGap = num(cs.getPropertyValue('--manual-arrow-gap')) || type * .42;
    const lowerGap = num(cs.getPropertyValue('--manual-lower-gap')) || type * .55;

    const manualH = manual.getBoundingClientRect().height || type * 1.72;
    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top','0px','important');
    const centerH = center.getBoundingClientRect().height || type * 2.18;

    // Visual bounds are top of the upper arrow and bottom of the lower Start cue.
    // These two bounds are centered in the available vertical gap.
    const topArrowOffset = type + arrowGap;
    const visualHeight = topArrowOffset + manualH + lowerGap + centerH;
    const gapTop = sr.bottom - wr.top;
    const gapBottom = br.top - wr.top;
    const available = Math.max(0, gapBottom - gapTop);
    const visualTop = gapTop + Math.max(0, (available - visualHeight) / 2);

    const manualTop = visualTop + topArrowOffset;
    const centerTop = manualTop + manualH + lowerGap;

    manual.style.setProperty('left','50%','important');
    manual.style.setProperty('top', manualTop + 'px','important');
    center.style.setProperty('left','50%','important');
    center.style.setProperty('top', centerTop + 'px','important');
  }

  const priorSetBuilderStatus = window.setBuilderStatus;
  if(typeof priorSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){

      layoutManualCue();
    };
  }

  const priorPositionPrompts = window.positionPrompts;
  if(typeof priorPositionPrompts === 'function'){
    window.positionPrompts = function(){
      priorPositionPrompts.apply(this, arguments);
      layoutManualCue();
    };
  }

  setTimeout(layoutManualCue, 120);
})();

      leadSection:lead && lead.closest(".cm-harmony-section"),
      diatonicSection:selector && selector.closest(".cm-harmony-section"),
      subSection:sub && sub.closest(".cm-harmony-section")
    };
  }

  function selectedDiatonic(){
    return document.querySelector(
      "#selector .map-cell.active," +
      "#selector .map-cell.explore-picked," +
      "#selector .map-cell.build-selected"
    );
  }

  function realButtons(container){
    if(!container) return [];
    return Array.from(container.querySelectorAll(".rect")).filter(button=>{
      return !!String(button.dataset.chordName || "").trim();
    });
  }

  function mount(){
    const {
      left,
      leadSection,
      diatonicSection,
      subSection
    }=parts();

    if(!left || !leadSection || !diatonicSection || !subSection){
      return false;
    }

    leadSection.classList.add("cm-leading-zone");
    diatonicSection.classList.add("cm-diatonic-zone");
    subSection.classList.add("cm-substitution-zone");

    if(leadSection.parentElement!==left){
      left.appendChild(leadSection);
    }
    if(subSection.parentElement!==left){
      left.appendChild(subSection);
    }

    return true;
  }

  function sizePanels(){
    const {
      left,
      leadSection,
      subSection
    }=parts();

    if(!left || !leadSection || !subSection) return;

    const exact=Math.round(left.getBoundingClientRect().height*0.30);

    [leadSection,subSection].forEach(section=>{
      section.style.setProperty("height",exact+"px","important");
      section.style.setProperty("min-height",exact+"px","important");
      section.style.setProperty("max-height",exact+"px","important");
    });
  }

  function syncNow(){
    cancelAnimationFrame(syncFrame);
    syncFrame=0;

    if(!mount()) return;

    const {
      workspace,
      lead,
      sub,
      leadSection,
      subSection
    }=parts();

    if(!workspace || !lead || !sub || !leadSection || !subSection) return;

    sizePanels();

    const hasTarget=!!selectedDiatonic();
    const leadVisible=hasTarget && realButtons(lead).length>0;
    const subVisible=hasTarget && realButtons(sub).length>0;

    workspace.classList.toggle("cm-has-diatonic-target",hasTarget);
    leadSection.classList.toggle("cm-zone-visible",leadVisible);
    subSection.classList.toggle("cm-zone-visible",subVisible);
    leadSection.classList.toggle("cm-zone-hidden",!leadVisible);
    subSection.classList.toggle("cm-zone-hidden",!subVisible);

    if(!leadVisible) lead.scrollTop=0;
    if(!subVisible) sub.scrollTop=0;
  }

  function scheduleSync(){
    if(syncFrame) return;
    syncFrame=requestAnimationFrame(syncNow);
  }

  function returnToRest(){
    const {
      workspace,
      selector,
      leadSection,
      subSection
    }=parts();

    selector?.querySelectorAll(
      ".map-cell.active,.map-cell.explore-picked,.map-cell.build-selected"
    ).forEach(button=>{
      button.classList.remove("active","explore-picked","build-selected");
    });

    if(typeof exploreSelectedKey!=="undefined"){
      exploreSelectedKey=null;
    }
    if(typeof buildSelectedKey!=="undefined"){
      buildSelectedKey=null;
    }
    if(typeof uiState!=="undefined"){
      uiState="resting";
    }

    workspace?.classList.remove("cm-has-diatonic-target");
    leadSection?.classList.remove("cm-zone-visible");
    subSection?.classList.remove("cm-zone-visible");
    leadSection?.classList.add("cm-zone-hidden");
    subSection?.classList.add("cm-zone-hidden");

    if(typeof updateDiatonicEmphasis==="function"){
      updateDiatonicEmphasis();
    }
    if(typeof window.cmClearHarmonyExploration==="function"){
      window.cmClearHarmonyExploration();
    }

    scheduleSync();
  }

  function bindSideCycle(container){
    container.addEventListener("pointerdown",event=>{
      const button=event.target.closest(".rect[data-chord-name]");
      if(!button) return;

      button.dataset.cmWasActive=
        button.classList.contains("active") ? "1" : "0";
      button.dataset.cmStageBefore=
        button.dataset.cmExploreStage || "0";
    },true);

    container.addEventListener("click",event=>{
      const button=event.target.closest(".rect[data-chord-name]");
      if(!button) return;

      setTimeout(()=>{
        const wasActive=button.dataset.cmWasActive==="1";
        const stageBefore=Number(button.dataset.cmStageBefore || "0");
        const nowActive=button.classList.contains("active");

        if(wasActive && stageBefore>=3 && !nowActive){
          returnToRest();
          return;
        }

        scheduleSync();
      },0);
    },true);
  }

  function install(){
    if(installed) return;

    const {
      left,
      workspace,
      selector,
      lead,
      sub
    }=parts();

    if(!left || !workspace || !selector || !lead || !sub){
      setTimeout(install,60);
      return;
    }

    installed=true;
    mount();
    sizePanels();
    syncNow();

    selector.addEventListener("click",()=>{
      scheduleSync();
      setTimeout(scheduleSync,80);
    },true);

    workspace.addEventListener("click",()=>{
      scheduleSync();
      setTimeout(scheduleSync,80);
    },true);

    bindSideCycle(lead);
    bindSideCycle(sub);

    mutationObserver=new MutationObserver(scheduleSync);
    mutationObserver.observe(selector,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:["class"]
    });
    mutationObserver.observe(lead,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:["class","data-chord-name"]
    });
    mutationObserver.observe(sub,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:["class","data-chord-name"]
    });

    if(typeof ResizeObserver==="function"){
      resizeObserver=new ResizeObserver(()=>{
        sizePanels();
        scheduleSync();
      });
      resizeObserver.observe(left);
    }else{
      window.addEventListener("resize",()=>{
        sizePanels();
        scheduleSync();
      });
    }

    ["cmBuildLauncher","addBtn"].forEach(id=>{
      const button=document.getElementById(id);
      if(!button) return;
      button.addEventListener("click",()=>{
        scheduleSync();
        setTimeout(scheduleSync,80);
      },true);
    });

    window.cmReturnHarmonyToRest=returnToRest;
    window.cmSyncHarmonyLayout=syncNow;
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,820));
  }else{
    setTimeout(install,820);
  }
})();
</script>

<script id="cmFinalBuildEntryScript1489">
(function installFinalBuildEntry(){
  let installed=false;

  function isResting(){
    const selected=document.querySelector(
      "#selector .map-cell.active,"+
      "#selector .map-cell.explore-picked,"+
      "#selector .map-cell.build-selected"
    );

    const building=
      (typeof addMode!=="undefined" && !!addMode) ||
      document.body.classList.contains("ui-build-target") ||
      document.body.classList.contains("build-await-target");

    return !selected && !building;
  }

  function closeOtherOverlays(){
    [
      "cmProgressionOverlay",
      "cmToolsOverlay",
      "editPopup",
      "infoPopup"
    ].forEach(id=>{
      document.getElementById(id)?.classList.remove("show");
    });

    document.querySelector(".paste-overlay")?.classList.remove("show");
  }

  function createChooser(shell){
    let overlay=document.getElementById("cmBuildMethodOverlay");
    if(overlay) return overlay;

    overlay=document.createElement("section");
    overlay.id="cmBuildMethodOverlay";
    overlay.className="cm-build-method-overlay";
    overlay.setAttribute("aria-hidden","true");
    overlay.innerHTML=
      '<div class="cm-build-method-head">'+
        '<button type="button" class="cm-build-method-close" aria-label="Close chord creation choices">×</button>'+
      '</div>'+
      '<div class="cm-build-method-options">'+
        '<button type="button" class="cm-build-method-option" data-method="diatonic">Diatonic-Centered</button>'+
        '<button type="button" class="cm-build-method-option" data-method="manual">Manual</button>'+
      '</div>';

    shell.appendChild(overlay);
    return overlay;
  }

  function show(overlay){
    closeOtherOverlays();
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
  }

  function hide(overlay){
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden","true");
  }

  function bindLongPress(button,overlay){
    if(!button || button.dataset.cmCreationHoldBound==="1") return;
    button.dataset.cmCreationHoldBound="1";

    let timer=0;
    let pointerId=null;
    let startX=0;
    let startY=0;
    let fired=false;

    function cancel(){
      clearTimeout(timer);
      timer=0;
      pointerId=null;
      button.classList.remove("cm-hold-active");
    }

    button.addEventListener("pointerdown",event=>{
      if(event.pointerType==="mouse" && event.button!==0) return;
      if(!isResting()) return;

      pointerId=event.pointerId;
      startX=event.clientX;
      startY=event.clientY;
      fired=false;
      button.classList.add("cm-hold-active");

      timer=setTimeout(()=>{
        fired=true;
        button._cmCreationHoldHandled=true;
        button.classList.remove("cm-hold-active");
        show(overlay);

        if(navigator.vibrate){
          try{navigator.vibrate(20)}catch(_){}
        }
      },550);
    });

    button.addEventListener("pointermove",event=>{
      if(pointerId!==event.pointerId) return;
      if(Math.hypot(event.clientX-startX,event.clientY-startY)>10){
        cancel();
      }
    });

    button.addEventListener("pointerup",event=>{
      if(pointerId!==event.pointerId) return;
      clearTimeout(timer);
      timer=0;
      pointerId=null;
      button.classList.remove("cm-hold-active");

      if(fired){
        event.preventDefault();
        event.stopPropagation();
      }
    });

    button.addEventListener("pointercancel",cancel);
    button.addEventListener("contextmenu",event=>{
      if(isResting()) event.preventDefault();
    });

    /* Prevent the long press from also opening the normal Progression popup. */
    button.addEventListener("click",event=>{
      if(!button._cmCreationHoldHandled) return;
      button._cmCreationHoldHandled=false;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
    },true);
  }

  function install(){
    if(installed) return;

    const shell=document.getElementById("cmShell");
    const progressionButton=document.getElementById("cmCurrentProgression");
    const addButton=document.getElementById("addBtn");
    const manualButton=document.getElementById("manualVoicingBtn");

    if(!shell || !progressionButton || !addButton || !manualButton){
      setTimeout(install,60);
      return;
    }

    installed=true;

    /* Remove any launcher created before this consolidated controller starts. */
    document.getElementById("cmBuildLauncher")?.remove();

    addButton.setAttribute("aria-hidden","true");
    addButton.tabIndex=-1;

    const overlay=createChooser(shell);
    const close=overlay.querySelector(".cm-build-method-close");

    close.addEventListener("click",event=>{
      event.preventDefault();
      event.stopPropagation();
      hide(overlay);
    });

    overlay.addEventListener("click",event=>{
      const option=event.target.closest(".cm-build-method-option");
      if(!option) return;

      event.preventDefault();
      event.stopPropagation();
      hide(overlay);

      if(option.dataset.method==="diatonic"){
        addButton.click();
      }else if(option.dataset.method==="manual"){
        manualButton.click();
      }
    });

    /* Long press now belongs only to the Progression button.
       Diatonic chords retain ordinary Explore taps with no hold action. */
    bindLongPress(progressionButton,overlay);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,900));
  }else{
    setTimeout(install,900);
  }
})();
</script>

<script id="cmSharedPopupManager1490">
(function installSharedPopupManager(){
  let installed=false;
  const definitions=[
    {
      overlay:"#cmProgressionOverlay",
      triggers:["#cmCurrentProgression"],
      launcher:"#cmCurrentProgression"
    },
    {
      overlay:"#cmToolsOverlay",
      triggers:["#cmToolsLauncher"],
      launcher:"#cmToolsLauncher"
    },
    {
      overlay:"#cmBuildMethodOverlay",
      triggers:[],
      launcher:null
    },
    {
      overlay:"#editPopup",
      triggers:[".cm-voicing-define"],
      launcher:null
    },
    {
      overlay:"#infoPopup,.popup.cm-harmony-info-overlay",
      triggers:["#leftStack .rect","#rightStack .rect","#selector .map-cell"],
      launcher:null
    },
    {
      overlay:".paste-overlay",
      triggers:["#pasteBtn"],
      launcher:null
    }
  ];

  function resolve(selector){
    return selector ? document.querySelector(selector) : null;
  }

  function overlayFor(definition){
    return resolve(definition.overlay);
  }

  function launcherFor(definition){
    return resolve(definition.launcher);
  }

  function isOpen(element){
    return !!element && element.classList.contains("show");
  }

  function close(definition){
    const overlay=overlayFor(definition);
    if(!overlay) return;

    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden","true");

    const launcher=launcherFor(definition);
    if(launcher){
      launcher.classList.remove("is-open");
      launcher.setAttribute("aria-expanded","false");
    }
  }

  function closeOthers(activeOverlay){
    definitions.forEach(definition=>{
      const overlay=overlayFor(definition);
      if(overlay && overlay!==activeOverlay && isOpen(overlay)){
        close(definition);
      }
    });
  }

  function containingDefinition(target){
    return definitions.find(definition=>{
      const overlay=overlayFor(definition);
      const launcher=launcherFor(definition);
      return (overlay && overlay.contains(target)) ||
             (launcher && launcher.contains(target));
    }) || null;
  }

  function triggeredDefinition(target){
    return definitions.find(definition=>
      definition.triggers.some(selector=>target.closest(selector))
    ) || null;
  }

  function observeAll(){
    definitions.forEach(definition=>{
      const overlay=overlayFor(definition);
      if(!overlay || overlay.dataset.cmPopupManaged==="1") return;

      overlay.dataset.cmPopupManaged="1";
      new MutationObserver(()=>{
        if(isOpen(overlay)) closeOthers(overlay);
      }).observe(overlay,{
        attributes:true,
        attributeFilter:["class"]
      });
    });
  }

  function install(){
    if(installed) return;
    installed=true;

    observeAll();

    /* Popups are created at different startup times. Observe the shell once
       rather than giving every popup its own document-level listeners. */
    const shell=document.getElementById("cmShell") || document.body;
    new MutationObserver(observeAll).observe(shell,{
      childList:true,
      subtree:true
    });

    document.addEventListener("keydown",event=>{
      if(event.key!=="Escape") return;

      /* Close the visually highest open managed popup. */
      const open=definitions
        .map(definition=>({
          definition,
          overlay:overlayFor(definition)
        }))
        .filter(item=>isOpen(item.overlay))
        .sort((a,b)=>{
          const za=Number(getComputedStyle(a.overlay).zIndex)||0;
          const zb=Number(getComputedStyle(b.overlay).zIndex)||0;
          return zb-za;
        });

      if(open[0]) close(open[0].definition);
    });

    document.addEventListener("pointerdown",event=>{
      const inside=containingDefinition(event.target);
      if(inside) return;

      const triggered=triggeredDefinition(event.target);
      const targetOverlay=triggered ? overlayFor(triggered) : null;

      definitions.forEach(definition=>{
        const overlay=overlayFor(definition);
        if(!overlay || !isOpen(overlay)) return;
        if(overlay===targetOverlay) return;
        close(definition);
      });
    },true);

    window.cmPopupManager={
      closeAll(){
        definitions.forEach(close);
      },
      closeOthers,
      refresh:observeAll
    };
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,420));
  }else{
    setTimeout(install,420);
  }
})();
</script>

<script id="cmProgressionStabilizationScript1500">
(function installProgressionStabilization(){
  let installed=false;
  let previousCount=0;
  let summaryFrame=0;

  function progression(){
    return document.getElementById("progressionArea");
  }

  function boxes(){
    const area=progression();
    return area
      ? Array.from(area.querySelectorAll(".prog-chord"))
      : [];
  }

  function chordName(box){
    if(!box) return "";
    if(typeof chordDisplayNameForVoicing==="function"){
      return chordDisplayNameForVoicing(box);
    }
    const value=box.dataset.chord || box.dataset.baseChord || "";
    return value && typeof displayName==="function"
      ? displayName(value)
      : value;
  }

  function summaryNames(){
    return boxes().map(chordName).filter(Boolean);
  }

  function summaryLines(names){
    if(!names.length) return ["Progression"];

    const lines=[];
    let index=0;

    for(let lineIndex=0;lineIndex<3 && index<names.length;lineIndex++){
      const remainingNames=names.length-index;
      const remainingLines=3-lineIndex;
      const take=Math.ceil(remainingNames/remainingLines);
      lines.push(names.slice(index,index+take).join(", "));
      index+=take;
    }

    return lines;
  }

  function label(){
    return document.querySelector(
      "#cmCurrentProgression .cm-current-progression-label"
    );
  }

  function refreshSummary(){
    cancelAnimationFrame(summaryFrame);
    summaryFrame=0;

    const output=label();
    if(!output) return;

    const names=summaryNames();
    const lines=summaryLines(names);
    const signature=lines.join("\n");
    const renderedLines=Array.from(
      output.querySelectorAll(":scope > .cm-progression-summary-line")
    );
    const renderedSignature=renderedLines
      .map(line=>line.textContent || "")
      .join("\n");

    /* Older code may replace the summary with the most recently selected
       chord. Rebuild whenever the actual rendered content no longer matches,
       even when the progression signature itself has not changed. */
    if(
      output.dataset.cmSummarySignature===signature &&
      renderedSignature===signature &&
      renderedLines.length===lines.length
    ){
      return;
    }

    output.dataset.cmSummarySignature=signature;
    output.classList.toggle("cm-progression-summary-empty",names.length===0);
    output.replaceChildren(
      ...lines.map(value=>{
        const line=document.createElement("span");
        line.className="cm-progression-summary-line";
        line.textContent=value;
        return line;
      })
    );
  }

  function scheduleSummary(){
    if(summaryFrame) return;
    summaryFrame=requestAnimationFrame(refreshSummary);
  }

  function selectBox(box){
    const area=progression();
    if(!box || !area || !area.contains(box)) return;

    if(typeof window.cmSynchronizeChordVoicingState==="function"){
      window.cmSynchronizeChordVoicingState(box,{
        source:"progression",
        refreshFretboard:false
      });
      return;
    }

    window.cmCurrentProgressionBox=box;
    if(typeof editingChord!=="undefined") editingChord=box;
    if(typeof currentEngineVoicingBox!=="undefined"){
      currentEngineVoicingBox=box;
    }
    boxes().forEach(item=>{
      item.classList.toggle("edit-selected",item===box);
    });
  }

  function openProgression(box){
    const overlay=document.getElementById("cmProgressionOverlay");
    const launcher=document.getElementById("cmCurrentProgression");
    if(!overlay || !launcher) return;

    if(box) selectBox(box);
    refreshSummary();

    if(window.cmPopupManager?.closeOthers){
      window.cmPopupManager.closeOthers(overlay);
    }

    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
    launcher.classList.add("is-open");
    launcher.setAttribute("aria-expanded","true");

    if(box){
      requestAnimationFrame(()=>{
        box.scrollIntoView({block:"center",behavior:"auto"});
      });
    }
  }

  function currentBox(){
    const all=boxes();
    const area=progression();
    const candidates=[
      window.cmCurrentProgressionBox,
      typeof currentEngineVoicingBox!=="undefined"
        ? currentEngineVoicingBox
        : null,
      typeof editingChord!=="undefined"
        ? editingChord
        : null,
      all.find(item=>item.classList.contains("edit-selected")),
      all[all.length-1]
    ];

    return candidates.find(box=>box && area?.contains(box)) || null;
  }

  function install(){
    if(installed) return;

    const area=progression();
    const launcher=document.getElementById("cmCurrentProgression");
    const overlay=document.getElementById("cmProgressionOverlay");
    const view=document.getElementById("arrangeBtn");
    const voicing=document.getElementById("diagramPopup");

    if(!area || !launcher || !overlay || !view || !voicing){
      setTimeout(install,60);
      return;
    }

    installed=true;
    previousCount=boxes().length;
    refreshSummary();

    /* Keep the summary authoritative even when older selection code writes a
       single chord name into the compact button. */
    const output=label();
    if(output){
      new MutationObserver(()=>{
        if(!output.querySelector(".cm-progression-summary-line")){
          scheduleSummary();
        }
      }).observe(output,{
        childList:true,
        characterData:true,
        subtree:true
      });
    }

    new MutationObserver(()=>{
      const all=boxes();
      const count=all.length;
      scheduleSummary();

      if(count>previousCount){
        const added=all[all.length-1] || null;
        setTimeout(()=>openProgression(added),0);
      }

      previousCount=count;
    }).observe(area,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:[
        "data-chord",
        "data-base-chord",
        "data-beats",
        "data-fingering-code",
        "class"
      ]
    });

    area.addEventListener("click",event=>{
      const box=event.target.closest(".prog-chord");
      if(!box) return;
      selectBox(box);
      setTimeout(()=>{
        refreshSummary();
        openProgression(box);
      },0);
    },true);

    /* Tools → View uses the dedicated progression-voicing viewer. */
    view.addEventListener("click",event=>{
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      if(typeof window.cmOpenProgressionVoicingView==="function"){
        window.cmOpenProgressionVoicingView();
      }
    },true);

    /* Beat, Replace, and Delete remain in the popup after their original
       handlers complete. */
    const actions=document.getElementById("cmProgressionEditActions");
    if(actions){
      actions.addEventListener("click",()=>{
        setTimeout(()=>{
          refreshSummary();
          openProgression(currentBox());
        },40);
      },true);
    }

    window.cmOpenProgressionPopup=openProgression;
    window.cmRefreshProgressionSummary=refreshSummary;
  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      ()=>setTimeout(install,1020)
    );
  }else{
    setTimeout(install,1020);
  }
})();
</script>

<script>
/* 1.3.27: make fretboard Arp truly loop as a toggle.
   This final override intentionally replaces the 1.3.25 one-shot Arp handler,
   which disabled the button and cleared playback after one pass. */
(function(){
  function byId(id){ return document.getElementById(id); }
  const popup = byId('arrangeFretboardPopup');
  const body = byId('arrangeFretboardBody');
  if(!popup || !body) return;

  const OPEN_MIDI = [40,45,50,55,59,64];
  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;
  const BOARD_W=W-LEFT-RIGHT;
  const BOARD_H=H-TOP-BOTTOM;
  const BPM=100;
  const BEAT_SEC=60/BPM;
  let arpCtx=null;
  let arpTimers=[];
  let arpNodes=[];
  let arpLooping=false;
  let arpToken=0;

  function currentArpButton(){ return byId('arrangeFretboardArpBtn'); }
  function currentCloseButton(){ return byId('closeArrangeFretboardBtn'); }

  function resetArpButton(){
    const btn=currentArpButton();
    if(btn){
      btn.classList.remove('playing');
      btn.disabled=false;
      btn.textContent='▶ Loop';
      btn.setAttribute('aria-label','Start looping chord arpeggio');
    }
  }

  function stopLoop(){
    arpLooping=false;
    arpToken++;
    arpTimers.forEach(t=>clearTimeout(t));
    arpTimers=[];
    body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));
    arpNodes.forEach(n=>{
      try{ if(n && typeof n.stop==='function') n.stop(0); }catch(e){}
      try{ if(n && typeof n.disconnect==='function') n.disconnect(); }catch(e){}
    });
    arpNodes=[];
    resetArpButton();
  }

  function forceClose(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    stopLoop();
    popup.classList.remove('show','playing-fretboard');
    document.body.classList.remove('fretboard-modal-open');
    popup.style.setProperty('display','none','important');
    popup.style.setProperty('visibility','hidden','important');
    popup.style.setProperty('pointer-events','none','important');
    body.innerHTML='';
    try{ window.arrangeFretboardCurrentBox=null; }catch(err){}
    return false;
  }

  function stringIndexFromCx(cx){
    let best=0, dist=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<dist){ dist=d; best=s; }
    }
    return best;
  }

  function fretCountFromSvg(svg){
    const nums=Array.from(svg.querySelectorAll('.fb-fret-number'))
      .map(n=>Number((n.textContent||'').trim()))
      .filter(Number.isFinite);
    return nums.includes(15) ? 15 : 12;
  }

  function displayedNotes(){
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const fretCount=fretCountFromSvg(svg);
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));
      const cy=Number(node.getAttribute('cy'));
      if(!Number.isFinite(cx) || !Number.isFinite(cy)) return;
      const string=stringIndexFromCx(cx);
      let fret=0;
      if(node.classList.contains('fb-dot')){
        fret=Math.max(1, Math.round(((cy-TOP)/BOARD_H)*fretCount + 0.5));
      }
      notes.push({midi:OPEN_MIDI[string]+fret, string, fret, node});
    });
    return notes.sort((a,b)=>a.string-b.string);
  }

  function getCtx(){
    const Ctx=window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!arpCtx || arpCtx.state==='closed') arpCtx=new Ctx();
    return arpCtx;
  }

  function freq(midi){ return 440*Math.pow(2,(midi-69)/12); }

  function tone(ac, midi, start, dur, gain, type){
    const osc=ac.createOscillator();
    const g=ac.createGain();
    osc.type=type || 'triangle';
    osc.frequency.setValueAtTime(freq(midi), start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(gain, start+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(ac.destination);
    arpNodes.push(osc,g);
    osc.onended=()=>{ arpNodes=arpNodes.filter(n=>n!==osc && n!==g); };
    osc.start(start);
    osc.stop(start+dur+0.04);
  }

  function scheduleCycle(ac, token){
    if(!arpLooping || token!==arpToken || !popup.classList.contains('show')) return;
    const notes=displayedNotes();
    if(!notes.length){ stopLoop(); return; }
    body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));

    const start=ac.currentTime+0.035;
    const dur=BEAT_SEC*0.88;
    notes.forEach((note,i)=>{
      tone(ac, note.midi, start+i*BEAT_SEC, dur, 0.10, i===0?'triangle':'sine');
      const on=Math.max(0, Math.round((start-ac.currentTime+i*BEAT_SEC)*1000));
      const off=on+Math.round(dur*1000);
      arpTimers.push(setTimeout(()=>{
        if(arpLooping && token===arpToken) note.node.classList.add('fb-arp-active');
      }, on));
      arpTimers.push(setTimeout(()=>{
        note.node.classList.remove('fb-arp-active');
      }, off));
    });

    // Schedule the next cycle after the final quarter note begins plus its duration.
    const cycleMs=Math.ceil(((notes.length-1)*BEAT_SEC + dur + 0.08)*1000);
    arpTimers.push(setTimeout(()=>scheduleCycle(ac, token), cycleMs));
  }

  function startLoop(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    const ac=getCtx();
    if(!ac) return false;
    const notes=displayedNotes();
    if(!notes.length) return false;

    const begin=()=>{
      stopLoop();
      arpLooping=true;
      const token=++arpToken;
      const btn=currentArpButton();
      if(btn){
        btn.classList.add('playing');
        btn.disabled=false;
        btn.textContent='■ Stop';
        btn.setAttribute('aria-label','Stop chord arpeggio');
      }
      scheduleCycle(ac, token);
    };

    try{
      if(ac.state==='suspended') ac.resume().then(begin).catch(begin);
      else begin();
    }catch(err){ begin(); }
    return false;
  }

  function toggleLoop(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(arpLooping) stopLoop();
    else startLoop(e);
    return false;
  }

  function replaceButton(btn, label, handler){
    if(!btn || !btn.parentNode) return null;
    const fresh=btn.cloneNode(true);
    fresh.textContent=label;
    fresh.disabled=false;
    fresh.removeAttribute('onclick');
    btn.parentNode.replaceChild(fresh, btn);
    // True toggle behavior: one tap/click starts the loop; the next tap/click stops it.
    // Do not bind pointerdown/touchstart/touchend here, because on iPhone those make
    // the button act like a press-and-hold momentary control.
    fresh.addEventListener('click', handler, {capture:true});
    fresh.style.touchAction='manipulation';
    return fresh;
  }

  function wireButtons(){
    replaceButton(currentArpButton(), arpLooping ? '■ Stop' : '▶ Loop', toggleLoop);
    replaceButton(currentCloseButton(), 'Close', forceClose);
  }

  window.compMapStopFretboardArpLoop=stopLoop;
  window.compMapCloseFretboardNow=forceClose;
  window.compMapPlayFretboardArpNow=toggleLoop;

  wireButtons();
  const mo=new MutationObserver(()=>{
    if(popup.classList.contains('show')){
      popup.style.setProperty('visibility','visible','important');
      popup.style.setProperty('pointer-events','auto','important');
      wireButtons();
      const btn=currentArpButton();
      if(btn){
        btn.classList.toggle('playing', arpLooping);
        btn.textContent=arpLooping ? '■ Stop' : '▶ Loop';
        btn.disabled=false;
      }
    } else {
      stopLoop();
    }
  });
  mo.observe(popup,{attributes:true,attributeFilter:['class','style']});
})();
</script>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const selector = document.getElementById('selector');
  const controls = document.querySelector('.builder-controls');
  const manual = document.getElementById('manualBtn');
  const center = document.getElementById('promptCenter');
  if(!wrap || !selector || !controls || !manual || !center) return;

  function px(v){ return (Number.parseFloat(v) || 0); }

  function lockManualCluster(){
    if(!document.body.classList.contains('build-await-target')) return;
    manual.textContent = 'Manual';
    center.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';

    const wr = wrap.getBoundingClientRect();
    const sr = selector.getBoundingClientRect();
    const br = controls.getBoundingClientRect();
    const ms = getComputedStyle(manual);
    const type = px(ms.getPropertyValue('--manual-cue-type')) || px(ms.fontSize) || 20;
    const arrowGap = type * .42;
    const lowerGap = type * .55;
    const manualH = manual.getBoundingClientRect().height || type * 1.72;

    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top','0px','important');
    const centerH = center.getBoundingClientRect().height || type * 2.18;

    const topArrowOffset = type + arrowGap;
    const visualHeight = topArrowOffset + manualH + lowerGap + centerH;
    const gapTop = sr.bottom - wr.top;
    const gapBottom = br.top - wr.top;
    const visualTop = gapTop + Math.max(0, ((gapBottom - gapTop) - visualHeight) / 2);
    const manualTop = visualTop + topArrowOffset;
    const centerTop = manualTop + manualH + lowerGap;

    manual.style.setProperty('left','50%','important');
    manual.style.setProperty('transform','translateX(-50%)','important');
    manual.style.setProperty('top', manualTop + 'px','important');
    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top', centerTop + 'px','important');
  }

  function lockSoon(){
    lockManualCluster();
    requestAnimationFrame(lockManualCluster);
    setTimeout(lockManualCluster, 0);
    setTimeout(lockManualCluster, 80);
  }

  const prevSetBuilderStatus = window.setBuilderStatus;
  if(typeof prevSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){
      const out = prevSetBuilderStatus.apply(this, arguments);
      lockSoon();
      return out;
    };
  }

  const prevPositionPrompts = window.positionPrompts;
  if(typeof prevPositionPrompts === 'function'){
    window.positionPrompts = function(){
      const out = prevPositionPrompts.apply(this, arguments);
      lockSoon();
      return out;
    };
  }
