<script>
/* 1.3.12: Replace the fixed extension menu with a tone selector.
   Root and harmonic identity still establish the core chord; Level 2 now lets
   the user add or alter tones while the strip shows the generated chord. */
(function(){
  const TONE_PC = {"1":0,"♭2":1,"♭9":1,"2":2,"9":2,"#9":3,"♭3":3,"3":4,"4":5,"11":5,"#11":6,"♭5":6,"5":7,"#5":8,"♭13":8,"6":9,"13":9,"♭7":10,"7":11,"𝄫7":9};
  const TONE_ORDER = ["1","♭2","2","♭3","3","4","♭5","5","#5","6","♭7","7","♭9","9","#9","11","#11","♭13","13"];
  const EXTENSION_TONES = ["6","♭7","7","♭9","9","#9","11","#11","♭13","13","♭5","5","#5"];
  const IDENTITY_TONES = {
    "Major":["3"],
    "Minor":["♭3"],
    "Dominant":["3","♭7"],
    "Major 7":["3","7"],
    "Minor 7":["♭3","♭7"],
    "Half diminished":["♭3","♭5","♭7"],
    "Diminished":["♭3","♭5"],
    "Augmented":["3","#5"],
    "Sus2":["2"],
    "Sus4":["4"]
  };
  let manualSelectedTones = [];
  let manualLockedTones = [];

  function uniqueOrdered(labels){
    const seen=new Set();
    return labels.filter(x=>{
      if(!x || seen.has(x)) return false;
      seen.add(x);
      return true;
    }).sort((a,b)=>{
      const ia=TONE_ORDER.indexOf(a), ib=TONE_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
  }
  function baseTonesForIdentity(ident){
    if(!ident || !ident.tones) return [];
    return uniqueOrdered(String(ident.tones).split(/\s+/).filter(Boolean));
  }
  function rootPcForManual(){
    if(!manualSelectedRoot) return 0;
    const normalized=String(manualSelectedRoot).replace(/b/g,"♭");
    return TRANSPOSE_PC[normalized] ?? NOTE_TO_PC[normalized] ?? 0;
  }
  function isToneDiatonic(label){
    const rootPc=rootPcForManual();
    const pc=(rootPc + (TONE_PC[label] ?? 0) + 120)%12;
    return diatonicPcsForCurrentKey().includes(pc);
  }
  function labelHtml(label, omitted=false){
    const classes=[isToneDiatonic(label)?"manual-tone-diatonic":"manual-tone-chromatic"];
    if((IDENTITY_TONES[manualSelectedIdentity?.label] || []).includes(label)) classes.push("manual-tone-identity");
    if(omitted) classes.push("manual-tone-omitted");
    return `<span class="${classes.join(' ')}">${label}</span>`;
  }
  function renderManualToneStrip(){
    if(!manualChordTones) return;
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : (manualSelectedIdentity ? baseTonesForIdentity(manualSelectedIdentity) : (manualSelectedRoot ? ["1"] : [])));
    if(!tones.length){
      manualChordTones.textContent="—";
      return;
    }
    manualChordTones.innerHTML=tones.map(t=>labelHtml(t)).join(" ");
  }
  function chooseSeventh(tones){
    if(tones.includes("7")) return "7";
    if(tones.includes("♭7")) return "♭7";
    if(tones.includes("6")) return "6";
    return "";
  }
  function accidentalSuffix(tones, exclude=new Set()){
    const parts=[];
    ["♭5","#5","♭9","#9","#11","♭13"].forEach(t=>{ if(tones.includes(t) && !exclude.has(t)) parts.push(t); });
    return parts.join("");
  }
  function suffixFromManualTones(){
    if(!manualSelectedIdentity) return "";
    const label=manualSelectedIdentity.label;
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity));
    const has=t=>tones.includes(t);
    const no5=!has("5") && !has("♭5") && !has("#5");
    const omit5=no5 ? "(no5)" : "";

    // 1.3.14: derive the displayed chord name from the selected tone set,
    // not just from the original harmonic identity. This keeps altered/added
    // tones like #9 visible in the chord title, e.g. F#maj7#9 rather than F#maj7.
    const alteredOrder=["♭5","#5","♭9","#9","#11","♭13"];
    const alteredSuffix=(exclude=new Set())=>alteredOrder
      .filter(t=>has(t) && !exclude.has(t))
      .join("");
    const addIf=(tone, text, exclude)=>has(tone) && !exclude.has(tone) ? text : "";

    let suffix=manualSelectedIdentity.suffix || "";

    if(label==="Major"){
      const used=new Set();
      if(has("6") && has("9")){ suffix="6/9"; used.add("6"); used.add("9"); }
      else if(has("6")){ suffix="6"; used.add("6"); }
      else if(has("13")){ suffix="maj13"; used.add("7"); used.add("9"); used.add("13"); }
      else if(has("7") && has("9") && has("#11")){ suffix="maj9#11"; used.add("7"); used.add("9"); used.add("#11"); }
      else if(has("7") && has("9")){ suffix="maj9"; used.add("7"); used.add("9"); }
      else if(has("7")){ suffix="maj7"; used.add("7"); }
      else if(has("9")){ suffix="add9"; used.add("9"); }
      else if(has("#11")){ suffix="add#11"; used.add("#11"); }
      else suffix="";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Major 7"){
      const used=new Set(["7"]);
      if(has("13") && has("#11")){ suffix="maj13#11"; used.add("13"); used.add("#11"); used.add("9"); }
      else if(has("13")){ suffix="maj13"; used.add("13"); used.add("9"); }
      else if(has("9") && has("#11")){ suffix="maj9#11"; used.add("9"); used.add("#11"); }
      else if(has("9")){ suffix="maj9"; used.add("9"); }
      else if(has("#11")){ suffix="maj7#11"; used.add("#11"); }
      else suffix="maj7";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + omit5;
    }

    if(label==="Minor"){
      const used=new Set();
      if(has("7")){ suffix="m(maj7)"; used.add("7"); }
      else if(has("13")){ suffix="m13"; used.add("♭7"); used.add("9"); used.add("11"); used.add("13"); }
      else if(has("11")){ suffix="m11"; used.add("♭7"); used.add("9"); used.add("11"); }
      else if(has("9")){ suffix=has("♭7")?"m9":"madd9"; used.add("9"); if(has("♭7")) used.add("♭7"); }
      else if(has("♭7")){ suffix="m7"; used.add("♭7"); }
      else if(has("6")){ suffix=has("9")?"m6/9":"m6"; used.add("6"); if(has("9")) used.add("9"); }
      else suffix="m";
      return suffix + alteredSuffix(used) + addIf("11","add11",used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Minor 7"){
      const used=new Set(["♭7"]);
      if(has("13")){ suffix="m13"; used.add("13"); used.add("9"); used.add("11"); }
      else if(has("11")){ suffix="m11"; used.add("11"); used.add("9"); }
      else if(has("9")){ suffix="m9"; used.add("9"); }
      else suffix="m7";
      return suffix + alteredSuffix(used) + addIf("13","add13",used) + omit5;
    }

    if(label==="Dominant"){
      const used=new Set(["♭7"]);
      if(has("13")){ suffix="13"; used.add("13"); if(has("9")) used.add("9"); if(has("11")) used.add("11"); }
      else if(has("11")){ suffix="11"; used.add("11"); if(has("9")) used.add("9"); }
      else if(has("9")){ suffix="9"; used.add("9"); }
      else suffix="7";
      return suffix + alteredSuffix(used) + omit5;
    }

    if(label==="Half diminished"){
      if(has("11")) suffix="m11♭5";
      else if(has("9")) suffix="m9♭5";
      else suffix="m7♭5";
      return suffix + alteredSuffix(new Set(["♭5"]));
    }
    if(label==="Diminished"){
      if(has("𝄫7")) suffix="°7";
      else suffix="°";
      return suffix;
    }
    if(label==="Augmented"){
      const used=new Set(["#5"]);
      if(has("♭7") && has("9")){ suffix="9#5"; used.add("♭7"); used.add("9"); }
      else if(has("♭7")){ suffix="7#5"; used.add("♭7"); }
      else if(has("7") && has("9")){ suffix="+maj9"; used.add("7"); used.add("9"); }
      else if(has("7")){ suffix="+maj7"; used.add("7"); }
      else suffix="+";
      return suffix + alteredSuffix(used);
    }
    if(label==="Sus2"){
      if(has("♭7") && has("9")) return "9sus2" + alteredSuffix(new Set(["♭7","9"]));
      if(has("♭7")) return "7sus2" + alteredSuffix(new Set(["♭7"]));
      return "sus2" + alteredSuffix();
    }
    if(label==="Sus4"){
      if(has("13")) return "13sus4" + alteredSuffix(new Set(["13"]));
      if(has("9")) return "9sus4" + alteredSuffix(new Set(["9"]));
      if(has("♭7")) return "7sus4" + alteredSuffix(new Set(["♭7"]));
      return "sus4" + alteredSuffix();
    }
    return suffix + alteredSuffix();
  }
  function updateManualToneDefinition(){
    const suffix=suffixFromManualTones();
    const tones=uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity));
    manualSelectedExtension={label:"Custom", suffix, tones:tones.join(" "), toneSelector:true};
    if(manualChordName) manualChordName.textContent=manualCurrentChordName();
    if(manualChordFamily) manualChordFamily.textContent=manualSelectedIdentity ? manualSelectedIdentity.family : "";
    renderManualToneStrip();
    if(manualSaveBtn) manualSaveBtn.disabled=!(manualSelectedRoot && manualSelectedIdentity);
  }
  function toneButton(label, locked){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="manual-tone-btn " + (isToneDiatonic(label)?"manual-tone-diatonic":"manual-tone-chromatic");
    if(locked) btn.classList.add("locked-manual-tone");
    btn.textContent=label;
    btn.dataset.tone=label;
    if(manualSelectedTones.includes(label)) btn.classList.add("selected-manual-tone");
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      if(locked) return;
      if(manualSelectedTones.includes(label)){
        manualSelectedTones=manualSelectedTones.filter(t=>t!==label);
      } else {
        // Mutually exclusive groups: pick one spelling/alteration in each slot.
        const groups=[["♭3","3"],["♭5","5","#5"],["6","♭7","7"],["♭9","9","#9"],["11","#11"],["♭13","13"],["2","♭2","4"]];
        for(const g of groups){
          if(g.includes(label)) manualSelectedTones=manualSelectedTones.filter(t=>!g.includes(t) || manualLockedTones.includes(t));
        }
        manualSelectedTones.push(label);
      }
      manualSelectedTones=uniqueOrdered([...manualLockedTones, ...manualSelectedTones]);
      buildManualExtensionGrid();
      updateManualToneDefinition();
      if(window.positionManualBuilderFrame) requestAnimationFrame(window.positionManualBuilderFrame);
    });
    return btn;
  }

  const oldReset=window.resetManualBuilder || resetManualBuilder;
  window.resetManualBuilder=resetManualBuilder=function(){
    manualSelectedTones=[];
    manualLockedTones=[];
    const result=oldReset.apply(this, arguments);
    return result;
  };

  window.manualCurrentTones=manualCurrentTones=function(){
    if(manualSelectedExtension && manualSelectedExtension.tones) return manualSelectedExtension.tones;
    if(manualSelectedIdentity) return uniqueOrdered(manualSelectedTones.length ? manualSelectedTones : baseTonesForIdentity(manualSelectedIdentity)).join(" ");
    return manualSelectedRoot ? "1" : "—";
  };

  window.manualCurrentChordName=manualCurrentChordName=function(){
    return manualChordNameFrom(manualSelectedRoot, manualSelectedIdentity, manualSelectedExtension);
  };

  window.buildManualExtensionGrid=buildManualExtensionGrid=function(){
    if(!manualExtensionGrid || !manualSelectedIdentity) return;
    if(!manualSelectedTones.length){
      manualLockedTones=baseTonesForIdentity(manualSelectedIdentity);
      manualSelectedTones=[...manualLockedTones];
    }
    manualExtensionGrid.innerHTML="";
    manualExtensionGrid.classList.add("manual-tone-selector");
    const all=uniqueOrdered([...manualLockedTones, ...EXTENSION_TONES]);
    all.forEach(label=>manualExtensionGrid.appendChild(toneButton(label, manualLockedTones.includes(label))));
  };

  window.showManualExtensionLevel=showManualExtensionLevel=function(){
    if(manualStageTitle) manualStageTitle.textContent="Extensions";
    if(manualLevelLabel) manualLevelLabel.textContent="";
    if(manualIdentityGrid) manualIdentityGrid.classList.remove("show");
    if(manualExtensionGrid){
      manualExtensionGrid.classList.add("show");
      buildManualExtensionGrid();
    }
    updateManualToneDefinition();
    if(window.positionManualBuilderFrame) requestAnimationFrame(window.positionManualBuilderFrame);
  };
})();
</script>



<script>
/* 1.3.24: robust fretboard close + independent arpeggio playback.
   Fixes two issues from 1.3.23:
   1) openArrangeFretboard() left inline display/visibility/z-index styles on the popup,
      so removing the .show class did not actually hide it.
   2) the Arp button could be visually present without reliably triggering audible WebAudio,
      especially on iOS. This uses a direct pointer/click handler and reads the currently
      displayed fretboard markers as the source of truth. */
(function(){
  const popup = document.getElementById('arrangeFretboardPopup');
  const body = document.getElementById('arrangeFretboardBody');
  const closeBtn = document.getElementById('closeArrangeFretboardBtn');
  const arpBtn = document.getElementById('arrangeFretboardArpBtn');
  if(!popup) return;

  // Match the fixed geometry used by renderArrangeFretboardHtml().
  const OPEN_MIDI = [40,45,50,55,59,64];
  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;
  const BOARD_W=W-LEFT-RIGHT;
  const BOARD_H=H-TOP-BOTTOM;
  const BPM=100;
  const BEAT_SEC=60/BPM;
  let arpCtx=null;
  let arpTimers=[];
  let arpPlaying=false;

  function clearArpVisuals(){
    arpTimers.forEach(t=>clearTimeout(t));
    arpTimers=[];
    if(body) body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));
    if(arpBtn){
      arpBtn.classList.remove('playing');
      arpBtn.disabled=false;
      arpBtn.textContent='▶ Arp';
    }
    arpPlaying=false;
  }

  function forceCloseFretboard(){
    clearArpVisuals();
    popup.classList.remove('show','playing-fretboard');
    document.body.classList.remove('fretboard-modal-open');
    // Remove inline styles that were set with priority when opening the popup.
    popup.style.removeProperty('display');
    popup.style.removeProperty('visibility');
    popup.style.removeProperty('z-index');
    popup.style.removeProperty('pointer-events');
    if(body) body.innerHTML='';
    // Keep older app state from retaining a stale current box when possible.
    try{ if(typeof window.clearArpeggioButtonState==='function') window.clearArpeggioButtonState(); }catch(e){}
  }

  // Publish the fixed closer for any later code that calls the global function.
  window.closeArrangeFretboardPopup = forceCloseFretboard;

  function nearestStringIndex(cx){
    let best=0, bestD=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<bestD){ bestD=d; best=s; }
    }
    return best;
  }

  function displayedArpNotes(){
    if(!body) return [];
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));
      const cy=Number(node.getAttribute('cy'));
      if(!Number.isFinite(cx) || !Number.isFinite(cy)) return;
      const string=nearestStringIndex(cx);
      let fret=0;
      if(node.classList.contains('fb-dot')){
        // Dots are drawn at the midpoint of the fret space: top + boardH*((f-.5)/fretCount).
        // Infer fretCount from visible fret-number labels when possible; default is 12.
        let fretCount=12;
        const fretNums=Array.from(svg.querySelectorAll('.fb-fret-number')).map(n=>Number((n.textContent||'').trim())).filter(Number.isFinite);
        if(fretNums.includes(15)) fretCount=15;
        const approx=((cy-TOP)/BOARD_H)*fretCount + 0.5;
        fret=Math.max(1, Math.round(approx));
      }
      notes.push({midi:OPEN_MIDI[string]+fret, string, fret, node});
    });
    // Low E to high E, matching the displayed voicing from bass to treble.
    return notes.sort((a,b)=>a.string-b.string);
  }

  function freq(m){ return 440*Math.pow(2,(m-69)/12); }

  function audioContext(){
    const Ctx=window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!arpCtx || arpCtx.state==='closed') arpCtx=new Ctx();
    return arpCtx;
  }

  function playTone(ctx, midi, start, dur, gain, type){
    const osc=ctx.createOscillator();
    const g=ctx.createGain();
    osc.type=type || 'triangle';
    osc.frequency.setValueAtTime(freq(midi), start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain), start+0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(start);
    osc.stop(start+dur+0.04);
  }

  function playArp(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(arpPlaying) return;
    const notes=displayedArpNotes();
    if(!notes.length) return;
    const ctx=audioContext();
    if(!ctx) return;

    const startPlayback=()=>{
      clearArpVisuals();
      arpPlaying=true;
      if(arpBtn){
        arpBtn.classList.add('playing');
        arpBtn.disabled=true;
        arpBtn.textContent='■';
      }
      const start=ctx.currentTime+0.035;
      const dur=BEAT_SEC*0.9;
      notes.forEach((note,i)=>{
        playTone(ctx, note.midi, start+i*BEAT_SEC, dur, 0.09, i===0?'triangle':'sine');
        const on=Math.max(0, Math.round((start-ctx.currentTime+i*BEAT_SEC)*1000));
        const off=on+Math.round(dur*1000);
        arpTimers.push(setTimeout(()=>note.node.classList.add('fb-arp-active'), on));
        arpTimers.push(setTimeout(()=>note.node.classList.remove('fb-arp-active'), off));
      });
      arpTimers.push(setTimeout(clearArpVisuals, Math.ceil((notes.length*BEAT_SEC+0.3)*1000)));
    };

    // For iOS/Safari, resume must be tied directly to the user gesture.
    try{
      if(ctx.state==='suspended'){
        ctx.resume().then(startPlayback).catch(startPlayback);
      } else {
        startPlayback();
      }
    }catch(err){ startPlayback(); }
  }

  if(closeBtn){
    closeBtn.addEventListener('pointerdown', forceCloseFretboard, true);
    closeBtn.addEventListener('click', forceCloseFretboard, true);
    closeBtn.addEventListener('touchend', forceCloseFretboard, {capture:true, passive:false});
  }
  if(arpBtn){
    arpBtn.textContent='▶ Arp';
    arpBtn.addEventListener('pointerdown', playArp, true);
    arpBtn.addEventListener('click', playArp, true);
    arpBtn.addEventListener('touchend', playArp, {capture:true, passive:false});
  }
})();
</script>

(function(){

  let closeBtn = byId('closeArrangeFretboardBtn');
  let arpBtn = byId('arrangeFretboardArpBtn');
  if(!popup || !body) return;

  const OPEN_MIDI = [40,45,50,55,59,64];
  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;

  function stringIndexFromCx(cx){
    let best=0, dist=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<dist){ dist=d; best=s; }
    }
    return best;
  }

  function fretCountFromSvg(svg){
    const nums=Array.from(svg.querySelectorAll('.fb-fret-number'))
      .map(n=>Number((n.textContent||'').trim()))

  }

  function displayedNotes(){
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const fretCount=fretCountFromSvg(svg);
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));

      }

  }

  function ctx(){
    const Ctx=window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!arpCtx || arpCtx.state==='closed') arpCtx=new Ctx();
    return arpCtx;
  }

  function freq(midi){ return 440*Math.pow(2,(midi-69)/12); }

  function tone(ac, midi, start, dur, gain, type){
    const osc=ac.createOscillator();
    const g=ac.createGain();
    osc.type=type || 'triangle';
    osc.frequency.setValueAtTime(freq(midi), start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(gain, start+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(ac.destination);
    osc.start(start);
    osc.stop(start+dur+0.04);
  }

  function playArp(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(arpPlaying) return false;
    const notes=displayedNotes();
    if(!notes.length) return false;
    const ac=ctx();
    if(!ac) return false;
    try{ if(ac.state==='suspended') ac.resume(); }catch(err){}

    clearArp();
    arpPlaying=true;
    if(arpBtn){
      arpBtn.classList.add('playing');
      arpBtn.disabled=true;
      arpBtn.textContent='■';
    }
    const start=ac.currentTime+0.03;
    const dur=BEAT_SEC*0.88;
    notes.forEach((note,i)=>{
      tone(ac, note.midi, start+i*BEAT_SEC, dur, 0.10, i===0?'triangle':'sine');
      const on=Math.max(0, Math.round((start-ac.currentTime+i*BEAT_SEC)*1000));
      const off=on+Math.round(dur*1000);
      arpTimers.push(setTimeout(()=>note.node.classList.add('fb-arp-active'), on));
      arpTimers.push(setTimeout(()=>note.node.classList.remove('fb-arp-active'), off));
    });
    arpTimers.push(setTimeout(clearArp, Math.ceil((notes.length*BEAT_SEC+0.35)*1000)));

  }
  window.compMapPlayFretboardArpNow = playArp;

  function replaceButton(btn, text, handler){
    if(!btn || !btn.parentNode) return btn;
    const fresh=btn.cloneNode(true);
    fresh.textContent=text;
    fresh.disabled=false;
    fresh.removeAttribute('onclick');
    btn.parentNode.replaceChild(fresh, btn);
    fresh.onclick=handler;
    fresh.addEventListener('pointerdown', handler, {capture:true});
    fresh.addEventListener('click', handler, {capture:true});
    fresh.addEventListener('touchend', handler, {capture:true, passive:false});
    return fresh;
  }

  closeBtn = replaceButton(closeBtn, 'Close', forceClose);
  arpBtn = replaceButton(arpBtn, '▶ Arp', playArp);

  // When old code opens the modal it sets display:block !important. Keep that,
  // but make sure the replacement buttons remain active after each open.
  const mo=new MutationObserver(()=>{

})();

<script>
(function(){
  const manual = document.getElementById('manualBtn');
  const center = document.getElementById('promptCenter');
  const wrap = document.getElementById('wrap');
  const selector = document.getElementById('selector');
  const controls = document.querySelector('.builder-controls');
  if(!manual || !center || !wrap || !selector || !controls) return;

  function num(v){ return Number.parseFloat(v) || 0; }

  function ensureCue(){
    manual.textContent = 'Manual';
    if(document.body.classList.contains('build-await-target')){
      center.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';
    }
  }

  function layoutManualCue(){
    if(!document.body.classList.contains('build-await-target')) return;
    ensureCue();

    const wr = wrap.getBoundingClientRect();
    const sr = selector.getBoundingClientRect();
    const br = controls.getBoundingClientRect();
    const cs = getComputedStyle(manual);
    const type = num(cs.getPropertyValue('--manual-cue-type')) || num(cs.fontSize) || 20;
    const arrowGap = num(cs.getPropertyValue('--manual-arrow-gap')) || type * .42;
    const lowerGap = num(cs.getPropertyValue('--manual-lower-gap')) || type * .55;

    const manualH = manual.getBoundingClientRect().height || type * 1.72;
    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top','0px','important');
    const centerH = center.getBoundingClientRect().height || type * 2.18;

    // Visual bounds are top of the upper arrow and bottom of the lower Start cue.
    // These two bounds are centered in the available vertical gap.
    const topArrowOffset = type + arrowGap;
    const visualHeight = topArrowOffset + manualH + lowerGap + centerH;
    const gapTop = sr.bottom - wr.top;
    const gapBottom = br.top - wr.top;
    const available = Math.max(0, gapBottom - gapTop);
    const visualTop = gapTop + Math.max(0, (available - visualHeight) / 2);

    const manualTop = visualTop + topArrowOffset;
    const centerTop = manualTop + manualH + lowerGap;

    manual.style.setProperty('left','50%','important');
    manual.style.setProperty('top', manualTop + 'px','important');
    center.style.setProperty('left','50%','important');
    center.style.setProperty('top', centerTop + 'px','important');
  }

  const priorSetBuilderStatus = window.setBuilderStatus;
  if(typeof priorSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){
      priorSetBuilderStatus.apply(this, arguments);
      layoutManualCue();
    };
  }

  const priorPositionPrompts = window.positionPrompts;
  if(typeof priorPositionPrompts === 'function'){
    window.positionPrompts = function(){
      priorPositionPrompts.apply(this, arguments);
      layoutManualCue();
    };
  }

  window.addEventListener('resize', layoutManualCue);
  window.addEventListener('orientationchange', () => setTimeout(layoutManualCue, 80));
  setTimeout(layoutManualCue, 0);
  setTimeout(layoutManualCue, 120);
})();
</script>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const controls = document.querySelector('.builder-controls');
  const manual = document.getElementById('manualBtn');
  const center = document.getElementById('promptCenter');
  const row = document.getElementById('promptRow');
  const selector = document.getElementById('selector') || document.querySelector('.chord-map');
  if(!wrap || !controls || !manual || !center || !row || !selector) return;

  function px(v){ return Number.parseFloat(v) || 0; }

  function fixStartCue(){
    if(!document.body.classList.contains('build-await-target')) return;

    row.style.setProperty('left','0px','important');
    row.style.setProperty('right','0px','important');
    row.style.setProperty('top','0px','important');
    row.style.setProperty('bottom','0px','important');
    row.style.setProperty('width','100%','important');
    row.style.setProperty('height','100%','important');

    manual.textContent = 'Manual';
    center.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';

    const wr = wrap.getBoundingClientRect();
    const sr = selector.getBoundingClientRect();
    const br = controls.getBoundingClientRect();
    const ms = getComputedStyle(manual);
    const type = px(ms.getPropertyValue('--manual-cue-type')) || px(ms.fontSize) || 20;
    const arrowGap = type * .42;
    const lowerGap = type * .55;
    const manualH = manual.getBoundingClientRect().height || type * 1.72;

    center.style.setProperty('left', (wr.width / 2) + 'px', 'important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top','0px','important');
    const centerH = center.getBoundingClientRect().height || type * 2.18;

    const topArrowOffset = type + arrowGap;
    const visualHeight = topArrowOffset + manualH + lowerGap + centerH;
    const gapTop = sr.bottom - wr.top;
    const gapBottom = br.top - wr.top;
    const visualTop = gapTop + Math.max(0, ((gapBottom - gapTop) - visualHeight) / 2);
    const manualTop = visualTop + topArrowOffset;
    const centerTop = manualTop + manualH + lowerGap;

    manual.style.setProperty('left',(wr.width / 2) + 'px','important');
    manual.style.setProperty('transform','translateX(-50%)','important');
    manual.style.setProperty('top', manualTop + 'px','important');

    center.style.setProperty('left',(wr.width / 2) + 'px','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top', centerTop + 'px','important');
  }

  function soon(){
    fixStartCue();
    requestAnimationFrame(fixStartCue);
    setTimeout(fixStartCue, 0);
    setTimeout(fixStartCue, 120);
    setTimeout(fixStartCue, 300);
  }

  const priorSetBuilderStatus = window.setBuilderStatus;
  if(typeof priorSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){
      const out = priorSetBuilderStatus.apply(this, arguments);
      soon();
      return out;
    };
  }

  const priorPositionPrompts = window.positionPrompts;
  if(typeof priorPositionPrompts === 'function'){
    window.positionPrompts = function(){
      const out = priorPositionPrompts.apply(this, arguments);
      soon();
      return out;
    };
  }

  window.addEventListener('resize', soon, {passive:true});
  window.addEventListener('orientationchange', soon, {passive:true});
  soon();
})();
</script>

<script>
/* 1.3.27: make fretboard Arp truly loop as a toggle.
   This final override intentionally replaces the 1.3.25 one-shot Arp handler,
   which disabled the button and cleared playback after one pass. */
(function(){
  function byId(id){ return document.getElementById(id); }
  const popup = byId('arrangeFretboardPopup');
  const body = byId('arrangeFretboardBody');
  if(!popup || !body) return;

  const OPEN_MIDI = [40,45,50,55,59,64];
  const LEFT=35, RIGHT=21, TOP=43, BOTTOM=18, W=264, H=496;
  const BOARD_W=W-LEFT-RIGHT;
  const BOARD_H=H-TOP-BOTTOM;
  const BPM=100;
  const BEAT_SEC=60/BPM;
  let arpCtx=null;
  let arpTimers=[];
  let arpNodes=[];
  let arpLooping=false;
  let arpToken=0;

  function currentArpButton(){ return byId('arrangeFretboardArpBtn'); }
  function currentCloseButton(){ return byId('closeArrangeFretboardBtn'); }

  function resetArpButton(){
    const btn=currentArpButton();
    if(btn){
      btn.classList.remove('playing');
      btn.disabled=false;
      btn.textContent='▶ Loop';
      btn.setAttribute('aria-label','Start looping chord arpeggio');
    }
  }

  function stopLoop(){
    arpLooping=false;
    arpToken++;
    arpTimers.forEach(t=>clearTimeout(t));
    arpTimers=[];
    body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));
    arpNodes.forEach(n=>{
      try{ if(n && typeof n.stop==='function') n.stop(0); }catch(e){}
      try{ if(n && typeof n.disconnect==='function') n.disconnect(); }catch(e){}
    });
    arpNodes=[];
    resetArpButton();
  }

  function forceClose(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    stopLoop();
    popup.classList.remove('show','playing-fretboard');
    document.body.classList.remove('fretboard-modal-open');
    popup.style.setProperty('display','none','important');
    popup.style.setProperty('visibility','hidden','important');
    popup.style.setProperty('pointer-events','none','important');
    body.innerHTML='';
    try{ window.arrangeFretboardCurrentBox=null; }catch(err){}
    return false;
  }

  function stringIndexFromCx(cx){
    let best=0, dist=Infinity;
    for(let s=0;s<6;s++){
      const x=LEFT + BOARD_W*(s/5);
      const d=Math.abs(cx-x);
      if(d<dist){ dist=d; best=s; }
    }
    return best;
  }

  function fretCountFromSvg(svg){
    const nums=Array.from(svg.querySelectorAll('.fb-fret-number'))
      .map(n=>Number((n.textContent||'').trim()))
      .filter(Number.isFinite);
    return nums.includes(15) ? 15 : 12;
  }

  function displayedNotes(){
    const svg=body.querySelector('.arrange-fretboard-svg');
    if(!svg) return [];
    const fretCount=fretCountFromSvg(svg);
    const nodes=Array.from(svg.querySelectorAll('.fb-open, .fb-dot'));
    const notes=[];
    nodes.forEach(node=>{
      const cx=Number(node.getAttribute('cx'));
      const cy=Number(node.getAttribute('cy'));
      if(!Number.isFinite(cx) || !Number.isFinite(cy)) return;
      const string=stringIndexFromCx(cx);
      let fret=0;
      if(node.classList.contains('fb-dot')){
        fret=Math.max(1, Math.round(((cy-TOP)/BOARD_H)*fretCount + 0.5));
      }
      notes.push({midi:OPEN_MIDI[string]+fret, string, fret, node});
    });
    return notes.sort((a,b)=>a.string-b.string);
  }

  function getCtx(){
    const Ctx=window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!arpCtx || arpCtx.state==='closed') arpCtx=new Ctx();
    return arpCtx;
  }

  function freq(midi){ return 440*Math.pow(2,(midi-69)/12); }

  function tone(ac, midi, start, dur, gain, type){
    const osc=ac.createOscillator();
    const g=ac.createGain();
    osc.type=type || 'triangle';
    osc.frequency.setValueAtTime(freq(midi), start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(gain, start+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(ac.destination);
    arpNodes.push(osc,g);
    osc.onended=()=>{ arpNodes=arpNodes.filter(n=>n!==osc && n!==g); };
    osc.start(start);
    osc.stop(start+dur+0.04);
  }

  function scheduleCycle(ac, token){
    if(!arpLooping || token!==arpToken || !popup.classList.contains('show')) return;
    const notes=displayedNotes();
    if(!notes.length){ stopLoop(); return; }
    body.querySelectorAll('.fb-arp-active').forEach(el=>el.classList.remove('fb-arp-active'));

    const start=ac.currentTime+0.035;
    const dur=BEAT_SEC*0.88;
    notes.forEach((note,i)=>{
      tone(ac, note.midi, start+i*BEAT_SEC, dur, 0.10, i===0?'triangle':'sine');
      const on=Math.max(0, Math.round((start-ac.currentTime+i*BEAT_SEC)*1000));
      const off=on+Math.round(dur*1000);
      arpTimers.push(setTimeout(()=>{
        if(arpLooping && token===arpToken) note.node.classList.add('fb-arp-active');
      }, on));
      arpTimers.push(setTimeout(()=>{
        note.node.classList.remove('fb-arp-active');
      }, off));
    });

    // Schedule the next cycle after the final quarter note begins plus its duration.
    const cycleMs=Math.ceil(((notes.length-1)*BEAT_SEC + dur + 0.08)*1000);
    arpTimers.push(setTimeout(()=>scheduleCycle(ac, token), cycleMs));
  }

  function startLoop(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    const ac=getCtx();
    if(!ac) return false;
    const notes=displayedNotes();
    if(!notes.length) return false;

    const begin=()=>{
      stopLoop();
      arpLooping=true;
      const token=++arpToken;
      const btn=currentArpButton();
      if(btn){
        btn.classList.add('playing');
        btn.disabled=false;
        btn.textContent='■ Stop';
        btn.setAttribute('aria-label','Stop chord arpeggio');
      }
      scheduleCycle(ac, token);
    };

    try{
      if(ac.state==='suspended') ac.resume().then(begin).catch(begin);
      else begin();
    }catch(err){ begin(); }
    return false;
  }

  function toggleLoop(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(arpLooping) stopLoop();
    else startLoop(e);
    return false;
  }

  function replaceButton(btn, label, handler){
    if(!btn || !btn.parentNode) return null;
    const fresh=btn.cloneNode(true);
    fresh.textContent=label;
    fresh.disabled=false;
    fresh.removeAttribute('onclick');
    btn.parentNode.replaceChild(fresh, btn);
    // True toggle behavior: one tap/click starts the loop; the next tap/click stops it.
    // Do not bind pointerdown/touchstart/touchend here, because on iPhone those make
    // the button act like a press-and-hold momentary control.
    fresh.addEventListener('click', handler, {capture:true});
    fresh.style.touchAction='manipulation';
    return fresh;
  }

  function wireButtons(){
    replaceButton(currentArpButton(), arpLooping ? '■ Stop' : '▶ Loop', toggleLoop);
    replaceButton(currentCloseButton(), 'Close', forceClose);
  }

  window.compMapStopFretboardArpLoop=stopLoop;
  window.compMapCloseFretboardNow=forceClose;
  window.compMapPlayFretboardArpNow=toggleLoop;

  wireButtons();
  const mo=new MutationObserver(()=>{
    if(popup.classList.contains('show')){
      popup.style.setProperty('visibility','visible','important');
      popup.style.setProperty('pointer-events','auto','important');
      wireButtons();
      const btn=currentArpButton();
      if(btn){
        btn.classList.toggle('playing', arpLooping);
        btn.textContent=arpLooping ? '■ Stop' : '▶ Loop';
        btn.disabled=false;
      }
    } else {
      stopLoop();
    }
  });
  mo.observe(popup,{attributes:true,attributeFilter:['class','style']});
})();
</script>

<script>
(function(){
  const manual = document.getElementById('manualBtn');
  if(manual) manual.textContent = 'Manual';
  const oldSetBuilderStatus = window.setBuilderStatus;
  if(typeof oldSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){
      oldSetBuilderStatus.apply(this, arguments);
      const centerEl = document.getElementById('promptCenter');
      if(document.body.classList.contains('build-await-target') && centerEl){
        centerEl.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';
        if(typeof window.restartPromptAnimation === 'function') window.restartPromptAnimation();
      }
    };
  }
  const oldPositionPrompts = window.positionPrompts;
  if(typeof oldPositionPrompts === 'function'){
    window.positionPrompts = function(){
      oldPositionPrompts.apply(this, arguments);
      const manual = document.getElementById('manualBtn');
      const center = document.getElementById('promptCenter');
      const wrap = document.getElementById('wrap');
      const controls = document.querySelector('.builder-controls');
      if(!manual || !center || !wrap || !controls) return;
      if(!document.body.classList.contains('build-await-target')) return;
      const wr = wrap.getBoundingClientRect();
      const mr = manual.getBoundingClientRect();
      const cr = center.getBoundingClientRect();
      const br = controls.getBoundingClientRect();
      const available = br.top - mr.bottom;
      const top = (mr.bottom - wr.top) + Math.max(4, (available - cr.height) / 2);
      center.style.left = ((mr.left + mr.width / 2) - wr.left) + 'px';
      center.style.top = Math.max(2, Math.min(wr.height - cr.height - 2, top)) + 'px';
    };
  }
})();
</script>


<!-- 1.3.42: Final Manual cue position lock. Prevents older prompt code from re-centering Start from measured button bounds after first paint. -->
<style>
body.build-await-target #promptCenter.prompt-option{
  left:50% !important;
  transform:translateX(-50%) !important;
  text-align:center !important;
}
body.build-await-target .manual-option-btn{
  left:50% !important;
  transform:translateX(-50%) !important;
}
</style>
<script>
(function(){
  const wrap = document.getElementById('wrap');
  const selector = document.getElementById('selector');
  const controls = document.querySelector('.builder-controls');
  const manual = document.getElementById('manualBtn');
  const center = document.getElementById('promptCenter');
  if(!wrap || !selector || !controls || !manual || !center) return;

  function px(v){ return (Number.parseFloat(v) || 0); }

  function lockManualCluster(){
    if(!document.body.classList.contains('build-await-target')) return;
    manual.textContent = 'Manual';
    center.innerHTML = '<span class="arrowline">↑</span><span class="start-label">Start</span>';

    const wr = wrap.getBoundingClientRect();
    const sr = selector.getBoundingClientRect();
    const br = controls.getBoundingClientRect();
    const ms = getComputedStyle(manual);
    const type = px(ms.getPropertyValue('--manual-cue-type')) || px(ms.fontSize) || 20;
    const arrowGap = type * .42;
    const lowerGap = type * .55;
    const manualH = manual.getBoundingClientRect().height || type * 1.72;

    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top','0px','important');
    const centerH = center.getBoundingClientRect().height || type * 2.18;

    const topArrowOffset = type + arrowGap;
    const visualHeight = topArrowOffset + manualH + lowerGap + centerH;
    const gapTop = sr.bottom - wr.top;
    const gapBottom = br.top - wr.top;
    const visualTop = gapTop + Math.max(0, ((gapBottom - gapTop) - visualHeight) / 2);
    const manualTop = visualTop + topArrowOffset;
    const centerTop = manualTop + manualH + lowerGap;

    manual.style.setProperty('left','50%','important');
    manual.style.setProperty('transform','translateX(-50%)','important');
    manual.style.setProperty('top', manualTop + 'px','important');
    center.style.setProperty('left','50%','important');
    center.style.setProperty('transform','translateX(-50%)','important');
    center.style.setProperty('top', centerTop + 'px','important');
  }

  function lockSoon(){
    lockManualCluster();
    requestAnimationFrame(lockManualCluster);
    setTimeout(lockManualCluster, 0);
    setTimeout(lockManualCluster, 80);
  }

  const prevSetBuilderStatus = window.setBuilderStatus;
  if(typeof prevSetBuilderStatus === 'function'){
    window.setBuilderStatus = function(){
      const out = prevSetBuilderStatus.apply(this, arguments);
      lockSoon();
      return out;
    };
  }

  const prevPositionPrompts = window.positionPrompts;
  if(typeof prevPositionPrompts === 'function'){
    window.positionPrompts = function(){
      const out = prevPositionPrompts.apply(this, arguments);
      lockSoon();
      return out;
    };
  }

  window.addEventListener('resize', lockSoon, {passive:true});
  window.addEventListener('orientationchange', lockSoon, {passive:true});
  lockSoon();
})();
</script>
