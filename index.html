    });
    voicingGrid.appendChild(btn);
  });
}

const NOTE_TO_PC={"C":0,"C#":1,"D♭":1,"D":2,"D#":3,"E♭":3,"E":4,"F":5,"F#":6,"G♭":6,"G":7,"G#":8,"A♭":8,"A":9,"A#":10,"B♭":10,"B":11};
const STRING_OPEN_PC=[4,9,2,7,11,4]; // low E to high E
const STRING_OPEN_MIDI=[40,45,50,55,59,64]; // low E to high E, for determining lowest sounding note
function rootPcFromChordName(ch){
  // 1.6.18: Manual-builder flat roots are stored with an ASCII "b"
  // (Eb, Ab, Bb), while diatonic roots use the musical flat symbol.
  // Normalize only the root accidental before parsing so Ebmaj7 is
  // calculated from E♭ (pitch class 3), not truncated to E (pitch class 4).
  const normalized=String(ch||"").replace(/^([A-G])b/, "$1♭");
  const m=normalized.match(/^([A-G](?:#|♭)?)/);
  return m ? NOTE_TO_PC[m[1]] : 0;
}
function pcToDisplayName(pcVal){
  const arr = preferFlats() ? PC_FLAT : PC_SHARP;
  return arr[((pcVal % 12) + 12) % 12];
}
function fretForRootOnString(rootPc, stringNum){
  const idx=6-Number(stringNum);
  const open=STRING_OPEN_PC[idx];
  let f=(rootPc-open+12)%12;
  // 1.2.41: use true open-string diagrams instead of wrapping root positions to the 12th fret.
  if(f===0) return 0;
  return f;
}
function suffixFamilyForDiagram(box){
  const type=box.dataset.type || "diatonic";
  const suffix=rootAndSuffix(box.dataset.chord || "").suffix || "";
  const family=baseFamilyKey(box.dataset.baseChord || reverseToBaseChord(box.dataset.chord || ""));
  if(/°|dim|ø|m7♭5|m7b5/.test(suffix) || family==="Bdim") return "dim";
  if(type==="lead" || (/7|9|13|sus/.test(suffix) && !/maj|Δ/.test(suffix) && !/^m/.test(suffix))) return "dom";
  if(/^m(?!aj)/.test(suffix)) return "min";
  return "maj";
}
function absoluteDiagramFrets(tpl, rootPc){
  const clean = f => {
    if(f === "x" || f === null || f === undefined) return null;
    const n = Number(f);
    return Number.isFinite(n) ? n : null;
  };
  if(tpl.abs){
    return tpl.abs.map(clean);
  }
  const rootFret=fretForRootOnString(rootPc, tpl.rootString);
  const rootIdx=tpl.rootIdx;
  const rootRel=Number(tpl.rel[rootIdx] || 0);
  let frets=tpl.rel.map((r,i)=> r === "x" ? null : clean(rootFret + (Number(r) - rootRel)));
  // 1.2.41: if a movable grip lands entirely at/above the 12th fret, show
  // the equivalent open-position grip instead. This turns 12fr shapes into
  // open-string shapes and prevents duplicate 12th-fret displays.
  const played=frets.filter(f=>f!==null);
  if(played.length && Math.min(...played)>=12){
    frets=frets.map(f=>f===null ? null : f-12);
  }
  return frets;
}
function diagramWithinVisibleFretLimit(tpl, rootPc){
  const played=absoluteDiagramFrets(tpl, rootPc).filter(f=>f!==null);
  return played.length && Math.max(...played)<=11;
}
function openTemplate(id, chordLabel, rootString, nameExtra, abs, rootIdx){
  return {
    id:`open-${id}`,
    rootString:String(rootString),
    name:`${chordLabel} S${rootString} ${nameExtra || "open"}`,
    abs:abs.map(f=>f === "x" ? null : f),
    rootIdx,
    open:true
  };
}
function diagramTemplateSignature(tpl, rootPc){
  // Use the actual rendered pattern as the identity. This catches duplicates
  // even if they came from different library/generator paths.
  return absoluteDiagramFrets(tpl, rootPc).map(f=>f===null?"x":String(f)).join(",");
}
function normalizeSuffixForValidation(suffix){
  return (suffix || "").replace(/\s+/g,"").replace(/b/g,"♭");
}

/* 1.3.31: Honor explicit omission suffixes such as (no9).
   These helpers keep the chord name intact while preventing omitted tones
   from being treated as theoretical chord tones or required diagram tones. */
function suffixHasNoTone(suffix, tone){
  const s=normalizeSuffixForValidation(suffix);
  if(String(tone)==="9") return /\(no9\)|no9/.test(s);
  if(String(tone)==="5") return /\(no5\)|no5/.test(s);
  if(String(tone)==="11") return /\(no11\)|no11/.test(s);
  if(String(tone)==="13") return /\(no13\)|no13/.test(s);
  return false;
}
function suffixWithoutNoToneClauses(suffix){
  return normalizeSuffixForValidation(suffix).replace(/\(no(?:5|9|11|13)\)/g,"");
}

/* 1.3.33: Diagram visibility must require only tones explicitly named in
   the chord title. A C13♭9 must contain 13 and ♭9, but the ♭7 is implicit
   and does not by itself disqualify a compact voicing if omitted. */
function titleRequiredIntervalLabels(suffix){
  const raw=suffixWithoutNoToneClauses(suffix || "");
  const s=normalizeSuffixForValidation(raw);
  const labels=[];
  const add=label=>{ if(!labels.includes(label)) labels.push(label); };

  // Altered named tones.
  if(/♭5/.test(s)) add("♭5");
  if(/#5|\+|aug/.test(s)) add("#5");
  if(/♭9/.test(s)) add("♭9");
  if(/#9/.test(s)) add("#9");
  if(/#11/.test(s)) add("#11");
  if(/♭13/.test(s)) add("♭13");

  // Natural named tones. Remove accidental forms before looking for the bare number.
  const noAcc=s.replace(/♭5|#5|♭9|#9|#11|♭13/g,"");

  if(/6\/9/.test(s)) { add("6"); add("9"); }
  else if(/(^|[^1])6/.test(noAcc) && !/13/.test(noAcc)) add("6");

  if(/add9|add2|9/.test(noAcc)) add("9");
  if(/11/.test(noAcc)) add("11");
  if(/13/.test(noAcc)) add("13");

  // Only require a seventh when the title actually names a seventh quality.
  // Fully diminished seventh uses 𝄫7 (enharmonically 6), not dominant ♭7.
  if(/(?:°7|dim7)/.test(s) && !/(?:m7♭5|m7b5|ø7)/.test(s)) add("𝄫7");
  else if(/maj7|Δ7|m\(maj7\)|mmaj7/.test(s)) add("7");
  else if(/(^|[^a-zA-Z])7/.test(noAcc) || /ø7|m7♭5|m7b5/.test(s)) add("♭7");

  return labels;
}
function canonicalChordToneDefinition(rootPc, suffix, fam){
  // 1.3.32: One canonical interval definition for each chord symbol.
  // This is the single source used by diagram filtering, diagram labels,
  // fretboard labels, and omission/identity display. It prevents generic
  // "extended chord" templates from adding the wrong 7th to chords such as
  // C6/9, Cadd9, or Em11(no9).
  const raw=suffix || "";
  const s=suffixWithoutNoToneClauses(raw);
  const no9=suffixHasNoTone(raw,"9");
  const no5=suffixHasNoTone(raw,"5");
  const no11=suffixHasNoTone(raw,"11");
  const no13=suffixHasNoTone(raw,"13");
  const tones=[];
  const add=(n,label, opts={})=>{
    const pc=(rootPc+n+120)%12;
    const existing=tones.find(t=>t.label===label);
    if(existing){
      existing.strong=existing.strong || !!opts.strong;
      existing.color=existing.color || !!opts.color;
      existing.requiredTop=existing.requiredTop || !!opts.requiredTop;
      return;
    }
    tones.push({pc,label, strong:!!opts.strong, color:!!opts.color, requiredTop:!!opts.requiredTop});
  };

  const isSus=/sus/.test(s);
  const isDim=(fam==="dim" || /°|dim|ø|m7♭5/.test(s));
  const isFullyDim7=/(?:°7|dim7)/.test(s) && !/(?:m7♭5|m7b5|ø7)/.test(s);
  const isMin=(fam==="min" || /^m(?!aj)/.test(s) || /m7♭5/.test(s));
  const isAug=(fam==="aug" || /\+|aug|#5/.test(s));
  const isSixNine=/6\/9/.test(s);
  const isSixChord=!isSixNine && /6/.test(s) && !/13/.test(s);
  const isAdd9=/add9|add2/.test(s);

  const sNoFlat13=s.replace(/♭13/g,"");
  const sNoAcc9=s.replace(/♭9|#9/g,"");
  const sNoSharp11=s.replace(/#11/g,"");
  const hasFlat13=!no13 && /♭13/.test(s);
  const hasNatural13=!no13 && /13/.test(sNoFlat13);
  const hasFlat9=!no9 && /♭9/.test(s);
  const hasSharp9=!no9 && /#9/.test(s);
  const hasNatural9=!no9 && (/9/.test(sNoAcc9) || /add9|add2/.test(s));
  const hasSharp11=!no11 && /#11/.test(s);
  const hasNatural11=!no11 && /11/.test(sNoSharp11);
  const hasMaj7=/maj(?:7|9|11|13)|Δ/.test(s);

  // A 6 or add9 chord does not imply any kind of 7th. Other 9/11/13 chords do.
  const extendedImplies7 = !hasMaj7 && !isSixNine && !isSixChord && !isAdd9 &&
    (hasNatural9 || hasFlat9 || hasSharp9 || hasNatural11 || hasSharp11 || hasNatural13 || hasFlat13);
  const explicitPlain7 = !hasMaj7 && /(7|ø)/.test(s) && !/maj7/.test(s);
  const hasPlain7 = explicitPlain7 || extendedImplies7;

  add(0,"1",{strong:true});

  if(isSus){
    if(/sus2/.test(s)) add(2,"2",{strong:true});
    else add(5,"4",{strong:true});
  } else if(isDim){
    add(3,"♭3",{strong:true});
  } else if(isMin){
    add(3,"♭3",{strong:true});
  } else {
    add(4,"3",{strong:true});
  }

  if(isDim || /♭5/.test(s)) add(6,"♭5",{strong:isDim || /♭5/.test(s), color:/♭5/.test(s)});
  else if(isAug || /#5/.test(s)) add(8,"#5",{strong:isAug, color:true, requiredTop:/#5/.test(s)});
  else if(!no5) add(7,"5");

  if(isFullyDim7) add(9,"𝄫7",{strong:true, color:true, requiredTop:true});
  else if(hasMaj7) add(11,"7",{strong:true, color:true, requiredTop: !(hasNatural9 || hasFlat9 || hasSharp9 || hasNatural11 || hasSharp11 || hasNatural13 || hasFlat13)});
  else if(hasPlain7) add(10,"♭7",{strong:true, color:true, requiredTop: !(hasNatural9 || hasFlat9 || hasSharp9 || hasNatural11 || hasSharp11 || hasNatural13 || hasFlat13)});

  if(isSixNine){
    add(9,"6",{color:true, requiredTop:true});
    add(2,"9",{color:true, requiredTop:true});
  } else if(isSixChord){
    add(9,"6",{color:true, requiredTop: !(hasNatural9 || hasFlat9 || hasSharp9 || hasNatural11 || hasSharp11)});
  }

  if(hasFlat9) add(1,"♭9",{color:true, requiredTop:true});
  if(hasNatural9) add(2,"9",{color:true, requiredTop: !isSixNine});
  if(hasSharp9) add(3,"#9",{color:true, requiredTop:true});
  if(hasNatural11) add(5,"11",{color:true, requiredTop:true});
  if(hasSharp11) add(6,"#11",{color:true, requiredTop:true});
  if(hasFlat13) add(8,"♭13",{color:true, requiredTop:true});
  if(hasNatural13) add(9,"13",{color:true, requiredTop:true});

  return tones;
}
function expectedChordToneInfo(rootPc, suffix, fam){
  const tones=canonicalChordToneDefinition(rootPc, suffix, fam);
  const allowed=new Set(tones.map(t=>t.pc));
  const strong=new Set(tones.filter(t=>t.strong).map(t=>t.pc));
  const color=new Set(tones.filter(t=>t.color).map(t=>t.pc));
  const requiredTop=new Set(tones.filter(t=>t.requiredTop).map(t=>t.pc));
  const requiredTitleLabels=titleRequiredIntervalLabels(suffix);
  const requiredTitle=new Set(tones.filter(t=>requiredTitleLabels.includes(t.label)).map(t=>t.pc));
  return {allowed, strong, color, requiredTop, requiredTitle, requiredTitleLabels};
}
function diagramMatchesChord(box, tpl, rootPc){
  const chordName=box.dataset.chord || box.dataset.baseChord || "C";
  const suffix=rootAndSuffix(chordName).suffix || "";
  const fam=suffixFamilyForDiagram(box);
  const frets=absoluteDiagramFrets(tpl, rootPc);
  if(frets.length !== 6) return false;
  if(frets.some(f=>f!==null && (!Number.isFinite(Number(f)) || f<0 || f>11))) return false;
  const pcs=[];
  frets.forEach((f,i)=>{ if(f!==null) pcs.push((STRING_OPEN_PC[i]+f)%12); });
  if(!pcs.length) return false;
  const {allowed, strong, color, requiredTitle}=expectedChordToneInfo(rootPc, suffix, fam);
  if(pcs.some(pc=>!allowed.has(pc))) return false;
  // Require the identifying third/sus sound. The 5th and implicit 7ths can be
  // omitted in compact jazz grips, but the sonority cannot be ambiguous.
  for(const pc of strong){ if(!pcs.includes(pc)) return false; }
  // 1.3.33: Require only number tones explicitly named in the chord title.
  // Example: C13♭9 must include 13 and ♭9; it may omit the implicit ♭7.
  for(const pc of requiredTitle){ if(!pcs.includes(pc)) return false; }
  // If a chord has color tones but no explicitly named required tone, require
  // at least one color tone so a plain triad does not stand in for a color chord.
  if(!requiredTitle.size && color.size){
    let hasColor=false;
    for(const pc of color){ if(pcs.includes(pc)) { hasColor=true; break; } }
    if(!hasColor) return false;
  }
  return true;
}
function chordToneCandidateFretsForString(stringIdx, allowed){
  const arr=[];
  for(let f=0; f<=11; f++){
    if(allowed.has((STRING_OPEN_PC[stringIdx]+f)%12)) arr.push(f);
  }
  return arr;
}
function compactSpanOk(frets){
  const played=frets.filter(f=>f!==null);
  if(!played.length) return false;
  if(Math.max(...played)>11) return false;
  const fingered=played.filter(f=>f>0);
  if(!fingered.length) return true;
  const minF=Math.min(...fingered);
  const maxF=Math.max(...fingered);
  const span=maxF-minF;
  // Playable guitar grips should keep fingered notes within four frets;
  // open strings do not count against the span.
  if(span>4) return false;
  // 1.2.52: a full four-fret reach is only allowed when it is a simple
  // stretch: one end of the grip is isolated and all other fingered notes
  // sit on the same fret. This keeps shapes like 1-5-5-5 or 1-5, but
  // filters awkward spread shapes like 1-3-5 or 1-2-5.
  if(span===4){
    const distinct=[...new Set(fingered)].sort((a,b)=>a-b);
    if(distinct.length>2) return false;
  }
  return true;
}
function inversionFilterForBox(box){
  const v=(box && box.dataset.inversionFilter) || "root";
  return ["root","first","second"].includes(v) ? v : "root";
}
function triadPcsForDiagramFilter(box, rootPc){
  const chordName=
    box?.dataset?.chord ||
    box?.dataset?.baseChord ||
    "C";

  const parsed=rootAndSuffix(chordName);
  const suffix=parsed?.suffix || "";
  const fam=suffixFamilyForDiagram(box);

  let definition=[];

  try{
    definition=canonicalChordToneDefinition(rootPc,suffix,fam) || [];
  }catch(error){
    definition=[];
  }

  const byLabel=label=>{
    const tone=definition.find(item=>item?.label===label);
    return tone ? tone.pc : null;
  };

  // Derive the first-inversion bass from the chord's actual defining tone.
  // This correctly distinguishes major 3, minor ♭3, sus2, and sus4.
  const firstPc=
    byLabel("3") ??
    byLabel("♭3") ??
    byLabel("2") ??
    byLabel("4") ??
    (
      fam==="min" || fam==="dim"
        ? (rootPc+3)%12
        : (rootPc+4)%12
    );

  // Derive the second-inversion bass from the actual fifth quality.
  const secondPc=
    byLabel("5") ??
    byLabel("♭5") ??
    byLabel("♯5") ??
    byLabel("#5") ??
    (
      fam==="dim"
        ? (rootPc+6)%12
        : (rootPc+7)%12
    );

  return [rootPc,firstPc,secondPc];
}
function lowestSoundingPcForTemplate(tpl, rootPc){
  const frets=absoluteDiagramFrets(tpl, rootPc);
  const tuning=
    typeof compMapEngineTuning==="function"
      ? compMapEngineTuning()
      : STRING_OPEN_MIDI;

  let best=null;

  frets.forEach((f,i)=>{
    if(f===null || f===undefined || f<0) return;

    const midi=Number(tuning[i])+Number(f);
    const pc=((midi%12)+12)%12;

    if(best===null || midi<best.midi){
      best={midi,pc};
    }
  });

  return best ? best.pc : null;
}
function inversionBassDegreeForBox(box,rootPc){
  const filter=inversionFilterForBox(box);
  const triad=triadPcsForDiagramFilter(box,rootPc);
  const targetPc=
    filter==="first"
      ? triad[1]
      : filter==="second"
        ? triad[2]
        : triad[0];

  return ((targetPc-rootPc+12)%12);
}

function templateMatchesInversionFilter(box, tpl, rootPc){
  if(!box || !tpl) return true;

  const filter=inversionFilterForBox(box);
  const triad=triadPcsForDiagramFilter(box,rootPc);
  const targetPc=
    filter==="first"
      ? triad[1]
      : filter==="second"
        ? triad[2]
        : triad[0];

  const bassPc=
    Number.isFinite(Number(tpl?.bassPc))
      ? Number(tpl.bassPc)
      : lowestSoundingPcForTemplate(tpl,rootPc);

  return bassPc===targetPc;
}

function theoreticalChordTonePcs(rootPc, suffix, fam){

function diagramIncludedPcs(tpl, rootPc){
  const frets=absoluteDiagramFrets(tpl, rootPc);
  const pcs=[];
  frets.forEach((f,i)=>{
    if(f!==null && f!==undefined && Number.isFinite(Number(f)) && Number(f)>=0){
      const pc=(STRING_OPEN_PC[i]+Number(f))%12;
      if(!pcs.includes(pc)) pcs.push(pc);

function theoreticalChordToneDegrees(rootPc, suffix, fam){

    .filter(t=>t.strong || t.label==="7" || t.label==="♭7" || t.label==="𝄫7" || t.label==="♭5" || t.label==="#5" || t.label==="♭9" || t.label==="#9" || t.label==="#11" || t.label==="♭13")

function renderDiagramToneRowHtml(tpl, rootPc, box){
  if(!box) return "";
  const chordName=box.dataset.chord || box.dataset.baseChord || "C";
  const suffix=rootAndSuffix(chordName).suffix || "";
  const fam=suffixFamilyForDiagram(box);
  const theoretical=theoreticalChordToneDegrees(rootPc, suffix, fam);
  const included=diagramIncludedPcs(tpl, rootPc);
  const diatonic=diatonicPcsForCurrentKey();
  const identityLabels=identityChordToneLabels(rootPc, suffix, fam);
  const spans=theoretical.map(tone=>{
    const isDiatonic=diatonic.includes(tone.pc);
    const classes=[
      included.includes(tone.pc) ? "diagram-tone-present" : "diagram-tone-omitted",
      isDiatonic ? "diagram-tone-diatonic" : "diagram-tone-chromatic"
    ];
    if(identityLabels.includes(tone.label)) classes.push("diagram-tone-identity");
    return `<span class="${classes.join(" ")}">${tone.label}</span>`;

function diagramToneLabelForPc(pc, rootPc, box){

  const fam=suffixFamilyForDiagram(box);

  const tone=theoretical.find(t=>t.pc===pc);

function renderDiagramHtml(tpl, rootPc, box=null){
  let frets=absoluteDiagramFrets(tpl, rootPc).map(f=>{
    if(f===null || f===undefined) return null;
    const n=Number(f);
    return Number.isFinite(n) ? n : null;
  });
  while(frets.length<6) frets.push(null);
  frets=frets.slice(0,6);
  const played=frets.filter(f=>f!==null && f>=0);
  const fingered=played.filter(f=>f>0);
  const hasOpen=played.some(f=>f===0);
  // If the whole fingering fits in the first four frets, draw it as a
  // normal nut-position diagram: fret 1 is shown by the first grid space and
  // is not numbered. Only up-neck shapes start at the lowest fingered fret and
  // receive a fret label.
  const firstPosition = fingered.length === 0 || fingered.every(f => f >= 1 && f <= 4);
  const minFinger = fingered.length ? Math.min(...fingered) : 1;
  const maxFingerForWindow = fingered.length ? Math.max(...fingered) : minFinger;
  const occupiedFretCount = maxFingerForWindow - minFinger + 1;
  let low = firstPosition
    ? 1
    : Math.max(1, occupiedFretCount < 4 ? minFinger - 1 : minFinger);
  if(!isFinite(low) || low<1) low=1;
  const fretLabel = firstPosition ? "" : `${low}fr`;
  // 1.2.70: Never allow a fretted string to become visually undefined.
  // The old fixed four-fret window could hide a fingered note when the
  // fingering spanned from, for example, 3fr to 7fr. In that case the string
  // had no dot and no x/o. The diagram now expands just enough rows to show
  // every positive fret; first-position chords still use the standard 1-4
  // nut view with no fret number.
  const maxFinger = fingered.length ? Math.max(...fingered) : low;
  const span = firstPosition ? 4 : Math.max(4, maxFinger - low + 1);
  const w=92, h=82, top=16, left=10, right=10, bottom=8;
  const usableW=w-left-right;
  const usableH=h-top-bottom;
  const stringX=s=>left + (usableW*(s/5));
  const fretY=r=>top + (usableH*(r/span));
  const fretMidY=f=>{
    if(f===0) return top-8;
    const r=f-low;
    if(r<0 || r>=span) return null;
    return (fretY(r)+fretY(r+1))/2;
  };
  const strings=Array.from({length:6},(_,s)=>`<line x1="${stringX(s)}" y1="${top}" x2="${stringX(s)}" y2="${top+usableH}"/>`).join("");
  const fretsSvg=Array.from({length:span+1},(_,r)=>`<line x1="${left}" y1="${fretY(r)}" x2="${left+usableW}" y2="${fretY(r)}"/>`).join("");
  const dots=frets.map((f,s)=>{
    if(f===null || f===0) return "";
    const y=fretMidY(f);
    if(y===null) return "";
    const cls=(s===tpl.rootIdx ? "diagram-svg-dot root" : "diagram-svg-dot");
    return `<circle class="${cls}" cx="${stringX(s)}" cy="${y}" r="5.5"/>`;
  }).join("");
  // Every non-fingered string is explicitly marked above the nut/grid:
  // × for muted, ○ for open. Fingered strings are marked by their solid dot.
  const stringStateMarks=frets.map((f,s)=>{
    if(f===null) return `<text class="diagram-svg-muted" x="${stringX(s)}" y="10">×</text>`;
    if(f===0){
      const cls=(s===tpl.rootIdx ? "diagram-svg-dot root open-string" : "diagram-svg-dot open-string");
      return `<circle class="${cls}" cx="${stringX(s)}" cy="10" r="5.5"/>`;
    }
    return "";
  }).join("");
  const toneRow=renderDiagramToneRowHtml(tpl, rootPc, box);
  return `<div class="chord-diagram svg-diagram"><svg viewBox="0 0 ${w} ${h}" aria-label="${tpl.name}"><text class="diagram-svg-fret" x="0" y="${top+8}">${fretLabel}</text><g class="diagram-svg-lines">${strings}${fretsSvg}</g>${stringStateMarks}<g>${dots}</g></svg>${toneRow}</div>`;
}
function chordDisplayNameForVoicing(box,tpl=null,code=""){
  if(!box) return "Chord";

  const chord=box.dataset.chord || box.dataset.baseChord || "Chord";
  const chordText=displayName(chord);
  const rootPc=rootPcFromChordName(chord);

  let frets=null;

  if(tpl){
    try{
      frets=absoluteDiagramFrets(tpl,rootPc);
    }catch(_){
      frets=null;
    }
  }

  if(!Array.isArray(frets)){
    const savedCode=code || box.dataset.fingeringCode || "";
    frets=isFingeringCode(savedCode)
      ? fretsFromFingeringCode(savedCode)
      : null;
  }

  if(!Array.isArray(frets) || frets.length!==6){
    return chordText;
  }

  const tuning=
    typeof compMapEngineTuning==="function"
      ? compMapEngineTuning()
      : STRING_OPEN_MIDI;

  const sounding=frets
    .map((fret,stringIndex)=>{
      if(fret===null || fret===undefined) return null;
      const value=Number(fret);
      if(!Number.isFinite(value) || value<0) return null;
      return Number(tuning[stringIndex])+value;
    })
    .filter(Number.isFinite);

  if(!sounding.length) return chordText;

  const bassMidi=Math.min(...sounding);
  const bassPc=((bassMidi%12)+12)%12;

  if(bassPc===rootPc) return chordText;
  return `${chordText}/${pcToDisplayName(bassPc)}`;
}

const PREFERRED_DIAGRAM_SETS=[
  [0,2,3,4], // strings 6-4-3-2
  [1,2,3,4], // strings 5-4-3-2
  [2,3,4,5], // strings 4-3-2-1
  [1,3,4,5]  // strings 5-3-2-1
];
function playedStringIndexes(tpl){
  const arr=tpl.rel || tpl.abs || [];
  return arr.map((r,i)=>(r==="x" || r===null) ? null : i).filter(i=>i!==null);
}
function sameIndexSet(a,b){
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function isPreferredDiagram(tpl){
  const played=playedStringIndexes(tpl);
  return PREFERRED_DIAGRAM_SETS.some(set=>sameIndexSet(played,set));
}
function preferredScore(tpl){
  const played=playedStringIndexes(tpl);
  const idx=PREFERRED_DIAGRAM_SETS.findIndex(set=>sameIndexSet(played,set));
  if(idx>=0) return 100-idx;
  // Near-preferred shapes are still useful, but should come after exact four-note grips.
  const containsPreferred=PREFERRED_DIAGRAM_SETS.some(set=>set.every(i=>played.includes(i)) && set.includes(tpl.rootIdx));
  if(containsPreferred) return 40;
  if(played.length===4) return 20;
  return 0;
}

function bindVoicingGroupToggle(group){
  if(!group || group.dataset.toggleBound==="1") return;

  const toggle=group.querySelector(".voicing-family-toggle");
  if(!toggle) return;

  group.dataset.toggleBound="1";

  toggle.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();

    const opening=!group.classList.contains("open");

    if(!opening){
      setVoicingGroupOpen(group,false);
      return;
    }

    // Top and all family groups are one accordion.
    if(topVoicingGroup && group!==topVoicingGroup){
      setVoicingGroupOpen(topVoicingGroup,false);
    }
    closeAllVoicingGroups(group);
    setVoicingGroupOpen(group,true);

    requestAnimationFrame(()=>{
      if(!voicingScrollArea) return;

      const scrollRect=voicingScrollArea.getBoundingClientRect();
      const groupRect=group.getBoundingClientRect();

      voicingScrollArea.scrollTo({
        top:
          voicingScrollArea.scrollTop +
          (groupRect.top-scrollRect.top),
        behavior:"smooth"
      });
    });
  });
}

function closeAllVoicingGroups(exceptGroup=null){
  const groups=[];

  if(topVoicingGroup){
    groups.push(topVoicingGroup);
  }

  if(voicingFamilyGroups){
    groups.push(
      ...Array.from(
        voicingFamilyGroups.querySelectorAll(".voicing-family-group")
      )
    );
  }

  [...new Set(groups)].forEach(group=>{
    if(!group || group===exceptGroup) return;
    setVoicingGroupOpen(group,false);
  });
}

function setVoicingGroupOpen(group, open){
  if(!group) return;

  group.classList.toggle("open",open);

  const toggle=group.querySelector(".voicing-family-toggle");
  if(toggle){
    toggle.setAttribute("aria-expanded",open ? "true" : "false");
    const arrow=toggle.querySelector(".voicing-family-arrow");
    if(arrow) arrow.textContent=open ? "▼" : "▶";
  }

  const content=group.querySelector(".voicing-family-content");
  if(content){
    content.hidden=!open;

    // Set the state directly so older Top-specific CSS cannot keep
    // the Top grid visible after the group has been closed.
    content.style.setProperty(
      "display",
      open ? "grid" : "none",
      "important"
    );
    content.style.setProperty(
      "max-height",
      "none",
      "important"
    );
    content.style.setProperty(
      "overflow",
      "visible",
      "important"
    );
  }
}

/* 1.4.09 Phase 2A: every Comp-Map chord is defined for the embedded engine
   from the same canonical chord-tone parser used by labels and validation.
   There is no suffix whitelist and no legacy-diagram fallback. */
function compMapChordToEngineTemplate(box){
  if(!box || !window.VoicingEngine) return null;

  const chordName=box.dataset.chord || box.dataset.baseChord || "C";
  const parsed=rootAndSuffix(chordName);
  const rootPc=rootPcFromChordName(chordName);
  const suffix=parsed.suffix || "";
  const fam=suffixFamilyForDiagram(box);
  const tones=canonicalChordToneDefinition(rootPc,suffix,fam);
  if(!tones.length) return null;

  const intervalForTone=tone=>((tone.pc-rootPc+12)%12);
  const allowed=[...new Set(tones.map(intervalForTone))];
  const titleRequiredLabels=titleRequiredIntervalLabels(suffix);
  const titleRequired=tones
    .filter(tone=>titleRequiredLabels.includes(tone.label))
    .map(intervalForTone);
  const identityRequired=tones
    .filter(tone=>tone.strong)
    .map(intervalForTone);

  // Root + identifying quality + every interval explicitly named in the title.
  // Other canonical tones remain optional, allowing compact guitar omissions.
  const required=[...new Set([0,...identityRequired,...titleRequired])];
  const optional=allowed.filter(interval=>!required.includes(interval));
  const forbidden=Array.from({length:12},(_,interval)=>interval)
    .filter(interval=>!allowed.includes(interval));

  // Use a stable per-symbol key so the existing engine can consume a dynamic
  // chord specification without changing its generation and ranking machinery.
  const normalizedSuffix=normalizeSuffixForValidation(
    suffixWithoutNoToneClauses(suffix)
  ) || "major";
  const templateName=`CM:${normalizedSuffix}`;
  VoicingEngine.CHORDS[templateName]={required,optional,forbidden};

  // Preserve precise Comp-Map interval spellings in engine metadata.
  const labels={};
  tones.forEach(tone=>{ labels[intervalForTone(tone)]=tone.label; });
  if(typeof VoicingEngine.setDegreeLabelOverrides==="function"){
    VoicingEngine.setDegreeLabelOverrides(templateName,labels);
  }

  return {
    chordName,
    templateName,
    rootPc,
    suffix,
    family:fam,
    required,
    optional,
    forbidden
  };
}
function compMapEngineTuning(){
  if(Array.isArray(currentFretboardTuning) && currentFretboardTuning.length===6){
    return [...currentFretboardTuning];
  }
  return [40,45,50,55,59,64];
}

let currentEngineVoicingBox=null;

function compMapEngineRange(){
  return {
    minFret:Number.isFinite(preferredFretMin) ? preferredFretMin : 0,
    maxFret:Number.isFinite(preferredFretMax) ? preferredFretMax : 15
  };
}

function engineShapeKey(result){
  const shape=(result?.shape || result?.frets || []).map(value=>{
    if(value===null || value===undefined || value==="x") return "x";
    const n=Number(value);
    return Number.isFinite(n) ? String(n) : "x";
  });

  return shape.length===6 ? shape.join(",") : "";
}

function deduplicateEngineResults(items){
  const seen=new Set();
  const unique=[];

  for(const item of items){
    const key=engineShapeKey(item);
    if(!key || seen.has(key)) continue;
    seen.add(key);
    unique.push(item);
  }

  return unique;
}

function engineShapeToCompMapTemplate(result,index,rootPc,chordName){
  const shape=(result.shape || result.frets || []).map(value=>
    value===null || value===undefined ? null : Number(value)
  );

  if(shape.length!==6) return null;

  const tuning=compMapEngineTuning();
  const sounding=shape
    .map((fret,stringIndex)=>{
      if(fret===null) return null;
      const midi=tuning[stringIndex]+fret;
      return {
        fret,
        stringIndex,
        midi,
        pc:((midi%12)+12)%12
      };
    })
    .filter(Boolean)
    .sort((a,b)=>a.midi-b.midi);

  const bass=sounding[0] || null;
  const bassIsRoot=!!bass && bass.pc===rootPc;
  const hasOpenString=shape.some(fret=>fret===0);

  let physicalFamily=
    result.physicalFamily ||
    result.family ||
    (
      window.VoicingEngine?.physicalFamilyForVoicing
        ? VoicingEngine.physicalFamilyForVoicing(result)
        : ""
    );

  if(!physicalFamily){
    if(hasOpenString){
      physicalFamily="open";
    }else if(bass && bass.stringIndex===0){
      physicalFamily="string-6";
    }else if(bass && bass.stringIndex===1){
      physicalFamily="string-5";
    }else if(bass && bass.stringIndex===2){
      physicalFamily="string-4";
    }else{
      physicalFamily="other";
    }
  }else{
    const normalized=String(physicalFamily).toLowerCase();

    if(normalized.includes("open")){
      physicalFamily="open";
    }else if(
      normalized.includes("6th") ||
      normalized.includes("string-6") ||
      normalized.includes("low-e")
    ){
      physicalFamily="string-6";
    }else if(
      normalized.includes("5th") ||
      normalized.includes("string-5") ||
      normalized.includes("a-string")
    ){
      physicalFamily="string-5";
    }else if(
      normalized.includes("4th") ||
      normalized.includes("string-4") ||
      normalized.includes("d-string")
    ){
      physicalFamily="string-4";
    }else if(normalized.includes("rootless")){
      // The root note is resolved below; engine-declared rootless shapes remain
      // in the rootless family and are reclassified later if necessary.
      physicalFamily="rootless";
    }else{
      physicalFamily="other";
    }
  }

  const rootNote=
    sounding.find(note=>note.pc===rootPc) ||
    null;

  if(physicalFamily==="rootless" && rootNote){
    physicalFamily="other";
  }

  const rootString=rootNote ? 6-rootNote.stringIndex : 6;
  const rootIdx=rootNote ? rootNote.stringIndex : -1;

  const bassPc=bass ? bass.pc : null;
  const bassInterval=
    bassPc===null
      ? null
      : ((bassPc-rootPc+12)%12);

  return {
    id:`engine-${rootPc}-${index}-${shape.map(v=>v===null?"x":v).join("-")}`,
    name:chordName,
    rootString,
    rootIdx,
    bassPc,
    bassInterval,
    bassStringIndex:bass ? bass.stringIndex : null,
    requestedBassDegree:
      inversionBassDegreeForBox(
        currentEngineVoicingBox || null,
        rootPc
      ),
    soundingNotes:sounding.map(note=>({
      stringIndex:note.stringIndex,
      fret:note.fret,
      midi:note.midi,
      pc:note.pc,
      degree:
        result?.stats?.sounding?.find(engineNote=>
          Number(engineNote.stringIndex)===Number(note.stringIndex) &&
          Number(engineNote.fret)===Number(note.fret)
        )?.degree ??
        result?.sounding?.find(engineNote=>
          Number(engineNote.stringIndex)===Number(note.stringIndex) &&
          Number(engineNote.fret)===Number(note.fret)
        )?.degree ??
        null
    })),
    physicalFamily,
    abs:shape,
    rel:shape,
    engineResult:result,
    source:"engine"
  };
}

function generateEngineTemplatesForBox(box){
  if(!window.VoicingEngine) return [];

  const request=compMapChordToEngineTemplate(box);
  if(!request) return [];

  const range=compMapEngineRange();

  try{
    const liveTuning=compMapEngineTuning();
    const requestedBassDegree=
      inversionBassDegreeForBox(box,request.rootPc);

    const response=VoicingEngine.generateVoicings({
      chordName:request.templateName,
      rootPc:request.rootPc,
      bassDegree:requestedBassDegree,
      tuning:liveTuning,
      neckRange:[range.minFret,range.maxFret],
      minimumFret:range.minFret,
      maximumFret:range.maxFret,
      minFret:range.minFret,
      maxFret:range.maxFret,
      maxSpan:5,
      maximumResults:240,
      maxResults:240,
      voicingType:"all",
      openStringsMode:"optional"
    });

    const raw=Array.isArray(response)
      ? response
      : (
          response?.analyzed ||
          response?.results ||
          response?.voicings ||
          []
        );

    let uniqueRaw=deduplicateEngineResults(raw);

    // 1.4.12: altered five-note sonorities such as 7♭9 may need one extra
    // fret of reach before the ergonomic filter can find compact omissions.
    if(uniqueRaw.length===0){
      const retry=VoicingEngine.generateVoicings({
        chordName:request.templateName,
        rootPc:request.rootPc,
        bassDegree:requestedBassDegree,
        tuning:liveTuning,
        neckRange:[range.minFret,range.maxFret],
        maxSpan:6,
        maxResults:500,
        voicingType:"all",
        openStringsMode:"optional"
      });
      const retryRaw=Array.isArray(retry) ? retry : (retry?.analyzed || retry?.results || retry?.voicings || []);
      uniqueRaw=deduplicateEngineResults(retryRaw);
    }

    const converted=uniqueRaw
      .map((result,index)=>engineShapeToCompMapTemplate(
        result,index,request.rootPc,request.chordName
      ))
      .filter(Boolean)
      .filter(tpl=>
        templateMatchesInversionFilter(box,tpl,request.rootPc)
      );

    console.debug(
      "Voicing Engine results",
      request.chordName,
      compMapEngineTuning(),
      `${range.minFret}-${range.maxFret}`,
      {
        bassDegree:requestedBassDegree,
        raw:raw.length,
        exactUnique:converted.length
      }
    );

    return collapseMutedStringVariants(
      deduplicateCompMapTemplates(converted,request.rootPc),
      request.rootPc
    );
  }catch(error){
    console.warn("Voicing Engine generation failed:",error);
    return [];
  }
}

function applyEngineTemplateToBox(box,tpl,rootPc){
  if(!box || !tpl) return;

  box.dataset.diagramId=tpl.id;
  box.dataset.voicingId=tpl.id;
  box.dataset.voicingLabel=tpl.name || box.dataset.chord || "";
  box.dataset.rootString=String(tpl.rootString || "");
  box.dataset.fingeringCode=
    fingeringCodeFromFrets(absoluteDiagramFrets(tpl,rootPc));
  box.dataset.voicingSource="engine";
  box._engineVoicingResult=tpl.engineResult || null;

  refreshChordNotation(box);
}

function tuningMovementCost(previousFrets,candidateFrets){
  let cost=0;
  for(let stringIndex=0;stringIndex<6;stringIndex++){
    const before=previousFrets[stringIndex];
    const after=candidateFrets[stringIndex];

    if(before===null && after===null) continue;
    if(before===null || after===null){
      // Muting or adding a string changes the hand shape, but should not
      // outweigh a large movement of the remaining fingers.
      cost+=5;
      continue;
    }

    if(before===0 && after===0) continue;
    if(before===0 || after===0){
      cost+=3+Math.abs(Number(before)-Number(after));
      continue;
    }

    cost+=Math.abs(Number(before)-Number(after));
  }

  const beforeFingered=previousFrets.filter(fret=>Number(fret)>0);
  const afterFingered=candidateFrets.filter(fret=>Number(fret)>0);
  if(beforeFingered.length && afterFingered.length){
    const beforeCenter=beforeFingered.reduce((a,b)=>a+b,0)/beforeFingered.length;
    const afterCenter=afterFingered.reduce((a,b)=>a+b,0)/afterFingered.length;
    cost+=Math.abs(beforeCenter-afterCenter)*2;
  }
  return cost;
}

function closestTemplateAfterTuning(templates,previousFrets,rootPc){
  if(!Array.isArray(templates) || !templates.length) return null;
  if(!Array.isArray(previousFrets) || previousFrets.length!==6) return templates[0];

  return templates
    .map((tpl,index)=>({
      tpl,
      index,
      cost:tuningMovementCost(
        previousFrets,
        absoluteDiagramFrets(tpl,rootPc)
          .concat([null,null,null,null,null,null])
          .slice(0,6)
      )
    }))
    .sort((a,b)=>a.cost-b.cost || a.index-b.index)[0].tpl;
}

function regenerateForLiveTuning(){
  try{
  const box=
    currentEngineVoicingBox ||
    currentArrangeFretboardState?.box ||
    (typeof editingChord!=="undefined" ? editingChord : null) ||
    null;

  if(!box) return false;

  const chordName=box.dataset.chord || box.dataset.baseChord || "C";
  const rootPc=rootPcFromChordName(chordName);
  const previousTemplate=currentArrangeFretboardState?.tpl || selectedTemplateForArrange(box);
  const previousFrets=previousTemplate
    ? absoluteDiagramFrets(previousTemplate,rootPc)
        .concat([null,null,null,null,null,null])
        .slice(0,6)
    : null;
  const templates=generateEngineTemplatesForBox(box);

  if(!templates.length) return false;

  // A tuning change must not select the same list index in a newly generated
  // result set. Choose the valid new voicing requiring the least physical
  // movement from the fingering currently shown on the fretboard.
  const selectedTemplate=
    closestTemplateAfterTuning(templates,previousFrets,rootPc) || templates[0];
  applyEngineTemplateToBox(box,selectedTemplate,rootPc);

  if(diagramPopup && diagramPopup.classList.contains("show")){
    fillDiagramGrid(box);
  }

  if(arrangeFretboardPopup && arrangeFretboardPopup.classList.contains("show")){
    const name=displayName(chordName);
    currentArrangeFretboardState={
      name,
      tpl:selectedTemplate,
      rootPc,
      box
    };
    arrangeFretboardTitle.textContent=name;
    arrangeFretboardBody.innerHTML=
      renderArrangeFretboardHtml(selectedTemplate,rootPc,box);
    bindExactGuitMapComponent();
    clearArrangeNearbyOverlay();
  }

  return true;
  }catch(error){
    console.warn("Live tuning regeneration failed; display retained.",error);
    return false;
  }
}

function compMapTemplateShapeKey(tpl,rootPc){
  return absoluteDiagramFrets(tpl,rootPc)
    .map(value=>value===null ? "x" : String(value))
    .join(",");
}

function deduplicateCompMapTemplates(templates,rootPc){
  const seen=new Set();
  return templates.filter(tpl=>{
    const key=compMapTemplateShapeKey(tpl,rootPc);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function soundingCountForTemplate(tpl,rootPc){
  return absoluteDiagramFrets(tpl,rootPc)
    .filter(fret=>fret!==null && fret!==undefined)
    .length;
}

function pitchClassSetForTemplate(tpl,rootPc){
  const tuning=
    typeof compMapEngineTuning==="function"
      ? compMapEngineTuning()
      : STRING_OPEN_MIDI;

  const pcs=new Set();

  absoluteDiagramFrets(tpl,rootPc).forEach((fret,stringIndex)=>{
    if(fret===null || fret===undefined) return;
    const midi=Number(tuning[stringIndex])+Number(fret);
    pcs.add(((midi%12)+12)%12);
  });

  return pcs;
}

function equalPitchClassSets(a,b){
  if(a.size!==b.size) return false;
  for(const value of a){
    if(!b.has(value)) return false;
  }
  return true;
}

function fullerTemplateContainsSparseShape(fuller,sparser,rootPc){
  const fullFrets=absoluteDiagramFrets(fuller,rootPc);
  const sparseFrets=absoluteDiagramFrets(sparser,rootPc);

  // Every sounding string in the sparse candidate must appear at exactly
  // the same fret in the fuller candidate. The fuller candidate may sound
  // additional strings that the sparse version mutes.
  for(let stringIndex=0;stringIndex<6;stringIndex++){
    const sparseFret=sparseFrets[stringIndex];
    if(sparseFret===null || sparseFret===undefined) continue;

    if(fullFrets[stringIndex]!==sparseFret){
      return false;
    }
  }

  return true;
}

function collapseMutedStringVariants(templates,rootPc){
  if(!Array.isArray(templates) || templates.length<2){
    return templates || [];
  }

  const records=templates.map((tpl,index)=>({
    tpl,
    index,
    soundingCount:soundingCountForTemplate(tpl,rootPc),
    pitchClasses:pitchClassSetForTemplate(tpl,rootPc)
  }));

  const removed=new Set();

  // Prefer the richest playable version. A candidate is removed only when
  // another candidate:
  // 1. contains every one of its sounding string/fret positions,
  // 2. adds one or more sounding strings,
  // 3. produces the identical set of chord pitch classes.
  for(let sparseIndex=0;sparseIndex<records.length;sparseIndex++){
    if(removed.has(sparseIndex)) continue;

    const sparse=records[sparseIndex];
    let bestFuller=null;

    for(let fullIndex=0;fullIndex<records.length;fullIndex++){
      if(fullIndex===sparseIndex) continue;

      const fuller=records[fullIndex];

      if(fuller.soundingCount<=sparse.soundingCount) continue;
      if(!equalPitchClassSets(fuller.pitchClasses,sparse.pitchClasses)) continue;
      if(!fullerTemplateContainsSparseShape(fuller.tpl,sparse.tpl,rootPc)) continue;

      if(
        !bestFuller ||
        fuller.soundingCount>bestFuller.soundingCount ||
        (
          fuller.soundingCount===bestFuller.soundingCount &&
          fuller.index<bestFuller.index
        )
      ){
        bestFuller=fuller;
      }
    }

    if(bestFuller){
      removed.add(sparseIndex);
    }
  }

  return records
    .filter((record,index)=>!removed.has(index))
    .map(record=>record.tpl);
}

function diagramPhysicalFamily(tpl, rootPc){
  if(tpl?.physicalFamily){
    return tpl.physicalFamily;
  }

  const frets=absoluteDiagramFrets(tpl, rootPc);
  if(frets.some(fret=>fret===0)) return "open";

  const rootString=Number(tpl.rootString);
  if(rootString===6) return "string-6";
  if(rootString===5) return "string-5";
  if(rootString===4) return "string-4";
  return "other";
}

function savedFingeringMatchesChordInLiveTuning(box,code){
  if(!box || !isFingeringCode(code)) return false;
  const frets=fretsFromFingeringCode(code);
  if(!frets || frets.length!==6) return false;

  const chordName=box.dataset.chord || box.dataset.baseChord || "C";
  const rootPc=rootPcFromChordName(chordName);
  const suffix=rootAndSuffix(chordName).suffix || "";
  const fam=suffixFamilyForDiagram(box);
  const tuning=compMapEngineTuning();
  const pcs=[];

  frets.forEach((f,stringIndex)=>{
    if(f===null || f===undefined) return;
    const fret=Number(f);
    if(!Number.isFinite(fret) || fret<0 || fret>15) return;
    pcs.push((Number(tuning[stringIndex])+fret)%12);
  });
  if(!pcs.length) return false;

  const {allowed,strong,color,requiredTitle}=expectedChordToneInfo(rootPc,suffix,fam);
  if(pcs.some(pc=>!allowed.has(pc))) return false;
  for(const pc of strong){ if(!pcs.includes(pc)) return false; }
  for(const pc of requiredTitle){ if(!pcs.includes(pc)) return false; }
  if(!requiredTitle.size && color.size){
    let hasColor=false;
    for(const pc of color){
      if(pcs.includes(pc)){ hasColor=true; break; }
    }
    if(!hasColor) return false;
  }
  return true;
}

function revealSelectedVoicing(group){
  if(!voicingScrollArea || !group) return;

  const perform=()=>{
    const selectedCard=group.querySelector(".diagram-card.selected-diagram");
    const target=selectedCard || group;
    if(!target) return;

    const scrollRect=voicingScrollArea.getBoundingClientRect();
    const targetRect=target.getBoundingClientRect();
    const padding=8;
    const targetTop=
      voicingScrollArea.scrollTop +
      (targetRect.top-scrollRect.top) -
      padding;
    const targetBottom=
      voicingScrollArea.scrollTop +
      (targetRect.bottom-scrollRect.top) +
      padding;
    const visibleTop=voicingScrollArea.scrollTop;
    const visibleBottom=visibleTop+voicingScrollArea.clientHeight;

    if(targetTop<visibleTop || targetBottom>visibleBottom){
      voicingScrollArea.scrollTo({
        top:Math.max(0,targetTop),
        behavior:"auto"
      });
    }
  };

  // Accordion display changes and pasted content can settle over more than one
  // layout frame on iOS. Retry after layout so the highlighted card is always
  // the item the user sees when the panel opens.
  requestAnimationFrame(()=>requestAnimationFrame(perform));
  setTimeout(perform,80);
}

function createDiagramCard(box, tpl, rootPc){
  const card=document.createElement("button");
  card.className="diagram-card";
  if(isPreferredDiagram(tpl)) card.classList.add("preferred-diagram");

  // 1.4.15: A pasted/restored voicing may have a valid fingering code but a
  // newly generated engine template ID. Match the physical six-string shape
  // as well as the transient template ID so the diagram shown on the
  // Guit-Map fretboard is highlighted when the selector reopens.
  const templateCode=fingeringCodeFromFrets(
    absoluteDiagramFrets(tpl, rootPc)
  );
  const selectedCode=box.dataset.fingeringCode || "";
  const isSelected =
    box.dataset.diagramId===tpl.id ||
    box.dataset.voicingId===tpl.id ||
    (isFingeringCode(selectedCode) && templateCode===selectedCode);
  if(isSelected) card.classList.add("selected-diagram");
  card.innerHTML=
    `<div class="cm-voicing-chord-name">${
      chordDisplayNameForVoicing(box,tpl)
    }</div>`+
    renderDiagramHtml(tpl,rootPc,box);

  card.addEventListener("click", e=>{
    e.preventDefault();
    e.stopPropagation();

    if(card._cmLongPressHandled){
      card._cmLongPressHandled=false;
      return;
    }

    const wasAlreadySelected =
      box.dataset.diagramId===tpl.id ||
      box.dataset.voicingId===tpl.id ||
      ((box.dataset.fingeringCode || "")===templateCode);

    box.dataset.diagramId=tpl.id;
    box.dataset.voicingId=tpl.id;
    box.dataset.voicingSource=tpl.source || "engine";
    if(tpl.engineResult){
      box._engineVoicingResult=tpl.engineResult;
    }
    box.dataset.voicingLabel=tpl.name;
    box.dataset.rootString=String(tpl.rootString);
    box.dataset.fingeringCode=
      fingeringCodeFromFrets(absoluteDiagramFrets(tpl, rootPc));

    refreshChordNotation(box);
    copyProgressionNow();

    const name=chordDisplayNameForVoicing(box,tpl);

    // 1.4.42:
    // First tap selects the voicing and displays it on the permanent fretboard.
    // Second tap on that already-selected voicing returns to Harmony.
    openArrangeFretboard(name, tpl, rootPc, box);

    if(wasAlreadySelected){
      if(typeof window.cmCloseVoicingWorkspace==="function"){
        window.cmCloseVoicingWorkspace();
      }

      /* The second tap has now completed the voicing workflow. Perform the
         same action as a normal tap on the Progression button after Harmony
         has been restored. */
      setTimeout(()=>{
        window.cmCurrentProgressionBox=box;

        if(typeof editingChord!=="undefined"){
          editingChord=box;
        }
        if(typeof currentEngineVoicingBox!=="undefined"){
          currentEngineVoicingBox=box;
        }

        document.querySelectorAll("#progressionArea .prog-chord").forEach(item=>{
          item.classList.toggle("edit-selected",item===box);
        });

        if(typeof window.cmRefreshProgressionSummary==="function"){
          window.cmRefreshProgressionSummary();
        }

        const progressionButton=
          document.getElementById("cmCurrentProgression");

        if(progressionButton){
          progressionButton.click();
        }else if(typeof window.cmOpenProgressionPopup==="function"){
          window.cmOpenProgressionPopup(box);
        }
      },80);
    }else{
      fillDiagramGrid(box);
    }
  });

  bindPentatonicLongPress(card,box,tpl,rootPc,templateCode);
  return card;
}

function fillDiagramGrid(box){
  if(!diagramGrid) return;
  if(box) currentEngineVoicingBox=box;

  diagramGrid.innerHTML="";
  if(voicingFamilyGroups) voicingFamilyGroups.innerHTML="";
  if(voicingScrollArea){
    voicingScrollArea.scrollTop=0;
  }
  bindVoicingGroupToggle(topVoicingGroup);
  closeAllVoicingGroups();

  if(!box){
    updateDiagramPanelTitle(null);
    return;
  }

  updateDiagramPanelTitle(box);
  updateInversionButtons(box);

  const rootPc=
    rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C");
  const engineRequest=compMapChordToEngineTemplate(box);
  const engineTemplates=generateEngineTemplatesForBox(box);
  const exactUniqueTemplates=
    deduplicateCompMapTemplates(engineTemplates,rootPc);
  const templates=
    collapseMutedStringVariants(exactUniqueTemplates,rootPc);

  if(!templates || templates.length===0){
    const empty=document.createElement("div");
    empty.className="no-voicings-message";
    const inversionName={
      root:"Root-position",
      first:"First-inversion",
      second:"Second-inversion"
    }[inversionFilterForBox(box)] || "Selected-inversion";

    empty.innerHTML=engineRequest
      ? `${inversionName} voicings<br>do not meet the current criteria.`
      : "No voicings<br>meet the current criteria.";
    diagramGrid.appendChild(empty);
    diagramGrid.classList.add("show");
    return;
  }

  const topEight=templates.slice(0,8);
  if(topVoicingCount){
    topVoicingCount.textContent=String(topEight.length);
  }
  const topIds=new Set(topEight.map(tpl=>tpl.id));
  const selectedCode=box.dataset.fingeringCode || "";
  const selectedId=box.dataset.diagramId || box.dataset.voicingId || "";
  const selectedTemplate=templates.find(tpl=>{
    if(selectedId && tpl.id===selectedId) return true;
    if(!selectedCode) return false;
    return fingeringCodeFromFrets(absoluteDiagramFrets(tpl,rootPc))===selectedCode;
  }) || null;

  const savedVoicingInvalid=
    isFingeringCode(selectedCode) &&
    !selectedTemplate &&
    !savedFingeringMatchesChordInLiveTuning(box,selectedCode);

  if(savedVoicingInvalid){
    // Retain the saved code as evidence of the user's prior choice, but remove
    // transient engine IDs that could falsely highlight an unrelated result.
    box.dataset.diagramId="";
    box.dataset.voicingId="";
    const warning=document.createElement("div");
    warning.className="voicing-invalid-message";
    warning.textContent="Voicing no longer valid for the current tuning.";
    diagramGrid.appendChild(warning);
  }

  let selectedGroup=selectedTemplate && topEight.includes(selectedTemplate)
    ? topVoicingGroup
    : null;

  topEight.forEach(tpl=>{
    diagramGrid.appendChild(createDiagramCard(box,tpl,rootPc));
  });

  const familyOrder=[
    ["open","Open strings"],
    ["string-6","Root on 6th string"],
    ["string-5","Root on 5th string"],
    ["string-4","Root on 4th string"],
    ["rootless","Rootless"],
    ["other","Other"]
  ];

  familyOrder.forEach(([familyKey,familyLabel])=>{
    const familyTemplates=templates.filter(tpl=>
      diagramPhysicalFamily(tpl,rootPc)===familyKey
    );

    if(!familyTemplates.length || !voicingFamilyGroups) return;

    const group=document.createElement("section");
    group.className="voicing-family-group";

    const toggle=document.createElement("button");
    toggle.type="button";
    toggle.className="voicing-family-toggle";
    toggle.setAttribute("aria-expanded","false");
    toggle.innerHTML=`
      <span>${familyLabel}</span>
      <span>${familyTemplates.length}<span class="voicing-family-arrow">▶</span></span>
    `;

    const content=document.createElement("div");
    content.className="voicing-family-content";
    content.setAttribute("tabindex","0");
    content.setAttribute("tabindex","0");

    familyTemplates.forEach(tpl=>{
      content.appendChild(createDiagramCard(box,tpl,rootPc));
    });

    group.appendChild(toggle);
    group.appendChild(content);
    voicingFamilyGroups.appendChild(group);
    bindVoicingGroupToggle(group);

    if(
      selectedTemplate &&
      !selectedGroup &&
      familyTemplates.includes(selectedTemplate)
    ){
      selectedGroup=group;
    }
  });

  // Open the one accordion group that actually contains the selected voicing.
  // If there is no current selection, retain Top as the normal default.
  const groupToOpen=selectedGroup || topVoicingGroup;
  closeAllVoicingGroups(groupToOpen);
  setVoicingGroupOpen(groupToOpen,true);

  revealSelectedVoicing(groupToOpen);

  diagramGrid.classList.add("show");
}

function openDiagramPopup(box){
  if(!diagramPopup || !diagramGrid || !box) return;
  fillDiagramGrid(box);
  diagramGrid.classList.add("show");
  diagramPopup.classList.add("show");
}

function selectedTemplateForArrange(box){
  const savedCode = box && box.dataset ? (box.dataset.fingeringCode || "") : "";
  if(isFingeringCode(savedCode)){
    const savedTpl = fingeringTemplateFromCode(box, savedCode);
    const rootPc=rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C");
    // Do not reuse an older saved fingering if the chord tones have changed
    // (for example after choosing ♭13 instead of natural 13).
    if(savedTpl && diagramMatchesChord(box, savedTpl, rootPc)) return savedTpl;
  }
  const templates=generateEngineTemplatesForBox(box);
  if(!templates || !templates.length) return null;
  const selectedId=box.dataset.diagramId || box.dataset.voicingId || "";
  const selectedCode=box.dataset.fingeringCode || "";
  return templates.find(t=>t.id===selectedId) ||
    templates.find(t=>fingeringCodeFromFrets(
      absoluteDiagramFrets(t,rootPcFromChordName(
        box.dataset.chord || box.dataset.baseChord || "C"
      ))
    )===selectedCode) ||
    templates[0];
}

let preferredFretMin=0;
let preferredFretMax=15;
let guitMapRangeStart=null;
let guitMapRangeEnd=null;

function updateArrangeFretRangeUi(){
  const minInput=document.getElementById("arrangeFretMin");
  const maxInput=document.getElementById("arrangeFretMax");
  const label=document.getElementById("arrangeFretRangeLabel");
  const selected=document.getElementById("arrangeFretRangeSelected");

  if(!minInput || !maxInput) return;

  preferredFretMin=Number(minInput.value);
  preferredFretMax=Number(maxInput.value);

  if(preferredFretMin>preferredFretMax){
    if(document.activeElement===minInput){
      preferredFretMin=preferredFretMax;
      minInput.value=String(preferredFretMin);
    }else{
      preferredFretMax=preferredFretMin;
      maxInput.value=String(preferredFretMax);
    }
  }

  if(label){
    label.textContent=`Frets (${preferredFretMin}–${preferredFretMax})`;
  }

  if(selected){
    const lowPct=(preferredFretMin/15)*100;
    const highPct=(preferredFretMax/15)*100;
    selected.style.top=`${lowPct}%`;
    selected.style.bottom="auto";
    selected.style.height=`${Math.max(0,highPct-lowPct)}%`;

}

function bindArrangeFretRange(){
  const minInput=document.getElementById("arrangeFretMin");
  const maxInput=document.getElementById("arrangeFretMax");
  if(!minInput || !maxInput) return;

  const update=()=>{
    updateArrangeFretRangeUi();
    regenerateForLiveTuning();
  };

  minInput.addEventListener("input",update);
  maxInput.addEventListener("input",update);
  minInput.addEventListener("change",update);
  maxInput.addEventListener("change",update);

  const overlay=document.querySelector(".arrange-fret-range-overlay");
  const track=document.querySelector(".arrange-fret-range-track");
  const svg=document.querySelector(".arrange-fretboard-svg");

  const syncRangeHeight=()=>{
    if(!overlay || !track || !svg) return;

    const main=svg.closest(".arrange-fretboard-main");
    const nutLine=svg.querySelector('[data-fret="0"]');
    const lastFretLine=svg.querySelector('[data-fret="15"]');

    if(!main || !nutLine || !lastFretLine) return;

    const mainRect=main.getBoundingClientRect();
    const nutRect=nutLine.getBoundingClientRect();
    const lastRect=lastFretLine.getBoundingClientRect();

    const overlayTopPx=nutRect.top-mainRect.top;
    const boardHeightPx=lastRect.top-nutRect.top;

    if(boardHeightPx<=0) return;

    overlay.style.setProperty("top",`${overlayTopPx}px`,"important");
    overlay.style.setProperty("bottom","auto","important");
    overlay.style.setProperty("height",`${boardHeightPx}px`,"important");
    track.style.setProperty("height",`${boardHeightPx}px`,"important");

    [minInput,maxInput].forEach(input=>{
      input.style.setProperty("width",`${boardHeightPx}px`,"important");
    });
  };

  syncRangeHeight();
  requestAnimationFrame(syncRangeHeight);
  setTimeout(syncRangeHeight,60);

  updateArrangeFretRangeUi();
}

function arrangeFretboardDetailData(tpl, rootPc, box, frets){
  const chordName=box ? (box.dataset.chord || box.dataset.baseChord || "C") : "C";
  const suffix=rootAndSuffix(chordName).suffix || "";
  const fam=box ? suffixFamilyForDiagram(box) : "";
  const theoretical=box ? theoreticalChordToneDegrees(rootPc, suffix, fam) : [];
  const includedPcs=diagramIncludedPcs(tpl, rootPc);

  const includedLabels=theoretical
    .filter(tone => includedPcs.includes(tone.pc))
    .map(tone => tone.label);

  const omittedLabels=theoretical
    .filter(tone => !includedPcs.includes(tone.pc))
    .map(tone => tone.label);

  const openMidi=[40,45,50,55,59,64];
  const sounding=frets
    .map((fret,stringIndex)=>{
      if(fret===null) return null;
      return {
        stringIndex,
        fret,
        midi:openMidi[stringIndex]+fret,
        pc:(fretboardOpenPitchClass(stringIndex)+fret)%12
      };
    })
    .filter(Boolean)
    .sort((a,b)=>a.midi-b.midi);

  const bass=sounding[0] || null;
  const noteNames=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
  const bassName=bass ? noteNames[bass.pc] : "—";

  const storedFingering=box?.dataset?.fingeringCode || "";
  const fingering=storedFingering || arrangeFretboardTabText(frets).join(" ");

  return {
    bass:bassName,
    construction:"—"
  };
}

function renderArrangeFretboardInfoHtml(tpl, rootPc, box, frets){
  const details=arrangeFretboardDetailData(tpl, rootPc, box, frets);
  const hasConstruction=
    details.construction &&
    details.construction !== "—";

  return `
    <div class="arrange-fretboard-info">
      <div id="arrangeFretRangeLabel" class="arrange-fret-range-label">
        Frets (${preferredFretMin}–${preferredFretMax})
      </div>
      <div class="arrange-fretboard-details">
        ${hasConstruction ? `
          <div class="arrange-fretboard-detail-label">Construction</div>
          <div class="arrange-fretboard-detail-value">${details.construction}</div>
        ` : ""}

        <div class="arrange-fretboard-detail-label">Bass</div>
        <div class="arrange-fretboard-detail-value">${details.bass}</div>
      </div>
    </div>
  `;
}

const STANDARD_FRETBOARD_TUNING=[40,45,50,55,59,64];
let currentFretboardTuning=[...STANDARD_FRETBOARD_TUNING];

const FRETBOARD_TUNING_NOTE_NAMES=[
  "C","C♯","D","D♯","E","F",
  "F♯","G","G♯","A","A♯","B"
];

function fretboardOpenPitchClass(stringIndex){
  return ((currentFretboardTuning[stringIndex] % 12) + 12) % 12;
}

function fretboardTuningNoteName(stringIndex){
  return FRETBOARD_TUNING_NOTE_NAMES[
    ((currentFretboardTuning[stringIndex] % 12) + 12) % 12
  ];
}

function canAdjustFretboardTuning(stringIndex,direction){
  const proposed=currentFretboardTuning[stringIndex]+direction;

  if(
    direction>0 &&
    stringIndex<currentFretboardTuning.length-1 &&
    proposed>currentFretboardTuning[stringIndex+1]
  ){
    return false;
  }

  if(
    direction<0 &&
    stringIndex>0 &&
    proposed<currentFretboardTuning[stringIndex-1]
  ){
    return false;
  }

  return true;
}

function adjustArrangeFretboardTuning(stringIndex,direction,event=null){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }

  stringIndex=Number(stringIndex);
  direction=Number(direction);

  if(
    !Number.isInteger(stringIndex) ||
    stringIndex<0 ||
    stringIndex>5 ||
    ![1,-1].includes(direction)
  ){
    return false;
  }

  if(!canAdjustFretboardTuning(stringIndex,direction)){
    return false;
  }

  currentFretboardTuning[stringIndex]+=direction;

  // Generate a new fingering from the live tuning first.
  const regenerated=regenerateForLiveTuning();

  // If there is no active chord to regenerate, still redraw the tuner labels.
  if(!regenerated){
    refreshOpenArrangeFretboard();
  }

  return false;
}

function renderArrangeFretboardTunersHtml(){
  return `
    <div class="arrange-fretboard-tuner-row">
      ${Array.from({length:6},(_,stringIndex)=>{
        const upDisabled=!canAdjustFretboardTuning(stringIndex,1);
        const downDisabled=!canAdjustFretboardTuning(stringIndex,-1);

        return `
          <div
            class="arrange-fretboard-tuner"
            data-string-index="${stringIndex}"
          >
            <div class="arrange-fretboard-tuner-oval">
              <button
                type="button"
                class="arrange-fretboard-tuner-half up"
                onclick="return adjustArrangeFretboardTuning(${stringIndex},1,event)"
                aria-label="Raise string ${6-stringIndex} one semitone"
                ${upDisabled ? "disabled" : ""}
              ></button>
              <button
                type="button"
                class="arrange-fretboard-tuner-half down"
                onclick="return adjustArrangeFretboardTuning(${stringIndex},-1,event)"
                aria-label="Lower string ${6-stringIndex} one semitone"
                ${downDisabled ? "disabled" : ""}
              ></button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function bindArrangeFretboardTuners(){
  // Direct onclick handlers are embedded in each tuner button so
  // tuning remains functional after every fretboard rerender.
}
let currentArrangeFretboardState=null;

function refreshOpenArrangeFretboard(){
  if(!currentArrangeFretboardState) return;

  if(currentArrangeFretboardState.blank || !currentArrangeFretboardState.tpl){
    arrangeFretboardBody.innerHTML=renderBlankArrangeFretboardHtml();

    // Rebind the actual Guit-Map controls after every redraw.
    // The previous version mistakenly rebound the removed slider controls,
    // leaving the newly rendered fret numbers unclickable after the first tap.
    bindExactGuitMapComponent();

    clearArrangeNearbyOverlay();
    return;
  }

  const {name,tpl,rootPc,box}=currentArrangeFretboardState;
  arrangeFretboardBody.innerHTML=renderArrangeFretboardHtml(tpl,rootPc,box);
  bindExactGuitMapComponent();
  clearArrangeNearbyOverlay();

const GUIT_MAP_BOARD_W=183;
const GUIT_MAP_BOARD_H=586;
const GUIT_MAP_HEAD_H=56;
const GUIT_MAP_NUT_H=14;
const GUIT_MAP_TOTAL_FRETS=15;
const GUIT_MAP_STRING_WIDTHS=[6,5,4,3,2,1];

const GUIT_MAP_STRING_EDGE_INSET=7;

const GUIT_MAP_STRING_X=Object.freeze(
  Array.from({length:6},(_,stringIndex)=>
    GUIT_MAP_STRING_EDGE_INSET +
    (
      (GUIT_MAP_BOARD_W-(GUIT_MAP_STRING_EDGE_INSET*2)) *
      (stringIndex/5)
    )
  )
);

function guitMapStringX(stringIndex){
  const index=Math.max(0,Math.min(5,Number(stringIndex)||0));
  return GUIT_MAP_STRING_X[index];
}

function guitMapFretBoundary(fret){
  return (GUIT_MAP_BOARD_H/GUIT_MAP_TOTAL_FRETS)*fret;
}

function guitMapFretCenter(fret){
  return (
    guitMapFretBoundary(fret-1)+
    guitMapFretBoundary(fret)
  )/2;
}

function guitMapSelectedFrets(){
  if(guitMapRangeStart===null || guitMapRangeEnd===null){
    return new Set();
  }

  const low=Math.min(guitMapRangeStart,guitMapRangeEnd);
  const high=Math.max(guitMapRangeStart,guitMapRangeEnd);
  return new Set(
    Array.from({length:high-low+1},(_,index)=>low+index)
  );
}

function guitMapRangeText(){
  if(guitMapRangeStart===null || guitMapRangeEnd===null){
    return "Frets (0–15)";
  }

  const low=Math.min(guitMapRangeStart,guitMapRangeEnd);
  const high=Math.max(guitMapRangeStart,guitMapRangeEnd);
  return `Frets (${low}–${high})`;
}

function renderExactGuitMapTuners(){
  return Array.from({length:6},(_,stringIndex)=>`
    <button
      type="button"
      class="gm-exact-tune"
      data-tuner-string="${stringIndex}"
      aria-label="Tune string ${6-stringIndex}"
      style="left:${guitMapStringX(stringIndex)}px"
    ></button>
  `).join("");
}

function exactGuitMapVoicingData(tpl,rootPc,box,stringIndex){
  const frets=tpl
    ? absoluteDiagramFrets(tpl,rootPc)
        .concat([null,null,null,null,null,null])
        .slice(0,6)
    : Array(6).fill(null);

  const fret=frets[stringIndex];
  const isMuted=!!tpl && (fret===null || fret===undefined);
  const isOpen=fret===0;
  const isFretted=Number.isFinite(fret) && fret>=1 && fret<=15;
  const isRoot=!!tpl && stringIndex===tpl.rootIdx;
  const label=(isOpen || isFretted)
    ? exactGuitMapDegreeLabel(tpl,stringIndex,fret,rootPc,box)
    : "";

  return {
    fret,
    isMuted,
    isOpen,
    isFretted,
    isRoot,
    label,
    left:guitMapStringX(stringIndex),
    top:isFretted ? guitMapFretCenter(fret) : null
  };
}

function renderExactGuitMapVoicingMarker(
  tpl,
  rootPc,
  box,
  stringIndex,
  placement
){
  const marker=exactGuitMapVoicingData(
    tpl,
    rootPc,
    box,
    stringIndex
  );

  if(placement==="open"){
    return `
      <div
        class="gm-exact-open${marker.isOpen ? " active" : ""}${marker.isOpen && marker.isRoot ? " root" : ""}"
        style="left:${marker.left}px"
      >${
        marker.isMuted
          ? "×"
          : (
              marker.isOpen
                ? (marker.label || "")
                : fretboardTuningNoteName(stringIndex)
            )
      }</div>
    `;
  }

  if(placement==="fretted" && marker.isFretted){
    return `
      <div
        class="gm-exact-mark${marker.isRoot ? " root" : ""}"
        style="
          left:${marker.left}px;
          top:${marker.top}px
        "
      >${marker.label || ""}</div>
    `;
  }

  return "";
}

function renderExactGuitMapOpenRow(tpl,rootPc,box){

function renderExactGuitMapFretSelection(){

function preserveDegreeLabel(value){
  if(value===null || value===undefined) return "";

  const text=String(value).trim();
  if(!text) return "";

  return text
    .replace(/^b/,"♭")
    .replace(/^#/,"♯");
}

function chromaticIntervalDegreeLabel(interval){
  const normalized=((Number(interval)%12)+12)%12;

  const map={
    0:"1",
    1:"♭2",
    2:"2",
    3:"♭3",
    4:"3",
    5:"4",
    6:"♭5",
    7:"5",
    8:"♯5",
    9:"6",
    10:"♭7",
    11:"7"
  };

  return map[normalized] || "";
}

function exactGuitMapDegreeLabel(tpl,stringIndex,fret,rootPc,box){
  const engineNote=
    tpl?.soundingNotes?.find(note=>
      Number(note.stringIndex)===Number(stringIndex) &&
      Number(note.fret)===Number(fret)
    ) ||
    tpl?.engineResult?.stats?.sounding?.find(note=>
      Number(note.stringIndex)===Number(stringIndex) &&
      Number(note.fret)===Number(fret)
    ) ||
    tpl?.engineResult?.sounding?.find(note=>
      Number(note.stringIndex)===Number(stringIndex) &&
      Number(note.fret)===Number(fret)
    );

  // 1.4.12: Comp-Map's canonical chord spelling is authoritative.
  // The engine may describe pitch classes generically as 9/11/13; the visible
  // fretboard must instead show 2/4/6 for sus2/sus4/6 chords and 𝄫7 for dim7.
  const tuning=
    typeof compMapEngineTuning==="function"
      ? compMapEngineTuning()
      : STRING_OPEN_MIDI;

  const midi=Number(tuning[stringIndex])+Number(fret);
  const pc=((midi%12)+12)%12;

  const canonical=diagramToneLabelForPc(pc,rootPc,box);
  if(canonical) return preserveDegreeLabel(canonical);

  const direct=preserveDegreeLabel(engineNote?.degree);
  if(direct) return direct;

  return chromaticIntervalDegreeLabel(pc-rootPc);
}

function bindExactGuitMapTuners(){
  if(!arrangeFretboardBody) return;

  arrangeFretboardBody
    .querySelectorAll("[data-tuner-string]")
    .forEach(button=>{
      button.addEventListener("pointerdown",event=>{
        event.preventDefault();
        event.stopPropagation();

        const stringIndex=Number(button.dataset.tunerString);
        if(!Number.isFinite(stringIndex)) return;

        const rect=button.getBoundingClientRect();
        const direction=event.clientY < rect.top+rect.height/2 ? 1 : -1;
        adjustArrangeFretboardTuning(stringIndex,direction);
      });
    });
}

function bindExactGuitMapFretSelection(){
  if(!arrangeFretboardBody) return;

  arrangeFretboardBody
    .querySelectorAll("[data-gm-fret]")
    .forEach(button=>{
      button.onclick=(event)=>{
        event.preventDefault();
        event.stopPropagation();

        const fret=Number(button.dataset.gmFret);
        if(!Number.isFinite(fret)) return;

        // First tap starts a new range.
        if(guitMapRangeStart===null || guitMapRangeEnd!==null){
          guitMapRangeStart=fret;
          guitMapRangeEnd=null;

          preferredFretMin=fret===1 ? 0 : fret;
          preferredFretMax=fret;

          // Redraw only; do not regenerate the engine from a one-fret
          // temporary endpoint.
          refreshOpenArrangeFretboard();
          return;
        }

        // Tapping the pending endpoint again clears the range.  The unshaded
        // fretboard is the visual state for Anywhere, so keep the model in sync:
        // no completed selection always means the full live range 0–15.
        if(guitMapRangeStart===fret){
          guitMapRangeStart=null;
          guitMapRangeEnd=null;
          preferredFretMin=0;
          preferredFretMax=15;

          const regenerated=regenerateForLiveTuning();
          if(!regenerated){
            refreshOpenArrangeFretboard();
          }
          return;
        }

        // Second tap on a different fret completes the inclusive range.
        guitMapRangeEnd=fret;

        const low=Math.min(guitMapRangeStart,guitMapRangeEnd);
        const high=Math.max(guitMapRangeStart,guitMapRangeEnd);

        preferredFretMin=low===1 ? 0 : low;
        preferredFretMax=high;

        const regenerated=regenerateForLiveTuning();

        // Regeneration may be unavailable on the blank startup fretboard.
        // Always redraw so the range label and highlights update.
        if(!regenerated){
          refreshOpenArrangeFretboard();
        }
      };
    });
}

function renderArrangeNearbyOverlay(retainedPositions=[],newPositions=[]){
  if(!arrangeFretboardBody) return;

  const overlay=arrangeFretboardBody.querySelector(".arrange-nearby-overlay");
  if(!overlay) return;

  const ring=(position,className)=>{
    const fret=Number(position.fret);
    const stringIndex=Number(position.stringIndex);

    if(!Number.isFinite(fret) || !Number.isFinite(stringIndex)){
      return "";
    }

    return `
      <span
        class="${className} gm-exact-nearby-ring"
        style="
          left:${guitMapStringX(stringIndex)}px;
          top:${fret===0 ? 0 : guitMapFretCenter(fret)}px
        "
      ></span>
    `;
  };

  overlay.innerHTML=[
    ...retainedPositions.map(position=>
      ring(position,"arrange-nearby-retained-ring")
    ),
    ...newPositions.map(position=>
      ring(position,"arrange-nearby-new-ring")
    )
  ].join("");
}

function openArrangeFretboard(name, tpl, rootPc, box=null){
  if(!arrangeFretboardPopup || !arrangeFretboardBody || !tpl) return;
  arrangeFretboardCurrentBox=box || null;
  const displayedName=(box && typeof window.cmDisplayedChordName==="function")
    ? window.cmDisplayedChordName(box,{voicingAware:true,tpl,fallback:name || "Chord fingering"})
    : (name || "Chord fingering");
  if(arrangeFretboardTitle) arrangeFretboardTitle.textContent=displayedName;
  currentArrangeFretboardState={name:displayedName,tpl,rootPc,box};
  if(box) currentEngineVoicingBox=box;
  arrangeFretboardBody.innerHTML=renderArrangeFretboardHtml(tpl, rootPc, box);
  bindExactGuitMapComponent();
  clearArrangeNearbyOverlay();
  document.body.classList.add("fretboard-modal-open");
  arrangeFretboardPopup.classList.add("show");
  arrangeFretboardPopup.style.setProperty("z-index", "2147483000", "important");
  arrangeFretboardPopup.style.setProperty("visibility", "visible", "important");
  arrangeFretboardPopup.style.setProperty("display", "block", "important");
  // Keep the fretboard on top when opened from the diagram selector or Arrange view.
  if(arrangeFretboardPopup.parentElement!==document.body){
    document.body.appendChild(arrangeFretboardPopup);

  if(idx<0) idx=0;
  idx=(idx + delta + boxes.length) % boxes.length;
  openArrangeFretboardForBox(boxes[idx]);

function bindArrangeFretboardSwipe(){
  if(!arrangeFretboardPopup || arrangeFretboardPopup.dataset.swipeBound==="1") return;
  arrangeFretboardPopup.dataset.swipeBound="1";

  let startX=0;
  let startY=0;
  let tracking=false;

  arrangeFretboardPopup.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    const target=e.target;
    if(
      target.closest("button") ||
      target.closest('input[type="range"]') ||
      target.closest(".arrange-fretboard-tuner")
    ){
      tracking=false;
      return;
    }
    const touch=e.touches[0];
    startX=touch.clientX;
    startY=touch.clientY;
    tracking=true;
  },{passive:true});

  arrangeFretboardPopup.addEventListener("touchend",e=>{
    if(!tracking || e.changedTouches.length!==1) return;
    tracking=false;

    const touch=e.changedTouches[0];
    const dx=touch.clientX-startX;
    const dy=touch.clientY-startY;

    if(Math.abs(dx)<55 || Math.abs(dx)<=Math.abs(dy)*1.25) return;
    if(currentArrangeFretboardState?.blank) return;

    stepArrangeFretboard(dx<0 ? 1 : -1);
  },{passive:true});
}

function playAddAnimation(sourceEl, targetEl, type){
  if(!sourceEl || !targetEl) return;

  const wrap = document.getElementById("wrap");
  const wr = wrap.getBoundingClientRect();
  const sr = sourceEl.getBoundingClientRect();
  const tr = targetEl.getBoundingClientRect();

  const startX = sr.left - wr.left + sr.width/2;
  const startY = sr.top - wr.top + sr.height/2;
  const endX = tr.left - wr.left + tr.width/2;
  const endY = tr.top - wr.top + tr.height/2;

  const dot = document.createElement("div");
  dot.className = `transfer-dot ${chordTypeForAnimation(type)}`;
  dot.style.left = `${startX - 6}px`;
  dot.style.top = `${startY - 6}px`;
  dot.style.setProperty("--dx", `${endX - startX}px`);
  dot.style.setProperty("--dy", `${endY - startY}px`);
  wrap.appendChild(dot);

  sourceEl.classList.remove("transfer-pulse");
  void sourceEl.offsetWidth;
  sourceEl.classList.add("transfer-pulse");

  targetEl.classList.remove("added-pop");
  void targetEl.offsetWidth;
  targetEl.classList.add("added-pop");

  setTimeout(()=>dot.remove(), 520);
}

      parts.forEach(p=>seq.push({name:p,type:"lead",beats:2,fn:item.fn,target:dataForDisplay(selectedDiatonic).chord}));
    } else {
      seq.push({name:item.name,type:"lead",beats:4,fn:item.fn,target:dataForDisplay(selectedDiatonic).chord});
    }
    seq.push({name:dataForDisplay(selectedDiatonic).chord,type:"diatonic",beats:4,fn:"target"});
  } else if(type==="sub"){
    seq.push({name:item.name,type:"sub",beats:4,fn:item.fn,target:dataForDisplay(selectedDiatonic).chord});

}

function guessChordTypeFromText(chord){
  const clean = chord.replace(/^\[/,"").replace(/\]$/,"");
  const baseClean = reverseToBaseChord ? reverseToBaseChord(clean) : clean;
  const allDiatonic = order.map(k => dataForDisplay(k).chord);
  if(allDiatonic.includes(clean)) return "diatonic";

  // Prefer color coding based on the currently visible chord sets.
  const visibleLead = dataForDisplay(currentKey).leads.map(i=>i.name);
  const visibleSub = dataForDisplay(currentKey).subs.map(i=>i.name);
  if(visibleLead.includes(clean)) return "lead";
  if(visibleSub.includes(clean)) return "sub";

  // Bracketed chords are non-diatonic; default them to substitution color.
  if(chord.trim().startsWith("[")) return "sub";
  return "diatonic";
}

function tokenizeProgression(text){
  const tokens = [];
  // Bracketed items include non-diatonic chords, the saved key header, and
  // saved fingering codes. The chord token is intentionally broad enough to
  // keep extensions like maj9, m11, 13, 7♭9, and 6/9 intact.
  const re = /\[[^\]]+\]|\/|[A-G](?:#|♭|b)?(?:maj13|maj9|maj7|m7♭5|m7b5|m13|m11|m9|m7|m6|m|13|11|9|7♭9|7b9|7#9|7♯9|7♭13|7b13|7#11|7♯11|7|6\/9|6|add9|dim|°|ø)?/g;
  let m;
  while((m = re.exec(text)) !== null){
    tokens.push(m[0]);
  }
  return tokens;
}

function assimilateProgression(text, append=false){
  const tokens = tokenizeProgression(text);
  if(tokens.length === 0) return;

  if(!append){
    progressionArea.innerHTML = "";
  }

  let i = 0;
  let lastBox = null;
  while(i < tokens.length){
    const tok = tokens[i];

    if(tok === "/"){
      i++;
      continue;
    }

    let chord = tok;
    let bracketed = false;
    if(chord.startsWith("[") && chord.endsWith("]")){
      bracketed = true;
      chord = chord.slice(1,-1).trim();

      // [C/Am] is the saved key header, not a chord. Restore the key when
      // possible and do not add it to the progression.
      const keyMatch = KEY_OPTIONS.find(([root,label]) => label === chord);
      if(keyMatch){
        selectedKeyRoot = keyMatch[0];
        if(keySelect) keySelect.value = selectedKeyRoot;
        i++;
        continue;
      }

      // [x02020] or [x-10-9-8-x-x] is a saved fingering for the preceding
      // chord. Attach it to that chord rather than treating it as a chord.
      if(isFingeringCode(chord)){
        if(lastBox){
          lastBox.dataset.fingeringCode = chord;
          const tpl = fingeringTemplateFromCode(lastBox, chord);
          if(tpl && tpl.rootString) lastBox.dataset.rootString = String(tpl.rootString);
          refreshChordNotation(lastBox);
        }
        i++;
        continue;
      }
    }

    let beats = 1;
    i++;

    // A fingering code immediately after the chord belongs to this chord;
    // consume it before counting beat slashes.
    let pendingFingering = "";
    if(i < tokens.length && tokens[i].startsWith("[") && tokens[i].endsWith("]")){
      const maybeCode = tokens[i].slice(1,-1).trim();
      if(isFingeringCode(maybeCode)){
        pendingFingering = maybeCode;
        i++;
      }
    }

    while(i < tokens.length && tokens[i] === "/"){
      beats++;
      i++;
    }

    const type = bracketed ? guessChordTypeFromText(`[${chord}]`) : guessChordTypeFromText(chord);
    lastBox = addProgressionBox(chord, type, beats);
    if(pendingFingering){
      lastBox.dataset.fingeringCode = pendingFingering;
      const tpl = fingeringTemplateFromCode(lastBox, pendingFingering);
      if(tpl && tpl.rootString) lastBox.dataset.rootString = String(tpl.rootString);
      refreshChordNotation(lastBox);
    }
  }
}
