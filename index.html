<script id="cmPersistentFretboardScript1429">
(function installPersistentCompMapFretboard(){
  let relocating=false;

  function region(){
    return document.getElementById("cmPersistentFretboardRegion");
  }

  function popup(){
    return document.getElementById("arrangeFretboardPopup");
  }

  function mount(){
    const host=region();
    const boardPopup=popup();
    if(!host || !boardPopup || relocating) return;

    if(boardPopup.parentElement!==host){
      relocating=true;
      host.appendChild(boardPopup);
      relocating=false;
    }

    boardPopup.classList.add("show");
    boardPopup.style.removeProperty("z-index");
    boardPopup.style.removeProperty("display");
    boardPopup.style.removeProperty("visibility");
    document.body.classList.remove("fretboard-modal-open");

    const body=document.getElementById("arrangeFretboardBody");
    if(body && !body.firstElementChild && typeof window.openBlankArrangeFretboard==="function"){
      window.openBlankArrangeFretboard();
      if(boardPopup.parentElement!==host){
        relocating=true;
        host.appendChild(boardPopup);
        relocating=false;
      }
      document.body.classList.remove("fretboard-modal-open");
    }
  }

  function mountSoon(){
    mount();
    requestAnimationFrame(mount);
    setTimeout(mount,0);
    setTimeout(mount,80);
  }

  const observer=new MutationObserver(()=>{
    const host=region();
    const boardPopup=popup();
    if(host && boardPopup && boardPopup.parentElement!==host) mountSoon();
  });

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>{
      observer.observe(document.body,{childList:true,subtree:false});
      mountSoon();
    });
  }else{
    observer.observe(document.body,{childList:true,subtree:false});
    mountSoon();
  }

  /* Existing open routines sometimes append the old modal to body.
     Re-mount after the same user actions without changing their behavior. */
  document.addEventListener("click",()=>setTimeout(mount,0),true);
  document.addEventListener("touchend",()=>setTimeout(mount,0),true);
  window.addEventListener("resize",mountSoon,{passive:true});
  window.addEventListener("orientationchange",mountSoon,{passive:true});
})();
</script>

<script id="cmCompactProgressionScript1437">
(function installCompactProgression(){
  function start(){
    const shell=document.getElementById("cmShell");
    const left=document.querySelector(".cm-shell-left");
    const progression=document.getElementById("progressionArea");
    if(!shell || !left || !progression || document.getElementById("cmCurrentProgression")) return;

    const current=document.createElement("button");
    current.type="button";
    current.id="cmCurrentProgression";
    current.className="cm-current-progression";
    current.setAttribute("aria-expanded","false");
    current.innerHTML='<span class="cm-current-progression-label">Progression</span><span class="cm-current-progression-arrow">▼</span>';
    left.appendChild(current);

    const overlay=document.createElement("section");
    overlay.id="cmProgressionOverlay";
    overlay.className="cm-progression-overlay";
    overlay.setAttribute("aria-hidden","true");
    overlay.innerHTML=
      '<div class="cm-progression-overlay-head">'+
        '<div class="cm-progression-overlay-title">Progression</div>'+
        '<button type="button" class="cm-progression-overlay-close" aria-label="Close progression">×</button>'+
      '</div>'+
      '<div class="cm-progression-list-host"></div>';

    const layout=shell.querySelector(".cm-shell-layout");
    shell.appendChild(overlay);
    overlay.querySelector(".cm-progression-list-host").appendChild(progression);

    const label=current.querySelector(".cm-current-progression-label");
    const close=overlay.querySelector(".cm-progression-overlay-close");

    function chordBoxes(){
      return Array.from(progression.querySelectorAll(".prog-chord"));
    }

    function activeBox(){
      const boxes=chordBoxes();
      return boxes.find(box=>box.classList.contains("edit-selected")) ||
             boxes.find(box=>box.classList.contains("playing-chord")) ||
             (window.currentEngineVoicingBox && progression.contains(window.currentEngineVoicingBox)
               ? window.currentEngineVoicingBox : null) ||
             boxes[boxes.length-1] || null;
    }

    function textFor(box){
      if(!box) return "Progression";
      const chord=box.dataset.chord || box.dataset.baseChord || "";
      if(chord){
        return typeof displayName==="function" ? displayName(chord) : chord;
      }
      const visible=(box.innerText || box.textContent || "").replace(/\s+/g," ").trim();
      return visible.split(/\s+/)[0] || "Progression chord";
    }

    function update(){
      const box=activeBox();
      label.textContent=textFor(box);
      chordBoxes().forEach(b=>b.toggleAttribute("aria-current",b===box));
    }

    function open(){
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden","false");
      current.classList.add("is-open");
      current.setAttribute("aria-expanded","true");
      update();
      const box=activeBox();
      if(box) requestAnimationFrame(()=>box.scrollIntoView({block:"center",behavior:"auto"}));
    }

    function hide(){
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden","true");
      current.classList.remove("is-open");
      current.setAttribute("aria-expanded","false");
      update();
    }

    current.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      overlay.classList.contains("show") ? hide() : open();
    });
    close.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      hide();
    });

    progression.addEventListener("click",e=>{
      const box=e.target.closest(".prog-chord");
      if(!box) return;
      setTimeout(()=>{
        update();
      },0);
    },true);

    const observer=new MutationObserver(update);
    observer.observe(progression,{
      childList:true,
      subtree:true,
      attributes:true,
      characterData:true,
      attributeFilter:["class","data-chord","data-base-chord","data-fingering-code","data-beats"]
    });

    update();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(start,30));
  }else{
    setTimeout(start,30);
  }
})();
</script>

<script id="cmLeftVoicingsWorkspaceScript1439">
(function installLeftVoicingsWorkspace(){
  function start(){
    const shell=document.getElementById("cmShell");
    const left=shell && shell.querySelector(".cm-shell-left");
    const popup=document.getElementById("diagramPopup");
    const edit=document.getElementById("editPopup");
    const progression=document.getElementById("progressionArea");
    if(!shell || !left || !popup || !edit || !progression) return;
    if(document.getElementById("cmVoicingWorkspaceHead")) return;

    left.appendChild(popup);
    popup.classList.add("cm-left-voicing-workspace");
    edit.classList.add("cm-define-overlay");
    shell.appendChild(edit);

    const head=document.createElement("div");
    head.id="cmVoicingWorkspaceHead";
    head.className="cm-voicing-workspace-head";
    head.innerHTML=
      '<button type="button" class="cm-voicing-back" aria-label="Back to harmony">‹</button>'+
      '<div class="cm-voicing-title">Voicings</div>'+
      '<div class="cm-voicing-meta">No chord selected</div>';

    const controls=document.createElement("div");
    controls.className="cm-voicing-controls";
    controls.innerHTML=
      '<button type="button" class="cm-voicing-define">Define</button>'+
      '<button type="button" class="cm-voicing-beat cm-voicing-beat-minus" aria-label="Remove beat">−</button>'+
      '<button type="button" class="cm-voicing-beat cm-voicing-beat-plus" aria-label="Add beat">+</button>';

    popup.insertBefore(controls,popup.firstChild);
    popup.insertBefore(head,popup.firstChild);

    const back=head.querySelector(".cm-voicing-back");
    const title=head.querySelector(".cm-voicing-title");
    const meta=head.querySelector(".cm-voicing-meta");
    const define=controls.querySelector(".cm-voicing-define");
    const minus=controls.querySelector(".cm-voicing-beat-minus");
    const plus=controls.querySelector(".cm-voicing-beat-plus");

    function currentBox(){
      return (typeof editingChord!=="undefined" && editingChord) ||
             (typeof currentEngineVoicingBox!=="undefined" && currentEngineVoicingBox) ||
             null;
    }

    function updateHeader(){
      const box=currentBox();
      if(!box){
        title.textContent="Voicings";
        meta.textContent="No chord selected";
        return;
      }
      const name=typeof window.cmDisplayedChordName==="function"
        ? window.cmDisplayedChordName(box,{voicingAware:true,fallback:"Chord"})
        : (typeof displayName==="function"
            ? displayName(box.dataset.chord || box.dataset.baseChord || "Chord")
            : (box.dataset.chord || "Chord"));
      const beats=Number(box.dataset.beats || 4);
      title.textContent=name;
      meta.textContent=beats+" beat"+(beats===1?"":"s");
    }

    function showFor(box){
      if(!box) return;
      if(typeof window.cmSynchronizeChordVoicingState==="function"){
        window.cmSynchronizeChordVoicingState(box,{
          source:"voicing-workspace",
          refreshFretboard:false
        });
      }
      left.classList.add("voicing-workspace-open");
      popup.classList.add("show");
      edit.classList.remove("show");
      if(typeof fillDiagramGrid==="function") fillDiagramGrid(box);
      updateHeader();
    }

    function backToHarmony(){
      window.cmPentatonicContextOn=false;
      edit.classList.remove("show");
      popup.classList.remove("show");
      left.classList.remove("voicing-workspace-open");
      if(typeof hideEditPopup==="function") hideEditPopup();
      if(typeof refreshOpenArrangeFretboard==="function"){
        refreshOpenArrangeFretboard();
      }
    }

    back.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      backToHarmony();
    });

    define.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      const box=currentBox();
      if(!box) return;
      if(edit.classList.contains("show")){
        edit.classList.remove("show");
        document.body.classList.remove("options-panel-open");
        return;
      }
      if(typeof fillExtensionGrid==="function") fillExtensionGrid(box);

      // 1.6.21: Use the same opening path both initially and after an
      // extension is selected. Previously the first click only added
      // "show", while selecting an extension called positionEditPopup(),
      // causing the popup to switch into a different scrolling layout.
      if(typeof positionEditPopup==="function"){
        positionEditPopup(box);
      }else{
        edit.classList.add("show");
        document.body.classList.add("options-panel-open");
      }
    });

    function adjustBeats(delta){
      const box=currentBox();
      if(!box) return;
      const old=Math.max(1,Number(box.dataset.beats || 4));
      box.dataset.beats=String(Math.max(1,old+delta));
      if(typeof refreshChordNotation==="function") refreshChordNotation(box);
      if(typeof copyProgressionNow==="function") copyProgressionNow();
      updateHeader();
    }
    minus.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation(); adjustBeats(-1);
    });
    plus.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation(); adjustBeats(1);
    });

    /* Existing progression clicks still run first. After they establish editingChord
       and fill the engine grids, present those same live controls in the workspace. */
    progression.addEventListener("click",e=>{
      const box=e.target.closest(".prog-chord");
      if(!box) return;
      setTimeout(()=>showFor(box),0);
    },true);

    /* Selecting a miniature keeps the workspace open and refreshes the permanent board. */
    popup.addEventListener("click",e=>{
      if(e.target.closest(".diagram-card")) setTimeout(updateHeader,0);
    },true);

    const observer=new MutationObserver(updateHeader);
    observer.observe(progression,{
      subtree:true,
      attributes:true,
      attributeFilter:["data-beats","data-chord","data-base-chord","data-fingering-code"]
    });

    window.cmOpenVoicingWorkspace=showFor;
    window.cmCloseVoicingWorkspace=backToHarmony;
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(start,60));
  }else{
    setTimeout(start,60);
  }
})();
</script>

        box.dataset.voicingId="";

                  (typeof currentEngineVoicingBox!=="undefined" && currentEngineVoicingBox);
        if(!box) return;
        const chordAfter=box.dataset.chord || box.dataset.baseChord || "";
        if(chordAfter===chordBefore) return;

        box.dataset.diagramId="";
        box.dataset.voicingId="";
        box.dataset.voicingSource="";
        box.dataset.voicingLabel="";

    });

      if(e.key==="Escape" && popup.classList.contains("show")) hide();

      if(popup.parentElement!==shell) shell.appendChild(popup);

      popup.style.removeProperty("right");
      popup.style.removeProperty("bottom");
      popup.style.removeProperty("transform");

    [
      "cmProgressionOverlay",
      "cmToolsOverlay",

    });

    document.addEventListener("DOMContentLoaded",()=>setTimeout(start,160));
  }else{
    setTimeout(start,160);

})();

<script id="cmProgressionEditControlsScript1448">
(function installProgressionEditControls(){
  function start(){
    const overlay=document.getElementById("cmProgressionOverlay");
    const listHost=overlay && overlay.querySelector(".cm-progression-list-host");
    const progression=document.getElementById("progressionArea");
    const minus=document.getElementById("minusBeatBtn");
    const plus=document.getElementById("plusBeatBtn");
    const replace=document.getElementById("replaceChordBtn");
    const del=document.getElementById("deleteChordBtn");
    if(!overlay || !listHost || !progression || !minus || !plus || !replace || !del ||
       document.getElementById("cmProgressionEditActions")) return;

    const actions=document.createElement("div");
    actions.id="cmProgressionEditActions";
    actions.className="cm-progression-edit-actions";
    overlay.appendChild(actions);
    [minus,plus,replace,del].forEach(button=>actions.appendChild(button));

    function boxes(){
      return Array.from(progression.querySelectorAll(".prog-chord"));
    }

    function activeBox(){
      return boxes().find(box=>box.classList.contains("edit-selected")) ||
             boxes().find(box=>box.classList.contains("playing-chord")) ||
             (typeof editingChord!=="undefined" && editingChord &&
              progression.contains(editingChord) ? editingChord : null) ||
             (typeof currentEngineVoicingBox!=="undefined" &&
              currentEngineVoicingBox &&
              progression.contains(currentEngineVoicingBox)
                ? currentEngineVoicingBox : null) ||
             boxes()[boxes().length-1] || null;
    }

    function ensureActive(){
      const box=activeBox();
      if(!box) return null;

      if(typeof editingChord!=="undefined"){
        editingChord=box;
      }
      boxes().forEach(item=>item.classList.toggle("edit-selected",item===box));
      return box;
    }

    function sync(){
      const box=activeBox();
      const disabled=!box;
      [minus,plus,replace,del].forEach(button=>{
        button.disabled=disabled;
      });
    }

    /* Opening the progression popup establishes the currently displayed event
       as the edit target for Beat, Replace, and Delete. */
    const launcher=document.getElementById("cmCurrentProgression");
    if(launcher){
      launcher.addEventListener("click",()=>{
        setTimeout(()=>{
          ensureActive();
          sync();
        },0);
      },true);
    }

    progression.addEventListener("click",e=>{
      const box=e.target.closest(".prog-chord");
      if(!box) return;
      if(typeof editingChord!=="undefined") editingChord=box;
      boxes().forEach(item=>item.classList.toggle("edit-selected",item===box));
      setTimeout(sync,0);
    },true);

    actions.addEventListener("pointerdown",e=>{
      const button=e.target.closest("button");
      if(!button) return;
      ensureActive();
    },true);

    /* Editing actions refresh in place and leave the progression popup open. */
    actions.addEventListener("click",e=>{
      const button=e.target.closest("button");
      if(!button) return;
      setTimeout(()=>{
        sync();
        overlay.classList.add("show");
        overlay.setAttribute("aria-hidden","false");
        const current=document.getElementById("cmCurrentProgression");
        if(current){
          current.classList.add("is-open");
          current.setAttribute("aria-expanded","true");
        }
      },0);
    },true);

    const observer=new MutationObserver(sync);
    observer.observe(progression,{childList:true,subtree:true,attributes:true});
    sync();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(start,240));
  }else{
    setTimeout(start,240);
  }
})();
</script>

<script id="cmProgressionSelectionSync1449">
(function synchronizeCompactProgressionWithSelectedVoicing(){
  function chordName(box){
    if(!box) return "Progression";
    const chord=box.dataset.chord || box.dataset.baseChord || "";
    if(!chord) return "Progression";
    return typeof window.cmDisplayedChordName==="function"
      ? window.cmDisplayedChordName(box,{voicingAware:true,fallback:"Progression"})
      : (typeof displayName==="function" ? displayName(chord) : chord);
  }

  function label(){
    return document.querySelector(
      "#cmCurrentProgression .cm-current-progression-label"
    );
  }

  function progression(){
    return document.getElementById("progressionArea");
  }

  function validBox(box){
    const area=progression();
    return !!(box && area && area.contains(box) &&
              box.classList && box.classList.contains("prog-chord"));
  }

  function setCurrent(box){
    if(!validBox(box)) return;
    window.cmCurrentProgressionBox=box;
    const out=label();
    if(out) out.textContent=chordName(box);
  }

  function currentFromState(){
    if(validBox(window.cmCurrentProgressionBox)){
      return window.cmCurrentProgressionBox;
    }
    if(typeof currentEngineVoicingBox!=="undefined" &&
       validBox(currentEngineVoicingBox)){
      return currentEngineVoicingBox;
    }
    if(typeof editingChord!=="undefined" && validBox(editingChord)){
      return editingChord;
    }
    const area=progression();
    if(!area) return null;
    return area.querySelector(".prog-chord.edit-selected") ||
           area.querySelector(".prog-chord.playing-chord") ||
           null;
  }

  function refresh(){
    const box=currentFromState();
    const out=label();
    if(box){
      window.cmCurrentProgressionBox=box;
      if(out) out.textContent=chordName(box);
    }else if(out){
      out.textContent="Progression";
    }
  }

  function install(){
    const area=progression();
    const voicingPopup=document.getElementById("diagramPopup");
    const back=document.querySelector(".cm-voicing-back");
    if(!area) return;

    /* Selecting a progression event makes it the canonical current event. */
    area.addEventListener("click",function(e){
      const box=e.target.closest(".prog-chord");
      if(!box) return;
      setCurrent(box);
    },true);

    /* A voicing card always belongs to currentEngineVoicingBox/editingChord.
       Capture that exact event before any second-tap return to Harmony. */
    if(voicingPopup){
      voicingPopup.addEventListener("click",function(e){
        const card=e.target.closest(".diagram-card");
        if(!card) return;
        const box=
          (typeof currentEngineVoicingBox!=="undefined" &&
           validBox(currentEngineVoicingBox) ? currentEngineVoicingBox : null) ||
          (typeof editingChord!=="undefined" &&
           validBox(editingChord) ? editingChord : null);
        if(box){
          setCurrent(box);
          setTimeout(()=>setCurrent(box),0);
          setTimeout(()=>setCurrent(box),80);
        }
      },true);
    }

    /* Back to Harmony must preserve the event whose voicing is on the board. */
    if(back){
      back.addEventListener("click",function(){
        const box=
          (typeof currentEngineVoicingBox!=="undefined" &&
           validBox(currentEngineVoicingBox) ? currentEngineVoicingBox : null) ||
          currentFromState();
        if(box){
          setCurrent(box);
          setTimeout(()=>setCurrent(box),0);
          setTimeout(()=>setCurrent(box),80);
        }
      },true);
    }

    /* Also cover the second-tap path, which calls cmCloseVoicingWorkspace. */
    const originalClose=window.cmCloseVoicingWorkspace;
    if(typeof originalClose==="function" &&
       !originalClose.cmSelectionSyncWrapped){
      const wrapped=function(){
        const box=
          (typeof currentEngineVoicingBox!=="undefined" &&
           validBox(currentEngineVoicingBox) ? currentEngineVoicingBox : null) ||
          (typeof editingChord!=="undefined" &&
           validBox(editingChord) ? editingChord : null) ||
          currentFromState();
        if(box) setCurrent(box);
        const result=originalClose.apply(this,arguments);
        if(box){
          setTimeout(()=>setCurrent(box),0);
          setTimeout(()=>setCurrent(box),80);
        }
        return result;
      };
      wrapped.cmSelectionSyncWrapped=true;
      window.cmCloseVoicingWorkspace=wrapped;
    }

    new MutationObserver(refresh).observe(area,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:["class","data-chord","data-base-chord"]
    });

    refresh();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,280));
  }else{
    setTimeout(install,280);
  }
})();
</script>
<script id="cmNewChordUpdatesProgressionButton1450">
(function updateCurrentChordWhenProgressionGrows(){
  function area(){
    return document.getElementById("progressionArea");
  }

  function validBox(box){
    const root=area();
    return !!(box && root && root.contains(box) &&
      box.classList && box.classList.contains("prog-chord"));
  }

  function nameFor(box){
    if(!box) return "Progression";
    const chord=box.dataset.chord || box.dataset.baseChord || "";
    if(!chord) return "Progression";
    return typeof window.cmDisplayedChordName==="function"
      ? window.cmDisplayedChordName(box,{voicingAware:true,fallback:"Progression"})
      : (typeof displayName==="function" ? displayName(chord) : chord);
  }

  function show(box){
    if(!validBox(box)) return;
    window.cmCurrentProgressionBox=box;
    const label=document.querySelector(
      "#cmCurrentProgression .cm-current-progression-label"
    );
    if(label) label.textContent=nameFor(box);
  }

  function install(){
    const root=area();
    if(!root || root.dataset.cmNewChordSync==="1") return;
    root.dataset.cmNewChordSync="1";

    let known=new Set(
      Array.from(root.querySelectorAll(".prog-chord"))
    );

    const observer=new MutationObserver(records=>{
      let newest=null;

      for(const record of records){
        for(const node of record.addedNodes){
          if(node.nodeType!==1) continue;

          if(node.classList && node.classList.contains("prog-chord")){
            newest=node;
          }

          const descendants=node.querySelectorAll
            ? Array.from(node.querySelectorAll(".prog-chord"))
            : [];
          if(descendants.length){
            newest=descendants[descendants.length-1];
          }
        }
      }

      const current=Array.from(root.querySelectorAll(".prog-chord"));
      const genuinelyNew=current.filter(box=>!known.has(box));

      if(genuinelyNew.length){
        newest=genuinelyNew[genuinelyNew.length-1];
      }

      known=new Set(current);

      if(newest){
        show(newest);
        setTimeout(()=>show(newest),0);
        setTimeout(()=>show(newest),80);
      }
    });

    observer.observe(root,{
      childList:true,
      subtree:true
    });

    /* Existing Add/confirm paths can update an existing node rather than
       inserting a new one. Capture the last progression event after Build
       actions complete as a fallback. */
    document.addEventListener("click",function(e){
      const clicked=e.target.closest(
        "#confirmBtn, #addBtn, .build-selected, .rect, .map-cell"
      );
      if(!clicked) return;

      setTimeout(function(){
        const boxes=Array.from(root.querySelectorAll(".prog-chord"));
        const selected=
          boxes.find(box=>box.classList.contains("edit-selected")) ||
          boxes[boxes.length-1] ||
          null;

        if(selected) show(selected);
      },40);
    },true);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,320));
  }else{
    setTimeout(install,320);
  }
})();
</script>

<script id="cmFixedMiddleHarmonyInfoScript1452">
(function installFixedHarmonyInfoBody(){

      document.querySelector(".popup.cm-harmony-info-overlay");

    if(!popup || popup.dataset.cmFixedMiddleInfo==="1") return;

        "minWidth","minHeight","maxWidth","maxHeight",
        "transform","overflow"
      ].forEach(prop=>popup.style.removeProperty(prop));
    }

    clearInlineGeometry();

    const observer=new MutationObserver(()=>{
      clearInlineGeometry();

      /* Old rendering can replace the popup contents. Re-wrap them while
         preserving the fixed close button. */
      let body=popup.querySelector(".cm-harmony-info-scroll");
      if(!body){
        body=document.createElement("div");
        body.className="cm-harmony-info-scroll";

<script id="cmHarmonyExplorationFretboardScript1453">
(function installHarmonyExplorationFretboard(){
  function normalizePc(value){
    return ((Number(value)%12)+12)%12;
  }

  function chordPitchClasses(chordName){
    if(!chordName) return [];
    try{
      return Array.from(new Set(
        parseChordNotes(chordName)
          .map(note=>pc(note))
          .filter(value=>value!==undefined && value!==null)
          .map(normalizePc)
      ));
    }catch(_){
      return [];
    }
  }

  function explorationLabelMode(){
    const mode=window.cmExplorationLabelMode;
    return mode==="chord" || mode==="letter" ? mode : "diatonic";
  }

  function referenceRootPc(chordRootPc){
    if(explorationLabelMode()==="diatonic"){
      try{
        if(typeof selectedKeyRoot!=="undefined"){
          return normalizePc(pc(selectedKeyRoot));
        }
        const key=document.getElementById("keySelect");
        if(key && key.value){
          return normalizePc(pc(key.value));
        }
      }catch(_){}
    }
    return normalizePc(chordRootPc);
  }

  function intervalLabel(notePc,chordRootPc){
    if(explorationLabelMode()==="letter"){
      if(typeof pcToDisplayName==="function"){
        return pcToDisplayName(normalizePc(notePc)).replaceAll("#","♯");
      }
      const names=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
      return names[normalizePc(notePc)] || "";
    }

    const referencePc=referenceRootPc(chordRootPc);
    const interval=normalizePc(notePc-referencePc);

    if(explorationLabelMode()==="chord"){
      const chordLabels=[
        "1","♭9","9","♭3","3","11",
        "♭5","5","♯5/♭13","13","♭7","7"
      ];
      return chordLabels[interval] || "";
    }

    if(typeof chromaticIntervalDegreeLabel==="function"){
      return chromaticIntervalDegreeLabel(interval);
    }
    const labels=["1","♭2","2","♭3","3","4","♭5","5","♯5","6","♭7","7"];
    return labels[interval] || "";
  }

  function tuning(){
    if(typeof compMapEngineTuning==="function"){
      const live=compMapEngineTuning();
      if(Array.isArray(live) && live.length===6) return live.map(Number);
    }
    return Array.isArray(window.STRING_OPEN_MIDI)
      ? window.STRING_OPEN_MIDI.map(Number)
      : [40,45,50,55,59,64];
  }

  function explorationHtml(chordName){
    const chordPcs=chordPitchClasses(chordName);
    if(!chordPcs.length) return {fretted:"",open:""};

    const rootPc=normalizePc(rootPcFromChordName(chordName));
    const keyPcs=new Set(
      (typeof diatonicPcsForCurrentKey==="function"
        ? diatonicPcsForCurrentKey()
        : []
      ).map(normalizePc)
    );
    const openMidi=tuning();

    const fretted=[];
    const open=[];

    for(let stringIndex=0; stringIndex<6; stringIndex++){
      for(let fret=0; fret<=15; fret++){
        const notePc=normalizePc(openMidi[stringIndex]+fret);
        if(!chordPcs.includes(notePc)) continue;

        const classes=[
          keyPcs.has(notePc) ? "in-key" : "out-key",
          notePc===rootPc ? "root" : ""
        ].filter(Boolean).join(" ");

        const label=intervalLabel(notePc,rootPc);

        if(fret===0){
          open.push(
            `<span class="gm-exact-explore-open ${classes}" `+
            `style="left:${guitMapStringX(stringIndex)}px">${label}</span>`
          );
        }else{
          fretted.push(
            `<span class="gm-exact-explore-mark ${classes}" `+
            `style="left:${guitMapStringX(stringIndex)}px;`+
            `top:${guitMapFretCenter(fret)}px">${label}</span>`
          );
        }
      }
    }

    return {fretted:fretted.join(""),open:open.join("")};
  }

  function showChord(chordName){
    if(!chordName || typeof renderExactGuitMapBoard!=="function") return;
    if(!arrangeFretboardBody || !arrangeFretboardPopup) return;

    const previousChord=window.cmHarmonyExplorationChord || "";
    const changing=!!previousChord && previousChord!==chordName;

    let previousFretted=[];
    let previousOpen=[];

    if(changing){
      const previousBoard=arrangeFretboardBody.querySelector(".gm-exact-board");
      const previousOpenRow=arrangeFretboardBody.querySelector(".gm-exact-openrow");

      if(previousBoard){
        previousFretted=Array.from(
          previousBoard.querySelectorAll(".gm-exact-explore-mark")
        ).map(marker=>marker.cloneNode(true));
      }

      if(previousOpenRow){
        previousOpen=Array.from(
          previousOpenRow.querySelectorAll(".gm-exact-explore-open")
        ).map(marker=>marker.cloneNode(true));
      }
    }

    const marks=explorationHtml(chordName);

    currentArrangeFretboardState={
      name:chordName,
      tpl:null,
      rootPc:rootPcFromChordName(chordName),
      box:null,
      exploration:true
    };
    arrangeFretboardCurrentBox=null;
    currentEngineVoicingBox=null;

    if(arrangeFretboardTitle){
      arrangeFretboardTitle.textContent=displayName(chordName);
    }

    arrangeFretboardBody.innerHTML=renderExactGuitMapBoard(null,0,null);

    const board=arrangeFretboardBody.querySelector(".gm-exact-board");
    const openRow=arrangeFretboardBody.querySelector(".gm-exact-openrow");

    if(board) board.insertAdjacentHTML("beforeend",marks.fretted);
    if(openRow) openRow.insertAdjacentHTML("beforeend",marks.open);

    if(changing){
      const oldMarkers=[];

      previousFretted.forEach(marker=>{
        marker.classList.add("gm-crossfade-previous");
        marker.style.opacity="1";
        board?.appendChild(marker);
        oldMarkers.push(marker);
      });

      previousOpen.forEach(marker=>{
        marker.classList.add("gm-crossfade-previous");
        marker.style.opacity="1";
        openRow?.appendChild(marker);
        oldMarkers.push(marker);
      });

      const newMarkers=Array.from(
        arrangeFretboardBody.querySelectorAll(
          ".gm-exact-explore-mark:not(.gm-crossfade-previous)," +
          ".gm-exact-explore-open:not(.gm-crossfade-previous)"
        )
      );

      newMarkers.forEach(marker=>{
        marker.style.opacity="0";
      });

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          oldMarkers.forEach(marker=>{
            marker.style.opacity="0";
          });
          newMarkers.forEach(marker=>{
            marker.style.opacity="1";
          });
        });
      });

      setTimeout(()=>{
        oldMarkers.forEach(marker=>marker.remove());
      },2050);
    }

    if(typeof bindExactGuitMapComponent==="function"){
      bindExactGuitMapComponent();
    }
    if(typeof clearArrangeNearbyOverlay==="function"){
      clearArrangeNearbyOverlay();
    }

    arrangeFretboardPopup.classList.add("show");
    arrangeFretboardPopup.style.setProperty("visibility","visible","important");
    arrangeFretboardPopup.style.setProperty("display","block","important");

    window.cmHarmonyExplorationChord=chordName;

    if(typeof window.cmShowExplorationContextMessage==="function"){
      window.cmShowExplorationContextMessage(chordName);
    }
  }

  function clear(){
    window.cmHarmonyExplorationChord="";
    if(typeof openBlankArrangeFretboard==="function"){
      openBlankArrangeFretboard();
    }
  }

  function isBuilding(){
    return !!(
      (typeof addMode!=="undefined" && addMode) ||
      document.body.classList.contains("add-mode") ||
      document.body.classList.contains("build-await-target") ||
      document.body.classList.contains("ui-build-target")
    );
  }

  function install(){
    if(!["diatonic","chord","letter"].includes(window.cmExplorationLabelMode)){
      window.cmExplorationLabelMode="diatonic";
    }
    window.cmExplorationReference=window.cmExplorationLabelMode;

    document.addEventListener("click",function(e){
      const marker=e.target.closest(
        ".gm-exact-explore-mark:not(.gm-crossfade-previous),"+
        ".gm-exact-explore-open:not(.gm-crossfade-previous)"
      );
      if(!marker || !window.cmHarmonyExplorationChord || isBuilding()) return;
      if(!marker.closest("#cmPersistentFretboardRegion")) return;

      e.preventDefault();
      e.stopPropagation();

      const modes=["diatonic","chord","letter"];
      const current=explorationLabelMode();
      window.cmExplorationLabelMode=
        modes[(modes.indexOf(current)+1)%modes.length];
      window.cmExplorationReference=window.cmExplorationLabelMode;
      showChord(window.cmHarmonyExplorationChord);
    },true);

    document.addEventListener("click",function(e){
      const chordButton=e.target.closest(".map-cell[data-chord-name], .rect[data-chord-name]");
      if(!chordButton) return;

      setTimeout(function(){
        if(isBuilding()) return;

        /* Side chords toggle off on a second tap. */
        if(chordButton.classList.contains("rect") &&
           !chordButton.classList.contains("active")){
          clear();
          return;
        }

        const chordName=chordButton.dataset.chordName || "";
        if(chordName) showChord(chordName);
      },0);
    },true);

    /* Key or Mode changes return Harmony to its quiet resting state. */
    ["keySelect","modeSelect"].forEach(id=>{
      const control=document.getElementById(id);
      if(control){
        control.addEventListener("change",()=>setTimeout(clear,0));
      }
    });

    /* Entering Build clears exploration; progression/voicing actions already
       replace it through the existing fretboard renderer. */
    const build=document.getElementById("cmBuildLauncher");
    if(build){
      build.addEventListener("click",function(){
        setTimeout(function(){
          if(isBuilding()) clear();
        },0);
      },true);
    }

    window.cmShowHarmonyExploration=showChord;
    window.cmClearHarmonyExploration=clear;
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,440));
  }else{
    setTimeout(install,440);
  }
})();
</script>
<style id="cmPentatonicContext1465">.gm-pentatonic-ring,.gm-pentatonic-open-ring{position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.95);border-radius:50%;background:transparent;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900;line-height:1;pointer-events:none;z-index:30;text-shadow:0 1px 2px rgba(0,0,0,.95);box-shadow:0 1px 4px rgba(0,0,0,.7)}.gm-pentatonic-open-ring{top:32px}.gm-pentatonic-ring.key-root,.gm-pentatonic-open-ring.key-root{width:20px;height:20px}.diagram-card.cm-hold-active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 0 14px rgba(255,255,255,.20) !important}</style>
<script id="cmPentatonicContextScript1465">
(function installPentatonicContext(){
  window.cmPentatonicContextOn=false;

  function mod12(value){
    return ((Number(value)%12)+12)%12;
  }

  function keyPc(){
    try{
      if(typeof selectedKeyRoot!=="undefined"){
        const value=pc(selectedKeyRoot);
        if(value!==undefined) return mod12(value);
      }
      const key=document.getElementById("keySelect");
      if(key && key.value){
        const value=pc(key.value);
        if(value!==undefined) return mod12(value);
      }
    }catch(_){}
    return 0;
  }

  function liveTuning(){
    if(typeof compMapEngineTuning==="function"){
      const current=compMapEngineTuning();
      if(Array.isArray(current) && current.length===6){
        return current.map(Number);
      }
    }
    return [40,45,50,55,59,64];
  }

  function pentatonicRenderContext(tpl,rootPc){
    let frets=[];
    try{
      const values=tpl ? absoluteDiagramFrets(tpl,rootPc) : [];
      frets=Array.isArray(values)
        ? values.concat([null,null,null,null,null,null]).slice(0,6)
        : [];
    }catch(_){
      frets=[];
    }

    return {
      tuning:liveTuning(),
      keyRoot:keyPc(),
      occupied:frets.map(value=>
        Number.isFinite(Number(value)) ? Number(value) : null
      )
    };
  }

  function pentatonicMarkerData(
    context,
    stringIndex,
    fret,
    placement
  ){
    const notePc=mod12(context.tuning[stringIndex]+fret);
    const interval=mod12(notePc-context.keyRoot);

    if(![0,2,4,7,9].includes(interval)) return null;
    if(context.occupied[stringIndex]===fret) return null;

    const isKeyRoot=interval===0;
    const isOpen=placement==="open";

    return {
      className:
        (isOpen ? "gm-pentatonic-open-ring" : "gm-pentatonic-ring") +
        (isKeyRoot ? " key-root" : ""),
      label:isKeyRoot ? "K" : "",
      left:guitMapStringX(stringIndex),
      top:isOpen ? null : guitMapFretCenter(fret)
    };
  }

  function renderPentatonicMarker(
    context,
    stringIndex,
    fret,
    placement
  ){
    const marker=pentatonicMarkerData(
      context,
      stringIndex,
      fret,
      placement
    );

    if(!marker) return "";

    const position=placement==="open"
      ? `left:${marker.left}px`
      : `left:${marker.left}px;top:${marker.top}px`;

    return `<span class="${marker.className}" style="${position}">${marker.label}</span>`;
  }

  function renderPentatonicCollection(tpl,rootPc,box,placement){
    if(!window.cmPentatonicContextOn || !tpl || !box) return "";

    const context=pentatonicRenderContext(tpl,rootPc);
    const marks=[];

    if(placement==="open"){
      for(let stringIndex=0;stringIndex<6;stringIndex++){
        marks.push(renderPentatonicMarker(
          context,
          stringIndex,
          0,
          "open"
        ));
      }
      return marks.join("");
    }

    for(let stringIndex=0;stringIndex<6;stringIndex++){
      for(let fret=1;fret<=15;fret++){
        marks.push(renderPentatonicMarker(
          context,
          stringIndex,
          fret,
          "fretted"
        ));
      }
    }

    return marks.join("");
  }

  window.cmRenderPentatonicMarker=renderPentatonicMarker;

  window.renderPentatonicContextMarks=function(tpl,rootPc,box){
    return renderPentatonicCollection(
      tpl,
      rootPc,
      box,
      "fretted"
    );
  };

  window.renderPentatonicContextOpenMarks=function(tpl,rootPc,box){
    return renderPentatonicCollection(
      tpl,
      rootPc,
      box,
      "open"
    );
  };

  function commitVoicing(box,tpl,rootPc,templateCode){
    box.dataset.diagramId=tpl.id;
    box.dataset.voicingId=tpl.id;
    box.dataset.voicingSource=tpl.source || "engine";

    if(tpl.engineResult){
      box._engineVoicingResult=tpl.engineResult;
    }

    box.dataset.voicingLabel=tpl.name;
    box.dataset.rootString=String(tpl.rootString);
    box.dataset.fingeringCode=templateCode;

    if(typeof refreshChordNotation==="function"){
      refreshChordNotation(box);
    }
    if(typeof copyProgressionNow==="function"){
      copyProgressionNow();
    }

    const name=typeof window.cmDisplayedChordName==="function"
      ? window.cmDisplayedChordName(box,{voicingAware:true,tpl,fallback:"Chord"})
      : (typeof chordDisplayNameForVoicing==="function"
          ? chordDisplayNameForVoicing(box,tpl)
          : (typeof displayName==="function"
              ? displayName(box.dataset.chord || "Chord")
              : (box.dataset.chord || "Chord")));

    openArrangeFretboard(name,tpl,rootPc,box);

    if(typeof fillDiagramGrid==="function"){
      fillDiagramGrid(box);
    }
  }

  window.bindPentatonicLongPress=function(card,box,tpl,rootPc,templateCode){
    if(!card || card.dataset.cmPentatonicHoldBound==="1") return;
    card.dataset.cmPentatonicHoldBound="1";

    let timer=0;
    let startX=0;
    let startY=0;
    let pointerId=null;
    let fired=false;

    function cancel(){
      clearTimeout(timer);
      timer=0;
      pointerId=null;
      card.classList.remove("cm-hold-active");
    }

    card.addEventListener("pointerdown",event=>{
      if(event.pointerType==="mouse" && event.button!==0) return;

      fired=false;
      pointerId=event.pointerId;
      startX=event.clientX;
      startY=event.clientY;
      card.classList.add("cm-hold-active");

      timer=setTimeout(()=>{
        fired=true;
        card._cmLongPressHandled=true;
        window.cmPentatonicContextOn=!window.cmPentatonicContextOn;

        commitVoicing(box,tpl,rootPc,templateCode);

        if(navigator.vibrate){
          try{ navigator.vibrate(20); }catch(_){}
        }

        card.classList.remove("cm-hold-active");
      },550);
    });

    card.addEventListener("pointermove",event=>{
      if(pointerId!==event.pointerId) return;
      const distance=Math.hypot(
        event.clientX-startX,
        event.clientY-startY
      );
      if(distance>10) cancel();
    });

    card.addEventListener("pointerup",event=>{
      if(pointerId!==event.pointerId) return;
      clearTimeout(timer);
      timer=0;
      pointerId=null;
      card.classList.remove("cm-hold-active");

      if(fired){
        event.preventDefault();
        event.stopPropagation();
      }
    });

    card.addEventListener("pointercancel",cancel);
    card.addEventListener("pointerleave",event=>{
      if(event.pointerType==="mouse") cancel();
    });

    card.addEventListener("contextmenu",event=>{
      event.preventDefault();
    });
  };

  /* Key changes update an active pentatonic layer immediately. */
  ["keySelect","modeSelect"].forEach(id=>{
    const control=document.getElementById(id);
    if(!control) return;

    control.addEventListener("change",()=>{
      if(!window.cmPentatonicContextOn) return;
      if(typeof refreshOpenArrangeFretboard==="function"){
        setTimeout(refreshOpenArrangeFretboard,0);
      }
    });
  });
})();
</script>

<script id="cmManualBuilderShellFixScript1467">
(function repairManualBuilderEntry(){
  function install(){
    const shell=document.getElementById("cmShell");
    const overlay=document.getElementById("manualOverlay");
    const manualButton=document.getElementById("manualVoicingBtn");
    if(!shell || !overlay || !manualButton) return;

    overlay.classList.add("cm-manual-shell-overlay");

    function mount(){
      if(overlay.parentElement!==shell){
        shell.appendChild(overlay);
      }
    }

    /* Mount before the original button listener opens it. */
    manualButton.addEventListener("click",mount,true);

    /* Also catch any direct calls to openManualBuilder(). */
    const observer=new MutationObserver(()=>{
      if(overlay.classList.contains("show")){
        mount();
      }
    });
    observer.observe(overlay,{
      attributes:true,
      attributeFilter:["class"]
    });

    mount();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,760));
  }else{
    setTimeout(install,760);
  }
})();
</script>

(function synchronizeManualVoiceButton(){
  function install(){
    const voice=document.getElementById("manualVoiceBtn");
    const save=document.getElementById("manualSaveBtn");

<script id="cmExplorationContextMessageScript1479">
(function installExplorationContextMessage(){
  let hideTimer=0;
  let outsideListener=null;

  function keyName(){
    try{
      if(typeof selectedKeyRoot!=="undefined" && selectedKeyRoot){
        return typeof displayName==="function"
          ? displayName(String(selectedKeyRoot))
          : String(selectedKeyRoot);
      }

      const key=document.getElementById("keySelect");
      if(key && key.value){
        return typeof displayName==="function"
          ? displayName(String(key.value))
          : String(key.value);
      }
    }catch(_){}

    return "";
  }

  function removeOutsideListener(){
    if(outsideListener){
      document.removeEventListener("pointerdown",outsideListener,true);
      outsideListener=null;
    }
  }

  function hide(){
    clearTimeout(hideTimer);
    hideTimer=0;
    removeOutsideListener();

    const message=document.querySelector(
      "#cmPersistentFretboardRegion .gm-exploration-context-message"
    );
    if(message){
      message.classList.remove("show");
    }
  }

  function ensureMessage(){
    const shell=document.querySelector(
      "#cmPersistentFretboardRegion .gm-exact-shell"
    );
    if(!shell) return null;

    let message=shell.querySelector(".gm-exploration-context-message");
    if(!message){
      message=document.createElement("div");
      message.className="gm-exploration-context-message";
      message.setAttribute("role","status");
      message.setAttribute("aria-live","polite");
      shell.appendChild(message);
    }

    return message;
  }

  window.cmShowExplorationContextMessage=function(chordName){
    const message=ensureMessage();
    if(!message || !chordName) return;

    const chord=typeof displayName==="function"
      ? displayName(String(chordName))
      : String(chordName);
    const key=keyName();

    message.textContent=
      window.cmExplorationLabelMode==="diatonic" && key
        ? `${chord} chord referenced to key of ${key}`
        : `${chord} chord notes`;

    clearTimeout(hideTimer);
    removeOutsideListener();

    requestAnimationFrame(()=>{
      message.classList.add("show");
    });

    hideTimer=setTimeout(hide,3000);

    /* Install after the initiating click has completed, so that click does
       not immediately dismiss the message. */
    setTimeout(()=>{
      outsideListener=function(){
        hide();
      };
      document.addEventListener("pointerdown",outsideListener,true);
    },0);
  };

  window.cmHideExplorationContextMessage=hide;
})();
</script>

<script id="cmDedicatedProgressionVoicingViewScript1606">
(function installPersistentFretboardProgressionView(){
  let overlay=null;
  let items=null;

  function boxes(){
    return Array.from(document.querySelectorAll("#progressionArea .prog-chord"));
  }

  function ensure(){
    if(overlay) return;
    document.getElementById("cmProgressionVoicingView")?.remove();

    overlay=document.createElement("section");
    overlay.id="cmProgressionVoicingView";
    overlay.setAttribute("aria-hidden","true");
    overlay.innerHTML=
      '<div id="cmProgressionVoicingList">'+
        '<div class="cm-pvv-head">'+
          '<div class="cm-pvv-title">Progression voicings</div>'+
        '</div>'+
        '<div id="cmProgressionVoicingItems"></div>'+
        '<div class="cm-pvv-footer">'+
          '<button type="button" class="cm-pvv-bottom-close">Close</button>'+
        '</div>'+
      '</div>';

    const leftPanel=document.querySelector("#cmShell .cm-shell-left");
    (leftPanel || document.body).appendChild(overlay);
    items=overlay.querySelector("#cmProgressionVoicingItems");
    overlay.querySelector(".cm-pvv-bottom-close")?.addEventListener("click",close);

  }

  function entryFor(box){
    const code=box?.dataset?.fingeringCode || "";
    if(!isFingeringCode(code)) return null;
    const tpl=fingeringTemplateFromCode(box,code);
    if(!tpl) return null;

    return {
      box,
      tpl,
      rootPc:rootPcFromChordName(box.dataset.chord || box.dataset.baseChord || "C"),
      name:chordDisplayNameForVoicing(box,tpl,code)
    };
  }

  function choose(entry,item){
    if(!entry) return;

    items.querySelectorAll(".cm-pvv-item.selected").forEach(node=>{
      node.classList.remove("selected");
    });
    item?.classList.add("selected");

    if(typeof window.cmSynchronizeChordVoicingState==="function"){
      window.cmSynchronizeChordVoicingState(entry.box,{
        source:"view",
        selectedViewItem:item,
        refreshFretboard:false
      });
    }else{
      window.cmCurrentProgressionBox=entry.box;
      if(typeof editingChord!=="undefined") editingChord=entry.box;
      if(typeof currentEngineVoicingBox!=="undefined"){
        currentEngineVoicingBox=entry.box;
      }
      document.querySelectorAll("#progressionArea .prog-chord").forEach(box=>{
        box.classList.toggle("edit-selected",box===entry.box);
      });
    }

    if(typeof openArrangeFretboard==="function"){
      openArrangeFretboard(entry.name,entry.tpl,entry.rootPc,entry.box);
    }

    document.body.classList.add("cm-persistent-view-open");
    overlay.classList.add("show");
  }

  function render(){
    ensure();
    items.innerHTML="";
    let first=null;

    const progression=boxes();

    progression.forEach(box=>{
      const entry=entryFor(box);
      const item=document.createElement("button");
      item.type="button";
      item.className="cm-pvv-item";

      const name=entry
        ? entry.name
        : chordDisplayNameForVoicing(box);

      if(entry){
        item.innerHTML=
          `<div class="cm-pvv-name">${name}</div>`+
          renderDiagramHtml(entry.tpl,entry.rootPc,box);
        item.addEventListener("click",()=>choose(entry,item));
        if(!first) first={entry,item};
      }else{
        item.disabled=true;
        item.innerHTML=
          `<div class="cm-pvv-name">${name}</div>`+
          '<div class="cm-pvv-empty">No saved voicing</div>';
      }

      items.appendChild(item);
    });

    if(!progression.length){
      items.innerHTML='<div class="cm-pvv-empty">No progression yet.</div>';
    }

    return first;
  }

  function open(){
    ensure();
    document.getElementById("cmToolsOverlay")?.classList.remove("show");

    const first=render();
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
    document.body.classList.add("cm-persistent-view-open");

    if(first) choose(first.entry,first.item);
  }

  function close(){
    overlay?.classList.remove("show");
    overlay?.setAttribute("aria-hidden","true");
    document.body.classList.remove("cm-persistent-view-open");

  }

  window.cmOpenProgressionVoicingView=open;
  window.cmCloseProgressionVoicingView=close;

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",ensure);
  }else{
    ensure();
  }
})();
</script>

<script id="cmSharedDisplayedChordName1623">
(function installSharedDisplayedChordName(){
  function validBox(box){
    return !!(
      box &&
      box.nodeType===1 &&
      box.classList &&
      box.classList.contains("prog-chord")
    );
  }

  function baseName(box,fallback){
    if(!validBox(box)) return fallback || "Chord";
    const raw=box.dataset.chord || box.dataset.baseChord || fallback || "Chord";
    return typeof displayName==="function" ? displayName(raw) : raw;
  }

  function displayedChordName(box,options){
    const opts=options || {};
    const fallback=opts.fallback || "Chord";
    if(!validBox(box)) return fallback;

    /* Preserve the established inversion/slash-name calculation whenever a
       concrete fingering is available. The legacy calculation remains the
       source of truth; this function is now the one public display gateway. */
    if(opts.voicingAware!==false && typeof chordDisplayNameForVoicing==="function"){
      try{
        return chordDisplayNameForVoicing(
          box,
          opts.tpl || null,
          opts.code || box.dataset.fingeringCode || ""
        );
      }catch(_){
        /* Fall through to the ordinary chord spelling. */
      }
    }

    return baseName(box,fallback);
  }

  window.cmDisplayedChordName=displayedChordName;
})();
</script>

<script id="cmSharedChordVoicingStateSync1622">
(function installSharedChordVoicingStateSync(){
  function validBox(box){
    return !!(
      box &&
      box.nodeType===1 &&
      box.classList &&
      box.classList.contains("prog-chord")
    );
  }

  function displayedChordName(box){
    if(!validBox(box)) return "";
    return typeof window.cmDisplayedChordName==="function"
      ? window.cmDisplayedChordName(box,{voicingAware:true,fallback:"Chord"})
      : (typeof displayName==="function"
          ? displayName(box.dataset.chord || box.dataset.baseChord || "Chord")
          : (box.dataset.chord || box.dataset.baseChord || "Chord"));
  }

  function synchronize(box,options){
    if(!validBox(box)) return null;

    const opts=options || {};

    /* One authoritative selected progression object. */
    window.cmCurrentProgressionBox=box;
    if(typeof editingChord!=="undefined") editingChord=box;
    if(typeof currentEngineVoicingBox!=="undefined"){
      currentEngineVoicingBox=box;
    }

    /* One authoritative selected progression highlight. */
    document.querySelectorAll("#progressionArea .prog-chord").forEach(node=>{
      node.classList.toggle("edit-selected",node===box);
    });

    /* Keep miniature selection aligned with the stored voicing. Existing
       renderers may rebuild these cards afterward; this safely reapplies the
       selection whenever matching card metadata is available. */
    const selectedId=box.dataset.voicingId || box.dataset.diagramId || "";
    const selectedCode=box.dataset.fingeringCode || "";
    document.querySelectorAll(
      "#diagramPopup .diagram-card.selected-diagram"
    ).forEach(card=>card.classList.remove("selected-diagram"));

    if(selectedId || selectedCode){
      document.querySelectorAll("#diagramPopup .diagram-card").forEach(card=>{
        const cardId=
          card.dataset.voicingId ||
          card.dataset.diagramId ||
          card.dataset.id ||
          "";
        const cardCode=
          card.dataset.fingeringCode ||
          card.dataset.code ||
          "";
        if(
          (selectedId && cardId===selectedId) ||
          (selectedCode && cardCode===selectedCode)
        ){
          card.classList.add("selected-diagram");
        }
      });
    }

    /* Keep the compact progression label and Voicing workspace heading in
       agreement with the selected chord, including slash/inversion names. */
    const name=displayedChordName(box);
    const compact=document.querySelector(
      "#cmCurrentProgression .cm-current-progression-label"
    );
    if(compact) compact.textContent=name;

    const title=document.querySelector("#cmVoicingWorkspaceHead .cm-voicing-title");
    const meta=document.querySelector("#cmVoicingWorkspaceHead .cm-voicing-meta");
    if(title) title.textContent=name;
    if(meta){
      const beats=Math.max(1,Number(box.dataset.beats || 4));
      meta.textContent=beats+" beat"+(beats===1?"":"s");
    }

    /* View has its own explicit board renderer. Other callers may request a
       refresh of the already-open persistent board after state is stored. */
    if(
      opts.refreshFretboard!==false &&
      typeof refreshOpenArrangeFretboard==="function"
    ){
      refreshOpenArrangeFretboard();
    }

    document.dispatchEvent(new CustomEvent("cm:chord-voicing-state-synced",{
      detail:{box:box,source:opts.source || "unknown"}
    }));

    return box;
  }

  window.cmSynchronizeChordVoicingState=synchronize;

  /* Voicing-card selections are performed by the legacy engine handler.
     Synchronize immediately afterward without replacing that proven handler. */
  document.addEventListener("click",event=>{
    const card=event.target.closest("#diagramPopup .diagram-card");
    if(!card) return;
    setTimeout(()=>{
      const box=
        (typeof currentEngineVoicingBox!=="undefined" &&
         validBox(currentEngineVoicingBox) &&
         currentEngineVoicingBox) ||
        (typeof editingChord!=="undefined" &&
         validBox(editingChord) &&
         editingChord) ||
        (validBox(window.cmCurrentProgressionBox) &&
         window.cmCurrentProgressionBox) ||
        null;
      if(box){
        synchronize(box,{
          source:"voicing-card",
          refreshFretboard:true
        });
      }
    },0);
  },true);

  /* Opening Define now begins from the same synchronized selected object. */
  document.addEventListener("click",event=>{
    if(!event.target.closest(".cm-voicing-define")) return;
    const box=
      (typeof currentEngineVoicingBox!=="undefined" &&
       validBox(currentEngineVoicingBox) &&
       currentEngineVoicingBox) ||
      (typeof editingChord!=="undefined" &&
       validBox(editingChord) &&
       editingChord) ||
      (validBox(window.cmCurrentProgressionBox) &&
       window.cmCurrentProgressionBox) ||
      null;
    if(box){
      synchronize(box,{
        source:"define",
        refreshFretboard:false
      });
    }
  },true);
})();
</script>

     the currently visible iPhone viewport. This is intentionally the final
     code in the file so earlier shell-relative and inline layout rules cannot
     override it. -->
<style id="cmExactVisualViewportThird1632">
#cmProgressionOverlay.cm-progression-overlay,
#cmBuildMethodOverlay.cm-build-method-overlay{
  box-sizing:border-box!important;
  top:auto!important;

#cmBuildMethodOverlay .cm-build-method-options{

  max-height:none!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior:contain!important;
}
#cmProgressionOverlay .cm-progression-overlay-head,
#cmBuildMethodOverlay .cm-build-method-head{
  flex:0 0 auto!important;
}
</style>
<script id="cmExactVisualViewportThirdScript1632">
(function enforceExactVisualViewportThird(){
  const ids=["cmProgressionOverlay","cmBuildMethodOverlay"];

  function visibleHeight(){
    return Math.round((window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight)/3);
  }

  function applyOne(el){
    if(!el) return;
    const px=visibleHeight()+"px";
    el.style.setProperty("height",px,"important");
    el.style.setProperty("min-height",px,"important");
    el.style.setProperty("max-height",px,"important");
    el.style.setProperty("bottom","10px","important");
    el.style.setProperty("top","auto","important");
    el.style.setProperty("box-sizing","border-box","important");
  }

  function applyAll(){
    ids.forEach(id=>applyOne(document.getElementById(id)));
  }

  function install(){
    applyAll();
    const observer=new MutationObserver(records=>{
      for(const record of records){
        const el=record.target;
        if(el.classList?.contains("show")) applyOne(el);
      }
    });
    ids.forEach(id=>{
      const el=document.getElementById(id);
      if(el) observer.observe(el,{attributes:true,attributeFilter:["class","style"]});
    });
    window.addEventListener("resize",applyAll,{passive:true});
    window.visualViewport?.addEventListener("resize",applyAll,{passive:true});
    window.visualViewport?.addEventListener("scroll",applyAll,{passive:true});
    document.addEventListener("pointerdown",()=>requestAnimationFrame(applyAll),true);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(install,0),{once:true});
  }else{
    setTimeout(install,0);
  }
})();
</script>
